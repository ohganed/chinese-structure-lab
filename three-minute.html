<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chinese Structure Lab · 3分</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#777;text-decoration:none}.pill{font-size:12px;color:#666;background:#fff;border-radius:999px;padding:8px 11px}.hero{margin:28px 0 15px}.tiny{font-size:11px;color:#888;letter-spacing:.09em}.hero h1{font-size:29px;margin:6px 0}.hero p{color:#777;line-height:1.6;margin:0}.card{background:#fff;border-radius:27px;padding:20px 18px;box-shadow:0 12px 34px #00000008}.progress{font-size:12px;color:#888;margin-bottom:12px}.flow{background:#f0eee8;border-radius:20px;padding:16px}.emoji{font-size:30px;letter-spacing:5px}.sceneTitle{font-size:20px;font-weight:760;margin-top:9px}.sceneText{font-size:14px;color:#666;line-height:1.65;margin-top:6px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.word{border:0;background:#ece9e1;border-radius:999px;padding:10px 13px;font:700 14px inherit}.sentence{margin-top:19px;border-top:1px solid #eee;padding-top:18px}.zh{font-size:36px;font-weight:790;line-height:1.3}.py{font-size:17px;color:#555;margin-top:5px}.meaning{font-size:17px;margin-top:10px}.audio{display:flex;gap:8px;margin-top:13px}.audio button,.next{border:0;border-radius:999px;padding:12px 15px;font-weight:750}.natural{background:#171717;color:#fff}.slow{background:#ece9e1}.next{width:100%;margin-top:18px;background:#171717;color:#fff;font-size:15px}.done{display:none;text-align:center;padding:28px 8px}.done.on{display:block}.done .big{font-size:36px}.done h2{font-size:24px}.done p{color:#666;line-height:1.65}.done a{display:inline-block;text-decoration:none;background:#171717;color:#fff;padding:13px 18px;border-radius:999px;font-weight:750;margin-top:8px}.hint{font-size:11px;color:#999;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app"><div class="top"><a class="back" href="./doorways.html">‹ 入口</a><div class="pill">約3分 · 3場面</div></div><div class="hero"><div class="tiny">THREE CONNECTED MOMENTS</div><h1>3つの場面を歩く</h1><p>別の入口で出会った中国語も、ここでは小さな物語の一部として戻ってきます。</p></div><div class="card" id="card"><div id="play"><div class="progress" id="progress"></div><div class="flow"><div class="emoji" id="emoji"></div><div class="sceneTitle" id="title"></div><div class="sceneText" id="text"></div></div><div class="words" id="words"></div><div class="sentence"><div class="zh" id="zh"></div><div class="py" id="py"></div><div class="meaning" id="meaning"></div><div class="audio"><button class="natural" onclick="speak(.9)">▶ Natural</button><button class="slow" onclick="speak(.4)">Slow · 0.4×</button></div></div><button class="next" id="next" onclick="advance()">次の場面 ›</button><div class="hint">正解・不正解はありません。場面の流れだけ追っても大丈夫です。</div></div><div class="done" id="done"><div class="big">🌿</div><h2>3つの場面がつながりました。</h2><p>今日出会った文は、疲れている日・旅行・買い物・Listeningなど別の入口でもまた戻ってきます。</p><a href="./doorways.html">入口へ戻る</a></div></div></div>
<script src="./sentence-bank.js"></script>
<script src="./sentence-bank-expansion-01.js"></script>
<script src="./sentence-bank-expansion-02.js"></script>
<script src="./sentence-bank-expansion-03.js"></script>
<script>
var BANK=window.CSLSentenceBank;
var ROUTES=[
{id:'cafe',ids:['csl-a1-social-001','csl-a1-food-001','csl-a1-social-005']},
{id:'city',ids:['csl-a1-city-001','csl-a1-city-002','csl-a1-city-003']},
{id:'shop',ids:['csl-a1-shop-001','csl-a1-shop-002','csl-a1-shop-003']},
{id:'health',ids:['csl-a1-health-001','csl-a1-health-002','csl-a1-social-006']},
{id:'home',ids:['csl-a1-home-001','csl-a1-home-005','csl-a1-home-003']}
];
/* Twenty extra connected routes make the 3-minute doorway five times wider.
   They are derived from stable IDs, while each session remains only 3 scenes. */
['daily','food','travel','shopping','social','work','health','service','hotel','plans'].forEach(function(tag){
  var ids=BANK.query({tags:[tag,'three-minute']}).filter(function(x){return /-20[1-9]$|-210$/.test(x.id)}).map(function(x){return x.id});
  if(ids.length>=9){ROUTES.push({id:tag+'-new-1',ids:ids.slice(0,3)});ROUTES.push({id:tag+'-new-2',ids:ids.slice(6,9)})}
});
var KEY='csl_active_time_session_v1',s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!s||Number(s.minutes)!==3)s={minutes:3,startedAt:new Date().toISOString(),targetMoments:3,density:'light',moments:0};
if(!s.miniRoute){var last=localStorage.getItem('csl_last_3min_route')||'',choices=ROUTES.filter(function(r){return r.id!==last}),pick=choices[Math.floor(Math.random()*choices.length)]||ROUTES[0];s.miniRoute=pick.id;s.miniIndex=0;try{localStorage.setItem('csl_last_3min_route',pick.id)}catch(e){}}
var route=ROUTES.filter(function(r){return r.id===s.miniRoute})[0]||ROUTES[0],scenes=route.ids.map(function(id){return BANK.get(id)}).filter(Boolean),i=Math.max(0,Math.min(2,Number(s.miniIndex)||0));
function save(){s.miniIndex=i;s.moments=i;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function speakWord(t){voice(t,.8)}
function render(){var x=scenes[i];document.getElementById('progress').textContent=(i+1)+' / '+scenes.length;document.getElementById('emoji').textContent=x.emoji;document.getElementById('title').textContent=x.title;document.getElementById('text').textContent=x.context;document.getElementById('words').innerHTML=(x.words||[]).map(function(w){var han=w.split(' ')[0];return '<button class="word" onclick="speakWord(\''+han+'\')">'+w+'</button>'}).join('');document.getElementById('zh').textContent=x.zh;document.getElementById('py').textContent=x.py;document.getElementById('meaning').textContent=x.ja;document.getElementById('next').textContent=i===scenes.length-1?'3分を終える':'次の場面 ›';save();try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('three_minute_scene_view',{route:route.id,index:i,sentenceId:x.id,sentence:x.zh,source:'shared-sentence-bank'})}catch(e){}}
function voice(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;var vs=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});u.voice=vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}
function speak(r){var x=scenes[i];voice(x.zh,r);try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('audio_played',{sentenceId:x.id,sentence:x.zh,course:'three-minute',rate:r})}catch(e){}}
function advance(){if(i<scenes.length-1){i++;render();return}try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('three_minute_complete',{route:route.id,scenes:scenes.length,sentenceIds:scenes.map(function(x){return x.id})})}catch(e){}localStorage.removeItem(KEY);document.getElementById('play').style.display='none';document.getElementById('done').classList.add('on')}
render();speechSynthesis.getVoices();
</script>
<script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./storage-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./situation-layer.js"></script><script src="./interaction-ledger.js"></script><script src="./session-end-analyzer.js"></script><script src="./word-touch-engine.js"></script><script src="./legacy-word-touch-upgrader.js"></script><script src="./light-event-buffer.js"></script></body>
</html>
