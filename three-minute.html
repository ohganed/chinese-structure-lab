<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chinese Structure Lab · 3分</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#777;text-decoration:none}.pill{font-size:12px;color:#666;background:#fff;border-radius:999px;padding:8px 11px}.hero{margin:28px 0 15px}.tiny{font-size:11px;color:#888;letter-spacing:.09em}.hero h1{font-size:29px;margin:6px 0}.hero p{color:#777;line-height:1.6;margin:0}.card{background:#fff;border-radius:27px;padding:20px 18px;box-shadow:0 12px 34px #00000008}.progress{font-size:12px;color:#888;margin-bottom:12px}.flow{background:#f0eee8;border-radius:20px;padding:16px}.emoji{font-size:30px;letter-spacing:5px}.sceneTitle{font-size:20px;font-weight:760;margin-top:9px}.sceneText{font-size:14px;color:#666;line-height:1.65;margin-top:6px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.word{border:0;background:#ece9e1;border-radius:999px;padding:10px 13px;font:700 16px inherit}.word small{display:block;font-size:10px;color:#777;font-weight:500;margin-top:2px}.sentence{margin-top:19px;border-top:1px solid #eee;padding-top:18px}.zh{font-size:36px;font-weight:790;line-height:1.3}.py{font-size:17px;color:#555;margin-top:5px}.meaning{font-size:17px;margin-top:10px}.audio{display:flex;gap:8px;margin-top:13px}.audio button,.next{border:0;border-radius:999px;padding:12px 15px;font-weight:750}.natural{background:#171717;color:#fff}.slow{background:#ece9e1}.next{width:100%;margin-top:18px;background:#171717;color:#fff;font-size:15px}.done{display:none;text-align:center;padding:28px 8px}.done.on{display:block}.done .big{font-size:36px}.done h2{font-size:24px}.done p{color:#666;line-height:1.65}.done a{display:inline-block;text-decoration:none;background:#171717;color:#fff;padding:13px 18px;border-radius:999px;font-weight:750;margin-top:8px}.hint{font-size:11px;color:#999;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app">
<div class="top"><a class="back" href="./doorways.html">‹ 入口</a><div class="pill">約3分 · 3場面</div></div>
<div class="hero"><div class="tiny">THREE CONNECTED MOMENTS</div><h1>3つの場面を歩く</h1><p>単語を覚えるのではなく、場面が変わるたびに中国語が少しずつ戻ってきます。</p></div>
<div class="card" id="card">
<div id="play">
<div class="progress" id="progress"></div>
<div class="flow"><div class="emoji" id="emoji"></div><div class="sceneTitle" id="title"></div><div class="sceneText" id="text"></div></div>
<div class="words" id="words"></div>
<div class="sentence"><div class="zh" id="zh"></div><div class="py" id="py"></div><div class="meaning" id="meaning"></div><div class="audio"><button class="natural" onclick="speak(.9)">▶ Natural</button><button class="slow" onclick="speak(.4)">Slow · 0.4×</button></div></div>
<button class="next" id="next" onclick="advance()">次の場面 ›</button>
<div class="hint">正解・不正解はありません。場面の流れだけ追っても大丈夫です。</div>
</div>
<div class="done" id="done"><div class="big">🌿</div><h2>3つの場面がつながりました。</h2><p>ここで終わっても、別の入口へ進んでも大丈夫です。次に3分入口を開くと、別の小さな旅に出会うことがあります。</p><a href="./doorways.html">入口へ戻る</a></div>
</div>
</div>
<script>
var ROUTES=[
 {id:'cafe',scenes:[
  {emoji:'🚪 👀 🙂',title:'カフェで人に会う',text:'店に入り、王明と目が合います。まず短くあいさつします。',words:[['你','nǐ','あなた'],['好','hǎo','よい']],zh:'你好。',py:'nǐ hǎo',meaning:'こんにちは。'},
  {emoji:'📖 🍵 🙋',title:'お茶を頼む',text:'王明がメニューのお茶を指します。あなたも一杯頼みます。',words:[['要','yào','ほしい'],['一杯','yì bēi','一杯'],['茶','chá','お茶']],zh:'我要一杯茶。',py:'wǒ yào yì bēi chá',meaning:'お茶を一杯ください。'},
  {emoji:'🍵 🙂 👋',title:'店を出る',text:'飲み終わりました。また会うことを自然に伝えます。',words:[['明天','míngtiān','明日'],['见','jiàn','会う']],zh:'明天见。',py:'míngtiān jiàn',meaning:'また明日。'}]},
 {id:'city',scenes:[
  {emoji:'🏙️ 😕 🚇',title:'地下鉄を探す',text:'街で方向が分からなくなりました。駅の場所を聞きます。',words:[['地铁站','dìtiězhàn','地下鉄駅'],['在哪儿','zài nǎr','どこ']],zh:'地铁站在哪儿？',py:'dìtiězhàn zài nǎr',meaning:'地下鉄の駅はどこですか。'},
  {emoji:'👉 🚶 🚇',title:'方向を確認する',text:'相手が前を指します。聞こえた方向を一度確かめます。',words:[['前面','qiánmiàn','前'],['吗','ma','〜ですか']],zh:'在前面吗？',py:'zài qiánmiàn ma',meaning:'前の方ですか。'},
  {emoji:'🎫 💴 🙂',title:'切符を買う',text:'駅に着きました。必要な切符を一枚頼みます。',words:[['一张','yì zhāng','一枚'],['票','piào','切符']],zh:'我要一张票。',py:'wǒ yào yì zhāng piào',meaning:'切符を一枚ください。'}]},
 {id:'shop',scenes:[
  {emoji:'👀 🏷️ 👕',title:'店で気になる物を見る',text:'服を見つけました。まず値段を聞きます。',words:[['这个','zhège','これ'],['多少钱','duōshao qián','いくら']],zh:'这个多少钱？',py:'zhège duōshao qián',meaning:'これはいくらですか。'},
  {emoji:'👕 🤔 👀',title:'少し見る',text:'すぐには決めません。店員に「見ているだけ」と伝えます。',words:[['随便','suíbiàn','気ままに'],['看看','kànkan','ちょっと見る']],zh:'我随便看看。',py:'wǒ suíbiàn kànkan',meaning:'ちょっと見ているだけです。'},
  {emoji:'✅ 🛍️ 💴',title:'これに決める',text:'気に入りました。短く「これがほしい」と伝えます。',words:[['这个','zhège','これ'],['要','yào','ほしい']],zh:'我要这个。',py:'wǒ yào zhège',meaning:'これをください。'}]},
 {id:'health',scenes:[
  {emoji:'😣 🤒 🏥',title:'体調がよくない',text:'少し具合が悪く、薬局へ行きます。',words:[['不舒服','bù shūfu','具合が悪い']],zh:'我有点儿不舒服。',py:'wǒ yǒudiǎnr bù shūfu',meaning:'少し具合が悪いです。'},
  {emoji:'🧑‍⚕️ ❓ 🤕',title:'症状を伝える',text:'どこがつらいかを短く伝えます。',words:[['头','tóu','頭'],['疼','téng','痛い']],zh:'我头疼。',py:'wǒ tóu téng',meaning:'頭が痛いです。'},
  {emoji:'💊 🥤 🙂',title:'薬を受け取る',text:'薬を受け取り、最後にお礼を伝えます。',words:[['谢谢','xièxie','ありがとう']],zh:'谢谢。',py:'xièxie',meaning:'ありがとうございます。'}]}
];
var KEY='csl_active_time_session_v1',s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!s||Number(s.minutes)!==3){s={minutes:3,startedAt:new Date().toISOString(),targetMoments:3,density:'light',moments:0}}
if(!s.miniRoute){var last=localStorage.getItem('csl_last_3min_route')||'';var choices=ROUTES.filter(function(r){return r.id!==last});var pick=choices[Math.floor(Math.random()*choices.length)]||ROUTES[0];s.miniRoute=pick.id;s.miniIndex=0;try{localStorage.setItem('csl_last_3min_route',pick.id)}catch(e){}}
var route=ROUTES.filter(function(r){return r.id===s.miniRoute})[0]||ROUTES[0],i=Math.max(0,Math.min(2,Number(s.miniIndex)||0));
function save(){s.miniIndex=i;s.moments=i;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function render(){var x=route.scenes[i];document.getElementById('progress').textContent=(i+1)+' / 3';document.getElementById('emoji').textContent=x.emoji;document.getElementById('title').textContent=x.title;document.getElementById('text').textContent=x.text;document.getElementById('words').innerHTML=x.words.map(function(w){return '<button class="word" onclick="speakWord(\''+w[0]+'\')">'+w[0]+'<small>'+w[1]+' · '+w[2]+'</small></button>'}).join('');document.getElementById('zh').textContent=x.zh;document.getElementById('py').textContent=x.py;document.getElementById('meaning').textContent=x.meaning;document.getElementById('next').textContent=i===2?'3分を終える':'次の場面 ›';save();try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('three_minute_scene_view',{route:route.id,index:i,sentence:x.zh})}catch(e){}}
function voice(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;var vs=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});u.voice=vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}
function speak(r){voice(route.scenes[i].zh,r)}function speakWord(t){voice(t,.8)}
function advance(){if(i<2){i++;render();return}try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('three_minute_complete',{route:route.id,scenes:3})}catch(e){}localStorage.removeItem(KEY);document.getElementById('play').style.display='none';document.getElementById('done').classList.add('on')}
render();speechSynthesis.getVoices();
</script>
</body>
</html>
