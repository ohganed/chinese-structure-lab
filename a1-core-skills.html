<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · A1 Core Skills</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;gap:8px}.back{color:#666;text-decoration:none}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700}.hero{margin:28px 0}.hero h1{font-size:31px;margin:6px 0}.hero p{color:#666;line-height:1.6}.chapter{font-size:12px;color:#888;margin:30px 2px 9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555;margin-top:4px}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#888;margin-top:3px}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.speak{border:0;background:#171717;color:white;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.words{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#f0eee7;border-radius:14px;padding:8px 10px;display:flex;gap:7px;align-items:center}.wz{font-size:18px;font-weight:700}.wg{font-size:11px;color:#666}.note{font-size:13px;color:#555;line-height:1.65;margin-top:9px}.senior .back,.senior .tool{font-size:18px;padding:12px 15px}.senior .hero h1{font-size:42px}.senior .hero p{font-size:20px}.senior .chapter{font-size:18px}.senior .lesson{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:23px}.senior.jp .en{font-size:17px}.senior .speak{font-size:19px;min-height:56px}.senior summary{font-size:20px}.senior .wz{font-size:28px}.senior .wg{font-size:17px}.senior .note{font-size:19px}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="hero"><div style="font-size:11px;color:#888">A1 · 72 NEW LINES</div><h1 data-en="Core Skills Expansion" data-ja="A1 基礎力拡張">Core Skills Expansion</h1><p data-en="Hospital, restaurants, transport, hotel stays, money, and pronunciation foundations." data-ja="病院・レストラン・公共交通・ホテル滞在・数字とお金・発音基礎をまとめて補強します。">Hospital, restaurants, transport, hotel stays, money, and pronunciation foundations.</p></div><div id="course"></div></div><script>var G=[['1 · Hospital',[['我想看医生。','wǒ xiǎng kàn yīshēng','I’d like to see a doctor.','医者に診てもらいたいです。','想 + verb expresses intention/desire.','想 want|看医生 see a doctor'],['我头很疼。','wǒ tóu hěn téng','My head hurts a lot.','頭がとても痛いです。','Body part + 很疼 is a useful symptom frame.','头 head|疼 hurt'],['我咳嗽。','wǒ késou','I have a cough.','せきが出ます。','A symptom verb can stand directly after the subject.','咳嗽 cough'],['我发烧了。','wǒ fāshāo le','I have a fever.','熱が出ました。','了 marks a new state.','发烧 have fever|了 new state'],['从昨天开始。','cóng zuótiān kāishǐ','Since yesterday.','昨日からです。','从…开始 = starting from….','从 from|昨天 yesterday|开始 start'],['哪里疼？','nǎli téng','Where does it hurt?','どこが痛いですか。','哪里 replaces the location/body-part slot.','哪里 where|疼 hurt'],['我对这个药过敏。','wǒ duì zhège yào guòmǐn','I’m allergic to this medicine.','この薬にアレルギーがあります。','对 + thing + 过敏.','药 medicine|过敏 allergic'],['一天吃几次？','yì tiān chī jǐ cì','How many times a day?','1日に何回飲みますか。','几次 asks frequency count.','一天 per day|几次 how many times'],['饭后吃吗？','fànhòu chī ma','Do I take it after meals?','食後に飲みますか。','饭后 = after meals.','饭后 after meal|吃 take/eat|吗 question'],['我需要休息吗？','wǒ xūyào xiūxi ma','Do I need to rest?','休む必要がありますか。','需要 + verb = need to do.','需要 need|休息 rest'],['什么时候能好？','shénme shíhou néng hǎo','When will I get better?','いつ良くなりますか。','什么时候 asks when; 能 expresses possibility.','什么时候 when|能 can|好 recover'],['谢谢医生。','xièxie yīshēng','Thank you, doctor.','先生、ありがとうございます。','A natural closing chunk.','谢谢 thanks|医生 doctor']]],['2 · Restaurant conversation',[['有两个人的座位吗？','yǒu liǎng ge rén de zuòwèi ma','Do you have a table for two?','二人席はありますか。','有…吗 asks availability.','座位 seat|两个人 two people'],['我们还没决定。','wǒmen hái méi juédìng','We haven’t decided yet.','まだ決めていません。','还没 + verb = not yet.','还没 not yet|决定 decide'],['你推荐什么？','nǐ tuījiàn shénme','What do you recommend?','おすすめは何ですか。','什么 fills the object slot.','推荐 recommend|什么 what'],['这个里面有什么？','zhège lǐmiàn yǒu shénme','What’s in this?','これは何が入っていますか。','里面有… = inside there is….','里面 inside|有 there is|什么 what'],['不要太辣。','bú yào tài là','Not too spicy, please.','あまり辛くしないでください。','不要太 + adjective.','不要 don’t want|太 too|辣 spicy'],['可以少放油吗？','kěyǐ shǎo fàng yóu ma','Could you use less oil?','油を少なめにできますか。','少 + verb = do less of action.','少 less|放 put|油 oil'],['我们一起吃这个吧。','wǒmen yìqǐ chī zhège ba','Let’s share this.','これを一緒に食べましょう。','吧 softens a suggestion.','一起 together|吃 eat|吧 suggestion'],['请再来一碗米饭。','qǐng zài lái yì wǎn mǐfàn','Another bowl of rice, please.','ご飯をもう一杯ください。','再来 = bring another.','再 again|碗 bowl|米饭 rice'],['这个菜很香。','zhège cài hěn xiāng','This dish smells great.','この料理はとても香りがいいです。','香 describes pleasant aroma/flavor.','菜 dish|香 fragrant'],['我吃饱了。','wǒ chī bǎo le','I’m full.','お腹いっぱいです。','吃饱 = eat until full, result complement.','吃 eat|饱 full|了 state'],['请给我发票。','qǐng gěi wǒ fāpiào','Please give me a receipt/invoice.','領収書をください。','给 + person + thing.','给 give|发票 invoice/receipt'],['我们分开付。','wǒmen fēnkāi fù','We’ll pay separately.','別々に払います。','分开 + verb = do separately.','分开 separately|付 pay']]],['3 · Public transport',[['哪条线去市中心？','nǎ tiáo xiàn qù shì zhōngxīn','Which line goes downtown?','どの路線が市中心部へ行きますか。','哪 + measure word + noun = which….','哪 which|条 line MW|线 line'],['我要换车吗？','wǒ yào huànchē ma','Do I need to transfer?','乗り換えが必要ですか。','要 can express necessity in context.','要 need|换车 transfer'],['在哪里换车？','zài nǎli huànchē','Where do I transfer?','どこで乗り換えますか。','在 + 哪里 locates action.','哪里 where|换车 transfer'],['还有几站？','hái yǒu jǐ zhàn','How many stops are left?','あと何駅ですか。','还有 = there are still.','还有 still have|几站 how many stops'],['下一站下车。','xià yí zhàn xiàchē','Get off at the next stop.','次の駅で降ります。','Location/time frame before action.','下一站 next stop|下车 get off'],['这班车去机场吗？','zhè bān chē qù jīchǎng ma','Does this bus/train go to the airport?','この便は空港へ行きますか。','班 counts scheduled vehicles/services.','这 this|班 service MW|机场 airport'],['末班车几点？','mòbānchē jǐ diǎn','What time is the last train/bus?','最終便は何時ですか。','几点 asks clock time.','末班车 last service|几点 what time'],['车来了。','chē lái le','The bus/train is here.','乗り物が来ました。','了 marks change/new event.','车 vehicle|来 come|了 new state'],['这里可以坐吗？','zhèlǐ kěyǐ zuò ma','Can I sit here?','ここに座ってもいいですか。','可以…吗 asks permission.','这里 here|可以 may|坐 sit'],['请让我过一下。','qǐng ràng wǒ guò yíxià','Please let me pass.','ちょっと通してください。','让 + person + verb = let someone do.','让 let|过 pass|一下 briefly'],['我坐错车了。','wǒ zuò cuò chē le','I got on the wrong bus/train.','乗る電車を間違えました。','Verb + 错 = do incorrectly.','坐 ride|错 wrong|车 vehicle'],['我应该在哪儿下车？','wǒ yīnggāi zài nǎr xiàchē','Where should I get off?','どこで降りればいいですか。','应该 = should.','应该 should|在哪儿 where|下车 get off']]],['4 · Hotel stay',[['我想办理入住。','wǒ xiǎng bànlǐ rùzhù','I’d like to check in.','チェックインしたいです。','办理入住 is a standard hotel phrase.','办理 handle|入住 check in'],['我订了两晚。','wǒ dìng le liǎng wǎn','I booked two nights.','2泊予約しました。','晚 counts nights stayed.','订 book|两晚 two nights'],['可以早点入住吗？','kěyǐ zǎodiǎn rùzhù ma','Can I check in early?','早めにチェックインできますか。','早点 = a bit earlier.','早点 earlier|入住 check in'],['早餐几点开始？','zǎocān jǐ diǎn kāishǐ','What time does breakfast start?','朝食は何時からですか。','Clock time + 开始.','早餐 breakfast|几点 what time|开始 start'],['Wi-Fi密码是什么？','Wi-Fi mìmǎ shì shénme','What is the Wi-Fi password?','Wi-Fiのパスワードは何ですか。','是什么 asks identity/content.','密码 password|是什么 what is'],['房间有点儿冷。','fángjiān yǒudiǎnr lěng','The room is a little cold.','部屋が少し寒いです。','有点儿 often marks an undesirable degree.','房间 room|有点儿 a little|冷 cold'],['空调打不开。','kōngtiáo dǎbukāi','The air conditioner won’t turn on/open.','エアコンがつきません。','打不开 = cannot get it open/on.','空调 aircon|打不开 cannot open/start'],['可以换房间吗？','kěyǐ huàn fángjiān ma','Can I change rooms?','部屋を変えられますか。','换 = change/exchange.','换 change|房间 room'],['请帮我叫出租车。','qǐng bāng wǒ jiào chūzūchē','Please call a taxi for me.','タクシーを呼んでください。','帮 + person + verb = help someone do.','帮 help|叫 call|出租车 taxi'],['我明天早上退房。','wǒ míngtiān zǎoshang tuìfáng','I’ll check out tomorrow morning.','明日の朝チェックアウトします。','Time phrase frames future action.','明天早上 tomorrow morning|退房 check out'],['可以寄存行李吗？','kěyǐ jìcún xíngli ma','Can I leave my luggage here?','荷物を預けられますか。','寄存 = store/check temporarily.','寄存 store|行李 luggage'],['住得很舒服。','zhù de hěn shūfu','The stay was very comfortable.','とても快適に過ごせました。','Verb + 得 + complement describes manner/result.','住 stay|得 complement marker|舒服 comfortable']]],['5 · Numbers & money',[['一、二、三、四、五。','yī, èr, sān, sì, wǔ','One, two, three, four, five.','1、2、3、4、5。','Core number sounds.','一 one|二 two|三 three|四 four|五 five'],['六、七、八、九、十。','liù, qī, bā, jiǔ, shí','Six, seven, eight, nine, ten.','6、7、8、9、10。','Core number sounds.','六 six|七 seven|八 eight|九 nine|十 ten'],['十一。','shíyī','Eleven.','11。','10 + 1.','十 ten|一 one'],['二十。','èrshí','Twenty.','20。','2 × 10.','二 two|十 ten'],['二十五。','èrshíwǔ','Twenty-five.','25。','20 + 5.','二十 twenty|五 five'],['一百。','yìbǎi','One hundred.','100。','百 = hundred.','一 one|百 hundred'],['一百二十。','yìbǎi èrshí','One hundred twenty.','120。','Hundreds + tens.','一百 100|二十 20'],['多少钱？','duōshao qián','How much?','いくらですか。','Learn as one compact chunk.','多少 how much|钱 money'],['二十八块。','èrshíbā kuài','28 yuan.','28元です。','块 is common spoken word for yuan.','二十八 28|块 yuan'],['太贵了。','tài guì le','That’s too expensive.','高すぎます。','太 + adjective + 了.','太 too|贵 expensive|了 state'],['便宜一点儿吧。','piányi yìdiǎnr ba','A little cheaper, please.','もう少し安くしてください。','一点儿 + 吧 softens request.','便宜 cheap|一点儿 a little|吧 softener'],['找您十块。','zhǎo nín shí kuài','Here’s 10 yuan change.','10元のおつりです。','找 = give change.','找 change|您 you polite|十块 10 yuan']]],['6 · Pronunciation foundations',[['妈。','mā','mā — high and level.','mā — 高く平らな第1声。','First tone: high, steady.','妈 mother'],['麻。','má','má — rising.','má — 上がる第2声。','Second tone: rising.','麻 hemp/numb'],['马。','mǎ','mǎ — low/dipping.','mǎ — 低く抑える第3声。','Third tone is often low rather than a full dip in real speech.','马 horse'],['骂。','mà','mà — falling.','mà — 強く下がる第4声。','Fourth tone: sharp fall.','骂 scold'],['吗。','ma','ma — neutral tone.','ma — 軽く短い軽声。','Neutral tone is light and short.','吗 question particle'],['你好。','nǐ hǎo','Hello.','こんにちは。','Two third tones: first becomes rising-like, ní hǎo.','你 you|好 good'],['不是。','bú shì','It is not.','〜ではありません。','不 becomes bú before a fourth tone.','不 not|是 be'],['一个。','yí ge','One (item).','一つ。','一 changes tone before fourth-tone 个.','一 one|个 MW'],['中国。','Zhōngguó','China.','中国。','Keep syllables connected without flattening tones.','中 middle|国 country'],['学习。','xuéxí','Study.','学ぶ。','Notice x + ü-like quality and rising tones.','学 learn|习 practice'],['吃饭。','chīfàn','Eat a meal.','食事をする。','Contrast retroflex ch with Japanese チ.','吃 eat|饭 meal'],['儿化。','érhuà','Erhua / r-coloring.','児化音。','Common especially in northern speech; recognize before forcing production.','儿 r-suffix|化 change']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function voices(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button class="word" onclick="event.stopPropagation();sp(\''+z.replace(/'/g,'')+'\',.8)"><span class="wz">'+z+'</span><span class="wg">'+g+'</span><span>▶</span></button>'}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0].replace(/'/g,'')+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0].replace(/'/g,'')+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'単語を開く':'Open the words')+'</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>'+(mode==='ja'?'文・音のポイント':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){course.innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});lang.textContent=mode==='ja'?'English':'日本語';size.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script><script src="./evidence-confidence-engine.js"></script><script src="./intervention-budget-engine.js"></script><script src="./learner-agency-engine.js"></script><script src="./learning-rhythm-engine.js"></script><script src="./cognitive-load-guard.js"></script><script src="./underground-governor.js"></script><script src="./decision-trace-ledger.js"></script></body></html>
