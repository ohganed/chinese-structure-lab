<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Problems & Services</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 85px}.top{display:flex;justify-content:space-between;gap:8px}.back{color:#666;text-decoration:none}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700}.head{margin:28px 0}.head h1{font-size:30px;margin:5px 0}.head p{color:#666}.chapter{font-size:12px;color:#888;margin:28px 2px 9px;font-weight:700}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#888}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.s{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.word{border:0;background:#f1efe8;border-radius:14px;padding:8px 11px}.senior .head h1{font-size:40px}.senior .head p{font-size:20px}.senior .lesson{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:23px}.senior .s{font-size:19px;padding:14px 18px}.senior summary{font-size:20px}.senior .word{font-size:18px;padding:12px 14px}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1 data-en="Problems & Services" data-ja="困ったときとサービス">Problems & Services</h1><p data-en="Transport trouble, hotel trouble, returns, lost items and asking for help." data-ja="交通・ホテル・返品・紛失・助けを求める場面。">Transport trouble, hotel trouble, returns, lost items and asking for help.</p><div>24 lines · 6 scenes</div></div><div id="course"></div></div><script>var G=[['1 · Transport trouble',[['这辆车去机场吗？','zhè liàng chē qù jīchǎng ma','Does this bus/car go to the airport?','この車は空港に行きますか。','辆 counts vehicles.','这 this|辆 vehicle MW|车 vehicle|机场 airport'],['我坐错车了。','wǒ zuò cuò chē le','I got on the wrong vehicle.','乗る車を間違えました。','错 after verb marks wrong result.','坐 ride|错 wrong|车 vehicle|了 change'],['下一站下车。','xià yí zhàn xiàchē','Get off at the next stop.','次の駅で降ります。','下一站 = next stop.','下一站 next stop|下车 get off'],['怎么回去？','zěnme huíqù','How do I get back?','どうやって戻りますか。','怎么 asks method.','怎么 how|回去 go back']]],['2 · Hotel trouble',[['房间有问题。','fángjiān yǒu wèntí','There is a problem with the room.','部屋に問題があります。','有问题 = have a problem.','房间 room|有 have|问题 problem'],['空调坏了。','kōngtiáo huài le','The air conditioner is broken.','エアコンが壊れています。','坏了 = became/is broken.','空调 AC|坏 broken|了 state'],['没有热水。','méiyǒu rèshuǐ','There is no hot water.','お湯が出ません。','没有 negates existence.','没有 there is no|热水 hot water'],['可以换房间吗？','kěyǐ huàn fángjiān ma','Can I change rooms?','部屋を替えられますか。','换 = change/exchange.','可以 can|换 change|房间 room|吗 question']]],['3 · Return',[['这个有问题。','zhège yǒu wèntí','There is a problem with this.','これに問題があります。','Reusable complaint frame.','这个 this|有问题 has a problem'],['我想退这个。','wǒ xiǎng tuì zhège','I’d like to return this.','これを返品したいです。','退 can mean return/refund.','想 want|退 return|这个 this'],['有发票吗？','yǒu fāpiào ma','Do you have the receipt?','レシートはありますか。','发票 can be invoice/receipt depending context.','有 have|发票 receipt|吗 question'],['可以退款吗？','kěyǐ tuìkuǎn ma','Can I get a refund?','返金できますか。','退款 = refund.','可以 can|退款 refund|吗 question']]],['4 · Lost item',[['我的手机不见了。','wǒ de shǒujī bú jiàn le','My phone is missing.','携帯がなくなりました。','不见了 = has disappeared/is missing.','我的 my|手机 phone|不见 missing|了 state'],['我找不到。','wǒ zhǎobudào','I can’t find it.','見つけられません。','找不到 = search but fail to find.','找 look for|不到 cannot find'],['你看见了吗？','nǐ kànjiàn le ma','Did you see it?','見かけましたか。','看见 = see.','看见 see|了 completed|吗 question'],['可能在车上。','kěnéng zài chē shang','It may be on the vehicle.','車内にあるかもしれません。','可能 = maybe/possibly.','可能 maybe|在 at|车上 on vehicle']]],['5 · Ask for help',[['请帮帮我。','qǐng bāngbang wǒ','Please help me.','助けてください。','Reduplication softens/intensifies request naturally.','请 please|帮帮 help|我 me'],['我迷路了。','wǒ mílù le','I’m lost.','道に迷いました。','迷路 = get lost.','迷路 get lost|了 state'],['我不知道这是哪里。','wǒ bù zhīdào zhè shì nǎlǐ','I don’t know where this is.','ここがどこかわかりません。','不知道 introduces unknown information.','不知道 do not know|哪里 where'],['可以带我去吗？','kěyǐ dài wǒ qù ma','Can you take me there?','連れて行ってもらえますか。','带 + person + 去 = take someone.','可以 can|带 take|我 me|去 go']]],['6 · Emergency basics',[['我需要帮助。','wǒ xūyào bāngzhù','I need help.','助けが必要です。','需要 = need.','需要 need|帮助 help'],['请叫医生。','qǐng jiào yīshēng','Please call a doctor.','医者を呼んでください。','叫 can mean call/summon.','请 please|叫 call|医生 doctor'],['我听不清楚。','wǒ tīng bu qīngchu','I can’t hear clearly.','よく聞き取れません。','听不清楚 = hear but not clearly.','听 hear|不 not|清楚 clearly'],['请写下来。','qǐng xiě xiàlái','Please write it down.','書いてください。','下来 can indicate action resulting downward/into a recorded state.','请 please|写 write|下来 down']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function word(w){var p=w.split(' '),z=p.shift();return '<button class="word" onclick="sp(\''+z+'\',.8)">'+z+' ▶<br><small>'+p.join(' ')+'</small></button>'}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="s" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="s slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'単語を開く':'Open the words')+'</summary><div class="words">'+x[5].split('|').map(word).join('')+'</div></details></div>'}function render(){course.innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}function apply(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});lang.textContent=mode==='ja'?'English':'日本語';size.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script></body></html>
