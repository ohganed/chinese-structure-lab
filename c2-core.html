<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C2 Core · Chinese Structure Lab</title><style>body{margin:0;background:#f5f4ef;font-family:-apple-system,sans-serif;color:#171717}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.h{margin:28px 0}.h1{font-size:31px;font-weight:800}.sub{color:#666;line-height:1.5}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:27px;font-weight:750;line-height:1.45}.en{font-size:17px;margin-top:8px}.ja{font-size:12px;color:#888}.note{font-size:13px;color:#555;line-height:1.6;margin-top:10px}.b{border:0;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.nat{background:#171717;color:#fff}.slow{margin-left:6px;background:transparent;border:1px solid #bbb}.senior .zh{font-size:40px}.senior .en,.senior .note{font-size:21px}.senior .ja{font-size:19px}.jp .en{font-size:12px;color:#999}.jp .ja{font-size:18px;color:#222}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="h"><div>C2 · BUILT-IN CORE</div><div class="h1">Live inside the language</div><div class="sub">20 opening lessons for nuance, implication, literary compression and professional argument.</div></div><div id="list"></div></div><script>var D=[['真正高水平的表达，往往不是把话说得更复杂，而是把复杂的意思说得更准确。','High-level expression is often not about making language more complex, but making complex meaning more precise.','高度な表現とは、言葉を複雑にすることではなく、複雑な意味をより正確に伝えることです。','A concise C2-style contrast.'],['有些话字面上很客气，实际听起来却带着明显的距离感。','Some remarks are polite literally, yet sound distinctly distant in practice.','字面上は丁寧でも、実際にははっきり距離を感じさせる表現があります。','Pragmatic meaning can diverge from literal meaning.'],['他说“可以考虑”，并不一定真的表示他愿意接受。','When he says “we can consider it,” that does not necessarily mean he is willing to accept it.','「検討できます」と言っても、本当に受け入れる気があるとは限りません。','C2 requires reading implied stance.'],['同一句话换一个语境，态度可能完全不同。','The same sentence in a different context can convey a completely different attitude.','同じ文でも文脈が変われば態度は全く違って見えます。','语境 = discourse context.'],['成熟的语言能力，包含知道什么时候不把话说满。','Mature language ability includes knowing when not to state things absolutely.','成熟した言語能力には、断定しきらない方がよい場面を知ることも含まれます。','说满 = state too absolutely.'],['“恐怕”有时是在表达担心，有时其实是在礼貌地拒绝。','“I’m afraid” can express concern, but sometimes functions as a polite refusal.','「恐怕」は心配を示すこともあれば、丁寧な拒否になることもあります。','Same form, different pragmatic function.'],['一个词的选择，可能悄悄改变整句话的立场。','The choice of a single word can quietly shift the stance of an entire sentence.','一語の選択が、文全体の立場を静かに変えることがあります。','Lexical stance is central at C2.'],['好的论证不是把反对意见藏起来，而是把它处理掉。','A good argument does not hide objections; it deals with them.','良い論証とは反対意見を隠すことではなく、それを処理することです。','处理掉 adds decisive completion.'],['如果一个观点只能在忽略反例时成立，那它就还不够稳固。','If a view works only by ignoring counterexamples, it is not yet robust enough.','反例を無視しないと成立しない見方は、まだ十分に強固ではありません。','反例 = counterexample.'],['真正有说服力的文章，会让读者看到作者如何处理不确定性。','Truly persuasive writing lets readers see how the writer handles uncertainty.','本当に説得力のある文章は、筆者が不確実性をどう扱うかを読者に見せます。','如何处理 is formal analytical phrasing.'],['所谓“常识”，常常只是某个时代习惯了的看法。','So-called “common sense” is often simply a view an era has grown accustomed to.','いわゆる「常識」は、その時代が慣れた見方にすぎないことがあります。','所谓 opens conceptual critique.'],['语言最有意思的地方，恰恰在于它从来不只是传递信息。','What is most interesting about language is precisely that it never merely transmits information.','言語の最も面白いところは、それが単なる情報伝達ではない点です。','恰恰 adds rhetorical focus.'],['它同时也在建立关系、划定距离、暗示身份。','At the same time it builds relationships, marks distance, and signals identity.','同時に、関係を築き、距離を定め、身份をほのめかします。','Parallel verbs create compressed prose.'],['有时候，省略掉的内容比说出来的内容更重要。','Sometimes what is omitted matters more than what is said.','時には、省略された内容の方が語られた内容より重要です。','Omission carries discourse meaning.'],['高级阅读不是把每个词都翻译出来，而是判断哪些词承担了真正的重量。','Advanced reading is not translating every word, but judging which words carry the real weight.','高度な読解とは全語を訳すことではなく、どの語が本当の重みを担っているか判断することです。','承担重量 is metaphorical academic language.'],['一句话能否自然，往往取决于信息出现的顺序，而不只是语法对不对。','Whether a sentence sounds natural often depends on information order, not merely grammatical correctness.','文の自然さは文法だけでなく、情報が現れる順序にも大きく左右されます。','Information structure matters at advanced level.'],['母语者也会修改句子，因为准确表达本来就需要选择。','Native speakers revise sentences too, because precise expression inherently requires choices.','母語話者も文を直します。正確に表現すること自体が選択を必要とするからです。','本来就 = inherently / naturally.'],['真正的流利，不是永远不停顿，而是即使停顿也不会失去句子的方向。','Real fluency is not never pausing, but not losing the direction of the sentence even when pausing.','本当の流暢さとは、止まらないことではなく、止まっても文の方向を失わないことです。','A fluency philosophy statement.'],['读到最后才明白前面的句子，有时不是读者的问题，而是作者故意设计的效果。','Sometimes understanding earlier sentences only at the end is not the reader’s problem, but a deliberately designed effect.','最後まで読んで前の文が分かるのは、読者の問題ではなく筆者の意図的な効果の場合があります。','Literary delayed interpretation.'],['到了这个阶段，学习语言已经不只是学习“怎么说”，而是在学习“为什么这样说”。','At this stage, language learning is no longer only about how to say something, but why it is said that way.','この段階では「どう言うか」だけでなく「なぜそう言うか」を学ぶことになります。','A bridge from proficiency to stylistic awareness.']];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);list.innerHTML=D.map(function(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="en">'+x[1]+'</div><div class="ja">'+x[2]+'</div><button class="b nat" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="b slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><div class="note">'+x[3]+'</div></div>'}).join('')}render();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script></body></html>
