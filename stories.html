<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Stories</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:680px;margin:auto;padding:20px 16px 90px}.back{color:#777;text-decoration:none}.head{margin:30px 0}.head h1{font-size:31px;margin:7px 0}.head p{color:#777;line-height:1.55}.story{background:#fff;border-radius:26px;padding:20px;margin:18px 0}.tag{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.08em}.title{font-size:20px;font-weight:700;margin:6px 0 14px}.line{padding:13px 0;border-top:1px solid #eee}.line:first-of-type{border:0}.zh{font-size:26px;font-weight:650;line-height:1.4}.hidden{display:none}.py{font-size:14px;color:#666;margin-top:4px}.en{font-size:16px;margin-top:6px}.ja{font-size:10px;color:#aaa}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.btn{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 13px;font-weight:700}.ghost{background:#eeece5;color:#333}.note{font-size:12px;color:#777;line-height:1.6;margin-top:12px}.reused{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{background:#f0eee7;border-radius:999px;padding:7px 10px;font-size:12px}.version{text-align:center;color:#aaa;font-size:10px;margin-top:28px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div class="tag">A1 · STORY MODE</div><h1>Words come back.</h1><p>You already met these words in Daily Life, Food, Travel and People. Now they return inside a small world.</p></div><div id="stories"></div><div class="version">prototype 0.6 · story memory</div></div><script>var S=[{t:'Morning in Beijing',from:'Daily Life + Food + Travel',lines:[['早上六点半，我起床。','zǎoshang liù diǎn bàn, wǒ qǐchuáng','At 6:30 in the morning, I get up.','朝6時半に起きます。'],['我喝一杯咖啡，然后去车站。','wǒ hē yì bēi kāfēi, ránhòu qù chēzhàn','I drink a cup of coffee, then go to the station.','コーヒーを一杯飲んで、それから駅へ行きます。'],['地铁站在哪儿？我问一个人。','dìtiě zhàn zài nǎr? wǒ wèn yí ge rén','“Where is the subway station?” I ask someone.','「地下鉄駅はどこですか」と人に尋ねます。'],['他很好。他说：“一直走，然后左转。”','tā hěn hǎo. tā shuō: “yìzhí zǒu, ránhòu zuǒzhuǎn.”','He is kind. He says, “Go straight, then turn left.”','彼は親切です。「まっすぐ行って、それから左へ」と言います。']],chips:['六点半','起床','一杯咖啡','然后','车站','在哪儿','一直走','左转']},{t:'A small lunch',from:'Food + People',lines:[['中午，我跟朋友一起吃饭。','zhōngwǔ, wǒ gēn péngyou yìqǐ chīfàn','At noon, I eat with a friend.','昼、友達と一緒に食事をします。'],['我朋友不吃辣。','wǒ péngyou bù chī là','My friend doesn’t eat spicy food.','友達は辛いものを食べません。'],['我问：“这个好吃吗？”','wǒ wèn: “zhège hǎochī ma?”','I ask, “Is this tasty?”','「これはおいしい？」と聞きます。'],['他说：“很好吃。再来一杯茶吧。”','tā shuō: “hěn hǎochī. zài lái yì bēi chá ba.”','He says, “It’s very tasty. Let’s have another cup of tea.”','「とてもおいしい。お茶をもう一杯にしよう」と彼は言います。']],chips:['跟','朋友','一起','不吃辣','这个','好吃吗','很好吃','再来一杯']},{t:'The blue one',from:'Shopping + Daily Life',lines:[['下午，我去商店。','xiàwǔ, wǒ qù shāngdiàn','In the afternoon, I go to a shop.','午後、店へ行きます。'],['我喜欢蓝色。','wǒ xǐhuan lánsè','I like blue.','青色が好きです。'],['这个太小了。那个呢？','zhège tài xiǎo le. nàge ne?','This one is too small. What about that one?','これは小さすぎます。あれは？'],['那个比较好。我说：“就这个吧。”','nàge bǐjiào hǎo. wǒ shuō: “jiù zhège ba.”','That one is better. I say, “I’ll go with this one.”','あちらの方がいいです。「これにします」と言います。']],chips:['下午','喜欢','蓝色','太小了','那个呢','比较好','就这个吧']}];function voices(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function speak(t){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.86;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){document.getElementById('stories').innerHTML=S.map(function(s,si){var full=s.lines.map(function(l){return l[0]}).join(' ');return '<div class="story"><div class="tag">'+s.from+'</div><div class="title">'+s.t+'</div><div class="actions"><button class="btn" onclick="speak(S['+si+'].lines.map(function(x){return x[0]}).join(\' \'))">▶ Hear the whole story</button><button class="btn ghost" onclick="toggle('+si+',\'py\')">Pinyin</button><button class="btn ghost" onclick="toggle('+si+',\'meaning\')">Meaning</button></div>'+s.lines.map(function(l){return '<div class="line"><div class="zh">'+l[0]+'</div><div class="py hidden s'+si+'py">'+l[1]+'</div><div class="hidden s'+si+'meaning"><div class="en">'+l[2]+'</div><div class="ja">'+l[3]+'</div></div></div>'}).join('')+'<div class="note">You have already met:</div><div class="reused">'+s.chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join('')+'</div></div>'}).join('')}function toggle(i,k){document.querySelectorAll('.s'+i+k).forEach(function(e){e.classList.toggle('hidden')})}render();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script></body></html>
