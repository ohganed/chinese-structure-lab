<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · People & Family</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.back{color:#777;text-decoration:none}.head{margin:28px 0}.head h1{font-size:30px;margin:6px 0}.head p{color:#777}.chapter{font-size:12px;color:#888;margin:27px 2px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#aaa}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #ddd;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#666;line-height:1.65;margin-top:9px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#f1efe8;padding:8px 11px;border-radius:14px;display:flex;align-items:center;gap:7px;text-align:left}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#777}.wordplay{font-size:10px;color:#777}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1>People & Family</h1><p>Meet people, connect relationships, and describe the people around you.</p><div style="color:#777">20 useful lines · 5 scenes</div></div><div id="course"></div><div class="version">prototype 0.9 · word audio</div></div><script>var G=[['1 · Introduce people',[['这是我朋友。','zhè shì wǒ péngyou','This is my friend.','こちらは私の友達です。','这 + 是 introduces a person.','这 this|是 is|我 my/I|朋友 friend'],['他叫王明。','tā jiào Wáng Míng','His name is Wang Ming.','彼は王明といいます。','Reuse 叫 from self-introduction with 他.','他 he|叫 be called|王明 Wang Ming'],['她是我老师。','tā shì wǒ lǎoshī','She is my teacher.','彼女は私の先生です。','她 and 他 sound the same but differ in writing.','她 she|是 is|老师 teacher'],['我们一起学习中文。','wǒmen yìqǐ xuéxí Zhōngwén','We study Chinese together.','私たちは一緒に中国語を勉強します。','一起 normally appears before the verb.','我们 we|一起 together|学习 study|中文 Chinese']]],['2 · Family',[['这是我爸爸。','zhè shì wǒ bàba','This is my father.','こちらは父です。','Reuse the introduction frame with family vocabulary.','爸爸 father'],['我有一个姐姐。','wǒ yǒu yí ge jiějie','I have an older sister.','姉が一人います。','有 + number + measure word + noun.','有 have|一个 one|姐姐 older sister'],['你有兄弟姐妹吗？','nǐ yǒu xiōngdì jiěmèi ma','Do you have brothers or sisters?','兄弟姉妹はいますか。','有…吗 asks possession/existence.','兄弟姐妹 siblings|吗 question'],['我没有弟弟。','wǒ méiyǒu dìdi','I don’t have a younger brother.','弟はいません。','没有, not 不有, negates 有.','没有 do not have|弟弟 younger brother']]],['3 · Describe',[['他很高。','tā hěn gāo','He is tall.','彼は背が高いです。','很 commonly links a subject with an adjective.','他 he|很 linker/very|高 tall'],['她很聪明。','tā hěn cōngming','She is smart.','彼女は頭がいいです。','Adjectives can predicate without 是.','她 she|聪明 smart'],['他不太忙。','tā bú tài máng','He isn’t very busy.','彼はあまり忙しくありません。','不太 + adjective = not very adjective.','不太 not very|忙 busy'],['她今天很开心。','tā jīntiān hěn kāixīn','She is happy today.','彼女は今日はうれしそうです。','今天 sits before the adjective predicate as a time frame.','今天 today|开心 happy']]],['4 · Age & work',[['你多大？','nǐ duō dà','How old are you?','何歳ですか。','多大 is a common age question among adults/peers.','多大 how old'],['我五十五岁。','wǒ wǔshíwǔ suì','I’m 55 years old.','55歳です。','Age in Chinese normally does not need 是.','五十五 55|岁 years old'],['你做什么工作？','nǐ zuò shénme gōngzuò','What do you do for work?','どんな仕事をしていますか。','做什么工作 asks what work someone does.','做 do|什么 what|工作 work'],['我是老师。','wǒ shì lǎoshī','I’m a teacher.','教師です。','Use 是 when identifying profession/category.','我 I|是 am|老师 teacher']]],['5 · Relationships',[['我们是朋友。','wǒmen shì péngyou','We are friends.','私たちは友達です。','A simple identity/classification sentence.','我们 we|是 are|朋友 friends'],['我跟他一起工作。','wǒ gēn tā yìqǐ gōngzuò','I work with him.','彼と一緒に働いています。','跟 + person expresses with someone.','跟 with|他 him|一起 together|工作 work'],['她对我很好。','tā duì wǒ hěn hǎo','She is very kind to me.','彼女は私にとても親切です。','对 + person marks toward/to someone.','对 toward|我 me|很好 very good/kind'],['我们明天见。','wǒmen míngtiān jiàn','We’ll see each other tomorrow.','また明日会います。','A familiar farewell grows naturally from the relationship scene.','我们 we|明天 tomorrow|见 see']]]];function vs(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vs()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button type="button" class="word" onclick="event.stopPropagation();sp(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function c(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0]+'\',.68)">Slow</button><details><summary>Open the words</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>Open the structure</summary><div class="note">'+x[4]+'</div></details></div>'}document.getElementById('course').innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(c).join('')}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script><script src="./evidence-confidence-engine.js"></script><script src="./intervention-budget-engine.js"></script><script src="./learner-agency-engine.js"></script><script src="./learning-rhythm-engine.js"></script></body></html>
