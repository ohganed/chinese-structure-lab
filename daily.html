<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Daily Life</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.top{display:flex;justify-content:space-between;gap:8px}.back{color:#777;text-decoration:none}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700;color:#555}.head{margin:28px 0}.head h1{font-size:30px;margin:6px 0}.head p{color:#777}.chapter{font-size:12px;color:#888;margin:27px 2px 8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555;margin-top:3px}.en{font-size:18px;margin-top:10px}.ja{font-size:11px;color:#888;margin-top:4px}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.speak{border:0;background:#171717;color:white;border-radius:999px;padding:11px 15px;margin-top:12px;font-weight:700;min-height:44px}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#555;line-height:1.65;margin-top:9px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#f1efe8;padding:8px 11px;border-radius:14px;display:flex;align-items:center;gap:7px;text-align:left}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#666}.wordplay{font-size:10px;color:#666}.version{text-align:center;color:#999;font-size:10px;margin-top:25px}.senior .back,.senior .tool{font-size:18px;min-height:50px;padding:12px 15px}.senior .head h1{font-size:40px}.senior .head p,.senior .head div{font-size:19px!important;line-height:1.65}.senior .chapter{font-size:18px;margin-top:35px}.senior .lesson{padding:24px;border-radius:25px;margin:16px 0}.senior .zh{font-size:43px;line-height:1.45}.senior .py{font-size:24px;line-height:1.5;margin-top:8px}.senior .en,.senior .ja{font-size:23px;line-height:1.55}.senior.jp .en{font-size:17px}.senior.jp .ja{font-size:24px}.senior .speak{font-size:19px;min-height:56px;padding:14px 18px}.senior summary{font-size:20px;padding:8px 0}.senior .note{font-size:19px}.senior .word{padding:13px 15px;min-height:54px}.senior .wordzh{font-size:27px}.senior .wordgloss{font-size:17px}.senior .wordplay{font-size:16px}@media(max-width:430px){.top{display:block}.tools{margin-top:12px}}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1 data-en="Daily Life" data-ja="日常生活">Daily Life</h1><p data-en="A whole ordinary day becomes your first Chinese world." data-ja="何気ない一日を、そのまま最初の中国語の世界にします。">A whole ordinary day becomes your first Chinese world.</p><div style="color:#777" data-en="28 useful lines · 7 scenes · words + structure inside" data-ja="28文 · 7場面 · 単語と文の構造は必要なときだけ開きます">28 useful lines · 7 scenes · words + structure inside</div></div><div id="course"></div><div class="version">prototype 1.2 · learner display modes</div></div><script>var G=[['1 · Meet someone',[['你好。','nǐ hǎo','Hello.','こんにちは。','Learn this first as one natural sound unit.','你 you|好 good'],['你叫什么名字？','nǐ jiào shénme míngzi','What is your name?','お名前は何ですか。','叫 connects a person with the name they are called.','你 you|叫 be called|什么 what|名字 name'],['我叫林。','wǒ jiào Lín','My name is Lin.','林といいます。','我叫 + name is a basic self-introduction frame.','我 I|叫 be called|林 Lin'],['很高兴认识你。','hěn gāoxìng rènshi nǐ','Nice to meet you.','お会いできてうれしいです。','认识 = get to know/know a person; this phrase is best learned as a chunk.','很 very|高兴 happy|认识 meet/know|你 you']]],['2 · Where are you from?',[['你是哪国人？','nǐ shì nǎ guó rén','What country are you from?','どこの国の人ですか。','哪国人 literally asks “which-country person”.','你 you|是 are|哪国 which country|人 person'],['我是日本人。','wǒ shì Rìběn rén','I’m Japanese.','日本人です。','A 是 B identifies or classifies A as B.','我 I|是 am|日本 Japan|人 person'],['你住在哪儿？','nǐ zhù zài nǎr','Where do you live?','どこに住んでいますか。','住在 + place = live at/in a place.','住 live|在 at|哪儿 where'],['我住在东京。','wǒ zhù zài Dōngjīng','I live in Tokyo.','東京に住んでいます。','Reuse 住在 with an actual place.','我 I|住 live|在 in|东京 Tokyo']]],['3 · Morning',[['早上好。','zǎoshang hǎo','Good morning.','おはようございます。','早上 = morning; 好 appears in another greeting.','早上 morning|好 good'],['我六点起床。','wǒ liù diǎn qǐchuáng','I get up at six.','6時に起きます。','Clock time can appear before the verb without a preposition.','六点 six o’clock|起床 get up'],['我喝咖啡。','wǒ hē kāfēi','I drink coffee.','コーヒーを飲みます。','Simple SVO: 我 + 喝 + 咖啡.','我 I|喝 drink|咖啡 coffee'],['然后去上班。','ránhòu qù shàngbān','Then I go to work.','それから仕事に行きます。','然后 connects events; 去 + action can express going to do it.','然后 then|去 go|上班 go/work']]],['4 · Time & schedule',[['现在几点？','xiànzài jǐ diǎn','What time is it now?','今何時ですか。','几点 asks clock time.','现在 now|几点 what time'],['现在十点半。','xiànzài shí diǎn bàn','It’s 10:30 now.','今10時半です。','半 after the hour means half past.','十点 ten o’clock|半 half'],['你今天忙吗？','nǐ jīntiān máng ma','Are you busy today?','今日は忙しいですか。','Adjectives can function predicatively; 吗 makes it a yes/no question.','今天 today|忙 busy|吗 question'],['下午有时间。','xiàwǔ yǒu shíjiān','I have time in the afternoon.','午後は時間があります。','Time phrase first sets the frame; 有时间 = have time.','下午 afternoon|有 have|时间 time']]],['5 · Family & home',[['这是我妈妈。','zhè shì wǒ māma','This is my mother.','こちらは母です。','这 + 是 + person introduces someone.','这 this|是 is|我 my/I|妈妈 mother'],['我有一个哥哥。','wǒ yǒu yí ge gēge','I have an older brother.','兄が一人います。','一个 uses 个, the most general measure word.','有 have|一 one|个 MW|哥哥 older brother'],['你家有几口人？','nǐ jiā yǒu jǐ kǒu rén','How many people are in your family?','家族は何人ですか。','口 can count family members; 几 asks a small/expected number.','家 family/home|几 how many|口 family MW|人 people'],['我家有三口人。','wǒ jiā yǒu sān kǒu rén','There are three people in my family.','家族は3人です。','Answer reuses exactly the same structure as the question.','我家 my family|三 three|口 MW|人 people']]],['6 · Likes & free time',[['你喜欢什么？','nǐ xǐhuan shénme','What do you like?','何が好きですか。','什么 occupies the object position of 喜欢.','喜欢 like|什么 what'],['我喜欢音乐。','wǒ xǐhuan yīnyuè','I like music.','音楽が好きです。','喜欢 + noun gives a simple preference.','我 I|喜欢 like|音乐 music'],['我会说一点儿中文。','wǒ huì shuō yìdiǎnr Zhōngwén','I can speak a little Chinese.','中国語を少し話せます。','会 + verb expresses an acquired ability.','会 can/know how|说 speak|一点儿 a little|中文 Chinese'],['周末我看电影。','zhōumò wǒ kàn diànyǐng','I watch movies on weekends.','週末は映画を見ます。','Time can come before the subject to frame the sentence.','周末 weekend|看 watch|电影 movie']]],['7 · End the day',[['我回家了。','wǒ huí jiā le','I’m home / I went home.','家に帰りました。','了 marks a completed/change-of-state event here.','回 return|家 home|了 change/completion'],['我有点儿累。','wǒ yǒudiǎnr lèi','I’m a little tired.','少し疲れています。','有点儿 often introduces a mildly negative/undesired degree.','有点儿 a little|累 tired'],['晚安。','wǎn’ān','Good night.','おやすみなさい。','A compact evening farewell.','晚 evening|安 peace/safe'],['明天见。','míngtiān jiàn','See you tomorrow.','また明日。','Time + 见 forms a very natural farewell.','明天 tomorrow|见 see']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function vs(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vs()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button type="button" class="word" onclick="event.stopPropagation();sp(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function c(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'単語を開く':'Open the words')+'</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>'+(mode==='ja'?'文の構造を開く':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){document.getElementById('course').innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(c).join('')}).join('')}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';var a=document.getElementById('app');a.classList.toggle('jp',mode==='ja');a.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});document.getElementById('lang').textContent=mode==='ja'?'English':'日本語';document.getElementById('size').textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script></body></html>
