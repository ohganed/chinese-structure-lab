<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Shopping</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.back{color:#777;text-decoration:none}.head{margin:28px 0}.head h1{font-size:30px;margin:6px 0}.head p{color:#777}.chapter{font-size:12px;color:#888;margin:27px 2px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#aaa}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #ddd;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#666;line-height:1.65;margin-top:9px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#f1efe8;padding:8px 11px;border-radius:14px;display:flex;align-items:center;gap:7px;text-align:left}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#777}.wordplay{font-size:10px;color:#777}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1>Shopping</h1><p>Look, ask, compare, try, choose and pay.</p><div style="color:#777">20 useful lines · 5 scenes</div></div><div id="course"></div><div class="version">prototype 0.9 · word audio</div></div><script>var G=[['1 · Look',[['我看看。','wǒ kànkan','I’m just looking.','ちょっと見ます。','Reduplicated 看看 makes the action light/casual.','我 I|看看 have a look'],['这个多少钱？','zhège duōshao qián','How much is this?','これはいくらですか。','Put 这个 before the familiar 多少钱 chunk.','这个 this|多少钱 how much'],['那个呢？','nàge ne','What about that one?','あれは？','呢 lets you ask “and what about…?” using context.','那个 that|呢 what about'],['有别的吗？','yǒu biéde ma','Do you have another one?','別のものはありますか。','别的 = another/different one; 有…吗 asks availability.','有 have|别的 another|吗 question']]],['2 · Size & color',[['有大一点儿的吗？','yǒu dà yìdiǎnr de ma','Do you have a slightly bigger one?','もう少し大きいものはありますか。','Adjective + 一点儿 + 的 turns a property into “one that is a bit…”.','大 big|一点儿 a little|的 one'],['这个太小了。','zhège tài xiǎo le','This is too small.','これは小さすぎます。','太 + adjective + 了 = too/so adjective.','太 too|小 small|了 state'],['我喜欢蓝色。','wǒ xǐhuan lánsè','I like blue.','青色が好きです。','颜色 color words can be objects of 喜欢.','喜欢 like|蓝色 blue'],['有黑色的吗？','yǒu hēisè de ma','Do you have a black one?','黒いものはありますか。','的 replaces the understood noun: “a black one”.','黑色 black|的 one|吗 question']]],['3 · Try & compare',[['可以试一下吗？','kěyǐ shì yíxià ma','Can I try it?','試してもいいですか。','可以…吗 asks permission; 一下 softens the action.','可以 may/can|试 try|一下 briefly|吗 question'],['这个比较好。','zhège bǐjiào hǎo','This one is better.','こちらの方がいいです。','比较 before an adjective often means comparatively/rather.','这个 this|比较 comparatively|好 good'],['我喜欢这个。','wǒ xǐhuan zhège','I like this one.','これが好きです。','A familiar preference frame now reused while shopping.','我 I|喜欢 like|这个 this'],['还有别的颜色吗？','hái yǒu biéde yánsè ma','Are there any other colors?','ほかの色もありますか。','还 + 有 adds “also/still have”.','还 also|有 have|别的 other|颜色 color']]],['4 · Decide',[['我要这个。','wǒ yào zhège','I’ll take this one.','これにします。','Context changes 我要 from simple “want” to a natural purchase choice.','我 I|要 will take|这个 this'],['我要两个。','wǒ yào liǎng ge','I’ll take two.','二つください。','两 is normally used before measure words such as 个.','两 two|个 MW'],['不用袋子。','bú yòng dàizi','I don’t need a bag.','袋はいりません。','不用 = no need to/use; tone of 不 changes before 用.','不用 no need|袋子 bag'],['就这个吧。','jiù zhège ba','I’ll go with this one.','これにしましょう。','吧 softens a decision; 就 gives a sense of settling on this.','就 just/settle on|这个 this|吧 softener']]],['5 · Pay',[['可以刷卡吗？','kěyǐ shuākǎ ma','Can I pay by card?','カードで払えますか。','Reuse 可以…吗 for payment possibility.','可以 can|刷卡 pay by card|吗 question'],['可以用手机支付吗？','kěyǐ yòng shǒujī zhīfù ma','Can I pay by phone?','スマホ決済できますか。','用 + tool + verb = use a tool to do an action.','用 use|手机 phone|支付 pay'],['一共多少钱？','yígòng duōshao qián','How much is it altogether?','全部でいくらですか。','一共 adds “in total” to 多少钱.','一共 altogether|多少钱 how much'],['谢谢。','xièxie','Thank you.','ありがとう。','End the interaction with the same high-frequency chunk.','谢谢 thank you']]]];function vs(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vs()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button type="button" class="word" onclick="event.stopPropagation();sp(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function c(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0]+'\',.68)">Slow</button><details><summary>Open the words</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>Open the structure</summary><div class="note">'+x[4]+'</div></details></div>'}document.getElementById('course').innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(c).join('')}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script></body></html>
