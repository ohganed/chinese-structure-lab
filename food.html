<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Food</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.back{color:#777;text-decoration:none}.head{margin:28px 0}.head h1{font-size:28px;margin:6px 0}.head p{color:#777}.lesson{background:#fff;border-radius:22px;padding:18px;margin:14px 0}.scene{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:.08em}.zh{font-size:30px;font-weight:700;margin:12px 0 4px}.py{font-size:17px;color:#555}.en{font-size:18px;margin-top:10px}.ja{font-size:12px;color:#999}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}details{margin-top:14px;border-top:1px solid #eee;padding-top:12px}summary{font-weight:700}.note{font-size:13px;color:#666;line-height:1.6;margin-top:10px}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div class="scene">A1 · Situation</div><h1>Food</h1><p>Enter a café. Hear first. Open only what you want.</p></div><div id="lessons"></div><div class="version">prototype 0.2 · built-in lessons</div></div><script>var data=[['At a café','我想喝咖啡。','wǒ xiǎng hē kāfēi','I’d like to drink coffee.','コーヒーを飲みたいです。','想 + verb expresses what you would like or want to do.'],['Ordering','我要一杯茶。','wǒ yào yì bēi chá','I’d like a cup of tea.','お茶を一杯ください。','杯 is a measure word for cups and glasses.'],['Asking','这个好吃吗？','zhège hǎochī ma','Is this tasty?','これはおいしいですか。','吗 turns a statement into a yes/no question.'],['Preference','我不吃辣。','wǒ bù chī là','I don’t eat spicy food.','辛いものは食べません。','不 comes before the verb or adjective it negates.'],['Paying','多少钱？','duōshao qián','How much is it?','いくらですか。','A compact everyday question worth learning as one sound unit.']];function speak(t){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.88;var vs=speechSynthesis.getVoices().filter(function(v){return /^zh(-|_)?CN/i.test(v.lang)||/^zh/i.test(v.lang)});var local=vs.filter(function(v){return v.localService});u.voice=local[0]||vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)};document.getElementById('lessons').innerHTML=data.map(function(x,i){return '<div class="lesson"><div class="scene">'+x[0]+'</div><div class="zh">'+x[1]+'</div><div class="py">'+x[2]+'</div><div class="en">'+x[3]+'</div><div class="ja">'+x[4]+'</div><button class="speak" onclick="speak(data['+i+'][1])">▶ Listen</button><details><summary>Open the structure</summary><div class="note">'+x[5]+'</div></details></div>'}).join('');speechSynthesis.getVoices();</script></body></html>
