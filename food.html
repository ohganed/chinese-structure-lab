<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Food</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.back{color:#777;text-decoration:none}.head{margin:28px 0}.head h1{font-size:30px;margin:6px 0}.head p,.muted{color:#777}.progress{height:6px;background:#e7e3d9;border-radius:9px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:#222;width:8%}.chapter{font-size:12px;color:#888;margin:26px 2px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.scene{font-size:11px;color:#999}.zh{font-size:29px;font-weight:700;margin:10px 0 3px}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:10px}.ja{font-size:11px;color:#aaa;margin-top:3px}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.ghost{border:1px solid #ddd;background:transparent;color:#333;margin-left:6px}details{margin-top:13px;border-top:1px solid #eee;padding-top:11px}summary{font-weight:700;cursor:pointer}.note{font-size:13px;color:#666;line-height:1.65;margin-top:9px}.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.word{border:0;background:#f1efe8;border-radius:14px;padding:8px 11px;display:flex;align-items:center;gap:7px;text-align:left}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#777}.wordplay{font-size:10px;color:#777}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div class="scene">A1 · BUILT-IN COURSE</div><h1>Food</h1><p>Walk into a café, order, react, ask for more, and pay. The situation is the lesson.</p><div class="progress"><i></i></div><div class="muted">24 useful lines · 6 scenes · analysis already inside</div></div><div id="course"></div><div class="version">prototype 0.9 · word audio</div></div><script>var groups=[['1 · Enter & sit',[['你好。','nǐ hǎo','Hello.','こんにちは。','A greeting learned as one sound unit.','你 you|好 good'],['请坐。','qǐng zuò','Please sit down.','どうぞお座りください。','请 + verb makes a polite invitation or request.','请 please|坐 sit'],['两位。','liǎng wèi','Two people.','二人です。','位 is a polite measure word for people.','两 two|位 people (polite)'],['有菜单吗？','yǒu càidān ma','Do you have a menu?','メニューはありますか。','有…吗？ asks whether something is available.','有 have|菜单 menu|吗 question']]],['2 · Choose',[['我看看。','wǒ kànkan','Let me have a look.','ちょっと見ます。','Verb reduplication can make an action lighter/casual.','我 I|看看 have a look'],['这个是什么？','zhège shì shénme','What is this?','これは何ですか。','A = 是 + 什么 asks what something is.','这个 this|是 is|什么 what'],['这个好吃吗？','zhège hǎochī ma','Is this tasty?','これはおいしいですか。','吗 creates a yes/no question.','这个 this|好吃 tasty|吗 question'],['我喜欢这个。','wǒ xǐhuan zhège','I like this one.','これが好きです。','喜欢 takes the thing liked directly after it.','我 I|喜欢 like|这个 this']]],['3 · Order',[['我要这个。','wǒ yào zhège','I’ll have this.','これをください。','我要… is extremely useful for choosing/order contexts.','我 I|要 want / will have|这个 this'],['我要一杯茶。','wǒ yào yì bēi chá','I’d like a cup of tea.','お茶を一杯ください。','Number + measure word + noun: 一杯茶.','一 one|杯 cup MW|茶 tea'],['我想喝咖啡。','wǒ xiǎng hē kāfēi','I’d like to drink coffee.','コーヒーを飲みたいです。','想 + verb expresses desire/intention.','想 would like|喝 drink|咖啡 coffee'],['不要糖。','bú yào táng','No sugar, please.','砂糖はいりません。','不要 + noun/action means do not want. 不 changes tone before a fourth tone.','不要 do not want|糖 sugar']]],['4 · Preferences',[['我不吃辣。','wǒ bù chī là','I don’t eat spicy food.','辛いものは食べません。','不 negates the following verb.','不 not|吃 eat|辣 spicy'],['少放一点儿盐。','shǎo fàng yìdiǎnr yán','Please use a little less salt.','塩を少なめにしてください。','少 + verb = do the action less; 一点儿 = a little.','少 less|放 put|一点儿 a little|盐 salt'],['有素菜吗？','yǒu sùcài ma','Do you have vegetarian dishes?','野菜料理はありますか。','Reuse 有…吗？ with a new noun.','素菜 vegetarian dish'],['我对花生过敏。','wǒ duì huāshēng guòmǐn','I’m allergic to peanuts.','ピーナッツアレルギーです。','对 + thing + 过敏 = be allergic to something.','对 to|花生 peanut|过敏 allergic']]],['5 · During the meal',[['很好吃。','hěn hǎochī','It’s very tasty.','とてもおいしいです。','很 often links a subject and adjective naturally, not always emphatic “very”.','很 very/linker|好吃 tasty'],['再来一杯。','zài lái yì bēi','Another cup, please.','もう一杯ください。','再 + verb expresses doing something again/additionally.','再 again|来 bring/come|一杯 one cup'],['请给我水。','qǐng gěi wǒ shuǐ','Please give me some water.','お水をください。','给 + person + thing = give someone something.','给 give|我 me|水 water'],['够了，谢谢。','gòu le, xièxie','That’s enough, thank you.','もう十分です、ありがとう。','了 marks a new state here: it is enough now.','够 enough|了 new state|谢谢 thanks']]],['6 · Pay & leave',[['买单，谢谢。','mǎidān, xièxie','The bill, please.','お会計お願いします。','买单 is a common restaurant expression meaning to pay the bill.','买单 pay bill|谢谢 thanks'],['多少钱？','duōshao qián','How much is it?','いくらですか。','多少钱 is best learned initially as one compact question.','多少 how much|钱 money'],['可以刷卡吗？','kěyǐ shuākǎ ma','Can I pay by card?','カードで払えますか。','可以 + verb + 吗？ asks whether an action is possible/allowed.','可以 can|刷卡 pay by card|吗 question'],['谢谢，再见。','xièxie, zàijiàn','Thank you. Goodbye.','ありがとう。さようなら。','Two high-frequency chunks; say them naturally rather than word by word.','谢谢 thank you|再见 goodbye']]]];function voices(){var v=speechSynthesis.getVoices().filter(function(x){return /^zh(-|_)?CN/i.test(x.lang)||/^zh/i.test(x.lang)});return v.filter(function(x){return x.localService}).concat(v.filter(function(x){return !x.localService}))}function speak(t,r){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r||.88;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button type="button" class="word" onclick="event.stopPropagation();speak(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="speak(\''+x[0].replace(/'/g,'')+'\',.9)">▶ Natural</button><button class="speak ghost" onclick="speak(\''+x[0].replace(/'/g,'')+'\',.4)">Slow · 0.4×</button><details><summary>Open the words</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>Open the structure</summary><div class="note">'+x[4]+'</div></details></div>'}document.getElementById('course').innerHTML=groups.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script><script src="./evidence-confidence-engine.js"></script></body></html>
