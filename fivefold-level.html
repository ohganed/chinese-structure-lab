(function(){
'use strict';var params=new URLSearchParams(location.search),level=(params.get('level')||'A1').toUpperCase();if(level!=='A2')level='A1';var all=window.CSLFivefoldCurriculum?CSLFivefoldCurriculum.all(level):[],category='all',shown=0,PAGE=24,large=localStorage.getItem('csl_large_text')==='1';if(large)app.classList.add('senior');
var cfg=level==='A1'?{eye:'A1 · EXPANDED SITUATION WORLD',title:'A1 Expanded World',intro:'短い日常場面をたくさん歩きながら、同じ単語や型に別の文脈で何度も再会します。',base:312,total:1560}:{eye:'A2 · EXPANDED CONNECTED WORLD',title:'A2 Expanded World',intro:'経験・完了・予定・把構文・条件表現を、日常の自然な文の中で繰り返し使います。',base:60,total:300};
eyebrow.textContent=cfg.eye;title.textContent=cfg.title;intro.textContent=cfg.intro;count.textContent='既存 '+cfg.base+'文 + 新規 '+all.length+'文 = 合計 '+cfg.total+'文';document.title='Chinese Structure Lab · '+level+' Expanded';
var cats=[];all.forEach(function(x){if(cats.indexOf(x.category)<0)cats.push(x.category)});function label(c){return({daily:'日常',travel:'移動',social:'人',service:'サービス',shopping:'買い物',food:'食事',work:'仕事・学習',plans:'予定'})[c]||c}function pool(){return category==='all'?all:all.filter(function(x){return x.category===category})}
function drawFilters(){filters.innerHTML='';[['all','すべて']].concat(cats.map(function(c){return[c,label(c)]})).forEach(function(x){var b=document.createElement('button');b.className='chip'+(category===x[0]?' on':'');b.textContent=x[1];b.onclick=function(){category=x[0];shown=0;list.innerHTML='';end.hidden=true;drawFilters();append()};filters.appendChild(b)})}
function emit(type,data){try{if(window.CSLLightEventBuffer)CSLLightEventBuffer.emit(type,data)}catch(e){}}
function makeCard(x){var c=document.createElement('article');c.className='card';c.innerHTML='<div class="meta">'+level+' · '+label(x.category)+'</div><div class="context"></div><div class="sentenceRow"><div class="zh"></div><button class="speak" aria-label="文を聞く">🔊</button></div><div class="wordsLabel">WORDS / CHUNKS</div><div class="words"></div><details class="help"><summary>文全体の発音・意味を見る ›</summary><div class="py"></div><div class="ja"></div></details>';c.querySelector('.context').textContent=x.context;c.querySelector('.zh').textContent=x.zh;c.querySelector('.py').textContent=x.py;c.querySelector('.ja').textContent=x.ja;c.querySelector('.speak').onclick=function(){CSLWordTouch.speak(x.zh,.86);emit('sentence_audio_played',{sentenceId:x.id,level:level,course:'fivefold-level',learnerInitiated:true})};var items=x.words.map(function(s,i){var p=String(s).split(' · '),left=p[0]||'',sp=left.indexOf(' '),z=sp<0?left:left.slice(0,sp),py=sp<0?'':left.slice(sp+1);return{id:x.id+'-w'+i,zh:z,py:py,ja:p[1]||''}});CSLWordTouch.mount(c.querySelector('.words'),items,{course:'fivefold-level',sentenceId:x.id});c.querySelector('.help').addEventListener('toggle',function(){if(this.open)emit('sentence_help_opened',{sentenceId:x.id,level:level,course:'fivefold-level'})});return c}
function append(){var p=pool(),next=p.slice(shown,shown+PAGE);next.forEach(function(x){list.appendChild(makeCard(x))});shown+=next.length;more.hidden=shown>=p.length;end.hidden=shown<p.length;if(!next.length){more.hidden=true;end.hidden=false}}
more.onclick=append;drawFilters();append();
})();
