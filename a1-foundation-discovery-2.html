ich one','どれ'],'多少':['duōshao','how many / how much','いくつ・いくら'],'几':['jǐ','how many','いくつ'],'呢':['ne','and...?/topic question','〜は？'],'吗':['ma','yes/no question particle','〜ですか'],'去':['qù','go','行く'],'来':['lái','come','来る'],'回家':['huí jiā','go home','家に帰る'],'吃饭':['chīfàn','eat / have a meal','食事する'],'喝茶':['hē chá','drink tea','お茶を飲む'],'看书':['kàn shū','read','本を読む'],'学习':['xuéxí','study','勉強する'],'工作':['gōngzuò','work','働く']};

['😓📚','我今天很忙。','wǒ jīntiān hěn máng','I am very busy today.','今日はとても忙しいです。','Time precedes the descriptive predicate.','我|今天|很|忙'],

['🌶️😅','我不太喜欢辣的。','wǒ bú tài xǐhuan là de','I do not really like spicy food.','辛いものはあまり好きではありません。','不太 softens a negative judgment.','我|不太|喜欢'],
['🗣️🇨🇳','我会说中文。','wǒ huì shuō Zhōngwén','I can speak Chinese.','中国語を話せます。','会 often means learned ability.','我|会|说中文'],

['☕🙂','我想喝茶。','wǒ xiǎng hē chá','I would like tea.','お茶を飲みたいです。','想 + action expresses desire/intention.','我|想|喝茶'],
['🍜❓','你想吃什么？','nǐ xiǎng chī shénme','What do you want to eat?','何を食べたいですか。','The question word stays in the object slot.','你|想|什么'],
['🛍️👕','我要这个。','wǒ yào zhège','I want this one.','これをください。','我要… is a common choice/request frame.','我|要|这个'],
['🚕❓','你要去哪儿？','nǐ yào qù nǎr','Where are you going?','どこへ行きますか。','哪儿 occupies the destination slot.','你|要|去|哪儿'],

['🌅7️⃣','我早上七点起床。','wǒ zǎoshang qī diǎn qǐchuáng','I get up at seven in the morning.','朝7時に起きます。','Broad time comes before exact time.','我|早上'],
['🌙📖','我晚上看书。','wǒ wǎnshang kàn shū','I read in the evening.','夜、本を読みます。','Time frame precedes action.','我|晚上|看书'],
['🔁☕','我每天喝咖啡。','wǒ měitiān hē kāfēi','I drink coffee every day.','毎日コーヒーを飲みます。','每天 marks routine.','我|每天'],
['🔁📚','她常常在家学习。','tā chángcháng zài jiā xuéxí','She often studies at home.','彼女はよく家で勉強します。','Frequency + location + action.','她|常常|在|家|学习'],

['👤📍❓','你在哪儿？','nǐ zài nǎr','Where are you?','どこにいますか。','哪儿 replaces the location.','你|在|哪儿'],
