name: Japanese Structure Lab Foundation

on:
  pull_request:
    paths:
      - 'japanese/**'
      - 'tests/japanese-*.js'
      - '.github/workflows/japanese-foundation.yml'
  push:
    branches:
      - 'feature/japanese-structure-lab-v0.1'
    paths:
      - 'japanese/**'
      - 'tests/japanese-*.js'
      - '.github/workflows/japanese-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Japanese JavaScript syntax
        run: |
          node --check japanese/app.js
          node --check japanese/reencounter-engine.js
          node --check japanese/reencounter-ui.js
      - name: Verify Japanese Structure Lab foundation
        run: node tests/japanese-foundation-smoke.js
