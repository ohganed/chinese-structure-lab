name: Apply Shared Layers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip shared-layers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce user-session-first runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          realtime_layers=[
            '<script src="./platform-bridge.js"></script>',
            '<script src="./audio-haptics-layer.js"></script>',
            '<script src="./storage-core.js"></script>',
            '<script src="./light-event-buffer.js"></script>',
            '<script src="./interaction-ledger.js"></script>',
            '<script src="./session-end-analyzer.js"></script>',
            '<script src="./word-touch-engine.js"></script>',
            '<script src="./legacy-word-touch-upgrader.js"></script>',
            '<script src="./interactive-cues.js"></script>',
            '<script src="./senior-accessibility.js"></script>',
            '<script src="./a1-pedagogy-layer.js"></script>',
            '<script src="./curriculum-pedagogy-layer.js"></script>',
            '<script src="./feedback-layer.js"></script>'
          ]
          heavy=[
            'learning-memory-engine.js','learner-model-engine.js','reencounter-planner.js',
            'situation-graph-engine.js','persistent-world-engine.js','language-graph-engine.js',
            'meaning-sense-graph-engine.js','encounter-quality-engine.js','retrieval-need-engine.js',
            'opportunity-matching-engine.js','adaptive-presentation-engine.js','presentation-policy-layer.js',
            'learning-os-core.js','contradiction-quality-auditor.js','evidence-confidence-engine.js',
            'intervention-budget-engine.js','learner-agency-engine.js','learning-rhythm-engine.js',
            'cognitive-load-guard.js','temporal-pattern-engine.js','support-regulation-engine.js',
            'curriculum-balance-engine.js','continuity-resilience-engine.js','underground-floor-registry.js',
            'deep-underground-orchestrator.js','underground-constitution.js','underground-governor.js',
            'decision-trace-ledger.js','underground-integration-bus.js','counterfactual-simulator.js',
            'underground-runtime-self-test.js'
          ]
          realtime_analysis=['reencounter-layer.js']
          session_guide='<script src="./session-guide.js"></script>'
          situation='<script src="./situation-layer.js"></script>'
          words_return='<script src="./words-come-back-word-layer.js"></script>'
          next_plan='<script src="./next-session-plan-layer.js"></script>'
          fivefold_nav='<script src="./fivefold-nav-layer.js"></script>'
          no_situation={'index.html','explore.html','course-map.html','memory.html','garden.html','tester.html','fivefold-level.html'}
          no_session_guide={'tester.html'}
          fast_path_pages={'tired.html'}
          changed=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8');original=text
              for src in heavy+realtime_analysis:
                  text=text.replace(f'<script src="./{src}"></script>','')
              if p.name not in fast_path_pages:
                  for layer in realtime_layers:
                      if layer not in text and '</body>' in text:
                          text=text.replace('</body>',layer+'</body>',1)
                  if p.name not in no_session_guide and session_guide not in text and '</body>' in text:
                      text=text.replace('</body>',session_guide+'</body>',1)
                  if p.name not in no_situation and situation not in text and '</body>' in text:
                      text=text.replace('</body>',situation+'</body>',1)
                  if p.name=='index.html':
                      for layer in [words_return,next_plan]:
                          if layer not in text and '</body>' in text:text=text.replace('</body>',layer+'</body>',1)
                  if p.name=='explore.html' and fivefold_nav not in text and '</body>' in text:
                      text=text.replace('</body>',fivefold_nav+'</body>',1)
              if text!=original:
                  p.write_text(text,encoding='utf-8');changed.append(p.name)
          print('Session-boundary runtime applied to:',', '.join(changed) if changed else 'nothing new')
          PY

      - name: Validate JavaScript syntax and architecture
        shell: bash
        run: |
          for f in *.js; do node --check "$f"; done
          node tests/curriculum-expansion-smoke.js
          node tests/fivefold-level-expansion-smoke.js
          node tests/natural-chinese-audit.js
          python3 - <<'PY'
          from pathlib import Path
          heavy=['learning-memory-engine.js','learner-model-engine.js','reencounter-planner.js','situation-graph-engine.js','persistent-world-engine.js','language-graph-engine.js','meaning-sense-graph-engine.js','encounter-quality-engine.js','retrieval-need-engine.js','opportunity-matching-engine.js','adaptive-presentation-engine.js','presentation-policy-layer.js','learning-os-core.js','contradiction-quality-auditor.js','evidence-confidence-engine.js','intervention-budget-engine.js','learner-agency-engine.js','learning-rhythm-engine.js','cognitive-load-guard.js','temporal-pattern-engine.js','support-regulation-engine.js','curriculum-balance-engine.js','continuity-resilience-engine.js','underground-floor-registry.js','deep-underground-orchestrator.js','underground-constitution.js','underground-governor.js','decision-trace-ledger.js','underground-integration-bus.js','counterfactual-simulator.js','underground-runtime-self-test.js']
          analyzer=Path('session-end-analyzer.js').read_text()
          missing=[x for x in heavy if x!='underground-runtime-self-test.js' and x not in analyzer]
          if missing: raise SystemExit('Session End Analyzer missing underground modules: '+', '.join(missing))
          if 'flushBeforeAnalysis:true' not in analyzer or 'CSLLightEventBuffer.flush' not in analyzer:
              raise SystemExit('Session End Analyzer must flush raw buffered learning events before analysis')
          buf=Path('light-event-buffer.js').read_text()
          if 'setTimeout(flush' in buf or "addEventListener('pagehide',flush" in buf or "visibilitychange" in buf:
              raise SystemExit('Light event buffer still flushes during learning')
          ledger=Path('interaction-ledger.js').read_text()
          if 'patchSentence(' in ledger or 'CSLStorage.load()' in ledger:
              raise SystemExit('Interaction ledger still performs profile work during learning')
          consumer=Path('next-session-plan-layer.js').read_text()
          forbidden=['CSLStorage.save','CSLStorage.addEvent','CSLStorage.patchSentence','CSLLearningMemory','CSLLearnerModel','CSLReencounterPlanner.refresh','CSLDeepUnderground','CSLUndergroundIntegration']
          bad=[x for x in forbidden if x in consumer]
          if bad: raise SystemExit('Next Session Plan consumer is not read-only: '+', '.join(bad))
          if "localStorage.getItem(ROOT_KEY)" not in consumer or 'precomputedPlanOnly:true' not in consumer:
              raise SystemExit('Next Session Plan consumer must read precomputed profile state only')
          bus=Path('underground-integration-bus.js').read_text()
          if "setTimeout(function(){run('startup')" in bus or "addEventListener('csl:" in bus:
              raise SystemExit('Integration bus still contains real-time/startup analysis triggers')
          deep=Path('deep-underground-orchestrator.js').read_text()
          if "setTimeout(function()" in deep or "addEventListener('csl:" in deep:
              raise SystemExit('Deep underground still contains automatic learning-time triggers')
          selftest=Path('underground-runtime-self-test.js').read_text()
          if 'setTimeout(run' in selftest:
              raise SystemExit('Underground self-test still auto-runs')
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              eager=[src for src in heavy if f'<script src="./{src}"></script>' in text]
              if eager: raise SystemExit(f'{p}: eager underground scripts remain: '+', '.join(eager))
              if 'reencounter-layer.js' in text: raise SystemExit(f'{p}: real-time reencounter analysis remains')
              if p.name not in {'tired.html','tester.html'}:
                  for required in ['light-event-buffer.js','session-end-analyzer.js','word-touch-engine.js','legacy-word-touch-upgrader.js']:
                      if required not in text: raise SystemExit(f'{p}: missing {required}')
          index=Path('index.html').read_text()
          for required in ['words-come-back-word-layer.js','next-session-plan-layer.js']:
              if required not in index: raise SystemExit('index.html: missing '+required)
          explore=Path('explore.html').read_text()
          if 'fivefold-nav-layer.js' not in explore: raise SystemExit('explore.html: missing fivefold curriculum entrance layer')
          expanded=Path('fivefold-level.html').read_text()
          if 'natural-chinese-overrides.js' not in expanded: raise SystemExit('fivefold-level.html: Natural Chinese correction layer is missing')
          print('Closed user loop verified: raw events during learning; underground at explicit end; precomputed plan consumed read-only next session.')
          PY

      - name: Commit generated runtime wiring
        shell: bash
        run: |
          if git diff --quiet; then echo "No changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Wire next-session plan consumer [skip shared-layers]"
          git push
