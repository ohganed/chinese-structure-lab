name: Apply Shared Layers

on:
  push:
    branches: [main, underground-integration-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip shared-layers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect Chinese Learning OS and shared learning layers to pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          layers=[
            '<script src="./platform-bridge.js"></script>',
            '<script src="./audio-haptics-layer.js"></script>',
            '<script src="./storage-core.js"></script>',
            '<script src="./learning-memory-engine.js"></script>',
            '<script src="./learner-model-engine.js"></script>',
            '<script src="./reencounter-planner.js"></script>',
            '<script src="./situation-graph-engine.js"></script>',
            '<script src="./persistent-world-engine.js"></script>',
            '<script src="./language-graph-engine.js"></script>',
            '<script src="./meaning-sense-graph-engine.js"></script>',
            '<script src="./encounter-quality-engine.js"></script>',
            '<script src="./retrieval-need-engine.js"></script>',
            '<script src="./opportunity-matching-engine.js"></script>',
            '<script src="./adaptive-presentation-engine.js"></script>',
            '<script src="./presentation-policy-layer.js"></script>',
            '<script src="./learning-os-core.js"></script>',
            '<script src="./contradiction-quality-auditor.js"></script>',
            '<script src="./evidence-confidence-engine.js"></script>',
            '<script src="./intervention-budget-engine.js"></script>',
            '<script src="./learner-agency-engine.js"></script>',
            '<script src="./learning-rhythm-engine.js"></script>',
            '<script src="./cognitive-load-guard.js"></script>',
            '<script src="./underground-governor.js"></script>',
            '<script src="./decision-trace-ledger.js"></script>',
            '<script src="./underground-integration-bus.js"></script>',
            '<script src="./interactive-cues.js"></script>',
            '<script src="./senior-accessibility.js"></script>',
            '<script src="./a1-pedagogy-layer.js"></script>',
            '<script src="./curriculum-pedagogy-layer.js"></script>',
            '<script src="./feedback-layer.js"></script>'
          ]
          session_guide='<script src="./session-guide.js"></script>'
          reencounter='<script src="./reencounter-layer.js"></script>'
          situation='<script src="./situation-layer.js"></script>'
          no_situation={'index.html','explore.html','course-map.html','memory.html','garden.html','tester.html'}
          no_session_guide={'tester.html'}
          no_reencounter={'doorways.html','explore.html','course-map.html','memory.html','garden.html','tester.html'}
          changed=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8');original=text
              for layer in layers:
                  if layer not in text and '</body>' in text:text=text.replace('</body>',layer+'</body>',1)
              if p.name not in no_session_guide and session_guide not in text and '</body>' in text:text=text.replace('</body>',session_guide+'</body>',1)
              if p.name not in no_reencounter and reencounter not in text and '</body>' in text:text=text.replace('</body>',reencounter+'</body>',1)
              if p.name not in no_situation and situation not in text and '</body>' in text:text=text.replace('</body>',situation+'</body>',1)
              if text!=original:p.write_text(text,encoding='utf-8');changed.append(p.name)
          print('Connected shared layers to:',', '.join(changed) if changed else 'nothing new')
          PY

      - name: Validate underground JavaScript syntax
        shell: bash
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Validate integration wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required=['storage-core.js','learner-model-engine.js','opportunity-matching-engine.js','adaptive-presentation-engine.js','presentation-policy-layer.js','evidence-confidence-engine.js','intervention-budget-engine.js','learner-agency-engine.js','learning-rhythm-engine.js','cognitive-load-guard.js','underground-governor.js','decision-trace-ledger.js','underground-integration-bus.js']
          missing=[x for x in required if not Path(x).exists()]
          if missing: raise SystemExit('Missing underground files: '+', '.join(missing))
          bus=Path('underground-integration-bus.js').read_text()
          checks=['CSLUndergroundGovernor','CSLInterventionBudget','CSLDecisionTrace','CSLLearnerAgency']
          absent=[x for x in checks if x not in bus]
          if absent: raise SystemExit('Integration bus missing APIs: '+', '.join(absent))
          print('Integration wiring static checks passed.')
          PY

      - name: Commit generated connections
        shell: bash
        run: |
          if git diff --quiet; then echo "No changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply integrated underground layers [skip shared-layers]"
          git push
