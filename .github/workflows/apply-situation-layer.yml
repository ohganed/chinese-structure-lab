name: Apply Situation Layer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip situation-layer]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect shared Situation Layer to lesson pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          skip = {
              'index.html', 'explore.html', 'course-map.html',
              'memory.html', 'garden.html'
          }
          tag = '<script src="./situation-layer.js"></script>'

          changed = []
          for p in Path('.').glob('*.html'):
              if p.name in skip:
                  continue
              text = p.read_text(encoding='utf-8')
              if tag in text:
                  continue
              # Lesson pages are intentionally broad: the shared JS is harmless
              # when a page has no .zh example node, and this keeps future
              # example pages covered automatically.
              if '</body>' in text:
                  text = text.replace('</body>', tag + '</body>', 1)
                  p.write_text(text, encoding='utf-8')
                  changed.append(p.name)

          print('Connected Situation Layer to:', ', '.join(changed) if changed else 'nothing new')
          PY

      - name: Commit generated connections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply emoji situation layer to all lesson pages [skip situation-layer]"
          git push
