name: Apply Shared Layers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip shared-layers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect persistent storage, feedback, time guide, reencounter and Situation Layer to pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          storage = '<script src="./storage-core.js"></script>'
          feedback = '<script src="./feedback-layer.js"></script>'
          session_guide = '<script src="./session-guide.js"></script>'
          reencounter = '<script src="./reencounter-layer.js"></script>'
          situation = '<script src="./situation-layer.js"></script>'
          no_situation = {'index.html','explore.html','course-map.html','memory.html','garden.html','tester.html'}
          no_session_guide = {'tester.html'}
          no_reencounter = {'doorways.html','explore.html','course-map.html','memory.html','garden.html','tester.html'}
          changed=[]

          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              original=text

              if storage not in text and '</body>' in text:
                  text=text.replace('</body>',storage+'</body>',1)

              # Feedback is intentionally global so both short-term testers and long-term learners
              # can report friction at the exact moment it happens. It never sends learning history.
              if feedback not in text and '</body>' in text:
                  text=text.replace('</body>',feedback+'</body>',1)

              # A time-based Doorway is a gentle session intention, never a forced timer.
              # The guide follows the learner across normal pages and offers a natural stopping point.
              if p.name not in no_session_guide and session_guide not in text and '</body>' in text:
                  text=text.replace('</body>',session_guide+'</body>',1)

              # Reencounter is quiet and contextual: it only appears when a sentence previously
              # marked fuzzy actually returns on another learning page.
              if p.name not in no_reencounter and reencounter not in text and '</body>' in text:
                  text=text.replace('</body>',reencounter+'</body>',1)

              if p.name not in no_situation and situation not in text and '</body>' in text:
                  text=text.replace('</body>',situation+'</body>',1)

              if text!=original:
                  p.write_text(text,encoding='utf-8')
                  changed.append(p.name)

          print('Connected shared layers to:',', '.join(changed) if changed else 'nothing new')
          PY

      - name: Commit generated connections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply storage, feedback, time guide, reencounter and situation layers [skip shared-layers]"
          git push
