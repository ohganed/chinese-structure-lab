name: Protect Connected World Word Birth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[skip word-birth]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire stable word-birth layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="./index-word-birth-layer.js"></script>'
          if tag not in text:
              text=text.replace('</body>',tag+'</body>',1)
              p.write_text(text,encoding='utf-8')
          if tag not in p.read_text(encoding='utf-8'):
              raise SystemExit('index word-birth layer was not wired')
          js=Path('index-word-birth-layer.js').read_text(encoding='utf-8')
          for required in ["? -> learner tap", "word_meaning_revealed", "word_detail_revealed", "csl-born-word", "speakNow(item.zh)"]:
              if required not in js:
                  raise SystemExit('word-birth layer missing '+required)
          print('Connected World word-birth flow wired and protected.')
          PY
          node --check index-word-birth-layer.js
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then echo "No changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire stable Connected World word cards [skip word-birth]"
          git push
