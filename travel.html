<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Travel</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.back{color:#777;text-decoration:none}.head{margin:28px 0}.head h1{font-size:30px;margin:6px 0}.head p,.muted{color:#777}.progress{height:6px;background:#e7e3d9;border-radius:9px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:#222;width:8%}.chapter{font-size:12px;color:#888;margin:26px 2px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700;margin:10px 0 3px}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:10px}.ja{font-size:11px;color:#aaa;margin-top:3px}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.ghost{border:1px solid #ddd;background:transparent;color:#333;margin-left:6px}details{margin-top:13px;border-top:1px solid #eee;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#666;line-height:1.65;margin-top:9px}.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.word{border:0;background:#f1efe8;border-radius:14px;padding:8px 11px;display:flex;align-items:center;gap:7px;text-align:left}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#777}.wordplay{font-size:10px;color:#777}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1>Travel</h1><p>From arrival to station, transport, hotel and asking for help.</p><div class="progress"><i></i></div><div class="muted">24 useful lines · 6 scenes · analysis already inside</div></div><div id="course"></div><div class="version">prototype 0.9 · word audio</div></div><script>var groups=[['1 · Arrive',[['你好，请问……','nǐ hǎo, qǐngwèn…','Hello, excuse me…','こんにちは、すみません…。','请问 is a polite doorway into a question.','你好 hello|请问 excuse me / may I ask'],['洗手间在哪儿？','xǐshǒujiān zài nǎr','Where is the restroom?','トイレはどこですか。','Place + 在哪儿？ asks where a place or thing is.','洗手间 restroom|在 at|哪儿 where'],['这儿有Wi-Fi吗？','zhèr yǒu Wi-Fi ma','Is there Wi-Fi here?','ここにWi-Fiはありますか。','Place + 有 + thing + 吗 asks whether something exists there.','这儿 here|有 there is|吗 question'],['谢谢你。','xièxie nǐ','Thank you.','ありがとう。','你 can be added after 谢谢 to make the recipient explicit.','谢谢 thank|你 you']]],['2 · Station',[['地铁站在哪儿？','dìtiě zhàn zài nǎr','Where is the subway station?','地下鉄駅はどこですか。','Reuse the 在哪儿 pattern with a new place.','地铁 subway|站 station|哪儿 where'],['怎么去车站？','zěnme qù chēzhàn','How do I get to the station?','駅へはどう行きますか。','怎么 + verb asks how an action is done.','怎么 how|去 go|车站 station'],['一直走。','yìzhí zǒu','Go straight.','まっすぐ行ってください。','一直 + movement verb = keep going straight/continuously.','一直 straight/continuously|走 walk/go'],['然后左转。','ránhòu zuǒzhuǎn','Then turn left.','それから左に曲がります。','然后 links the next step in a sequence.','然后 then|左转 turn left']]],['3 · Ticket',[['我要一张票。','wǒ yào yì zhāng piào','I’d like one ticket.','切符を一枚ください。','Number + measure word + noun: 一张票.','要 want|一 one|张 flat-item MW|票 ticket'],['去北京。','qù Běijīng','To Beijing.','北京まで。','A destination can stand alone in a ticket-buying context.','去 to/go|北京 Beijing'],['几点出发？','jǐ diǎn chūfā','What time does it leave?','何時に出発しますか。','几点 asks clock time; 出发 means depart/set off.','几点 what time|出发 depart'],['在哪个站台？','zài nǎge zhàntái','Which platform is it at?','どのホームですか。','哪个 = which; 在 introduces the location.','在 at|哪个 which|站台 platform']]],['4 · Moving',[['我去北京。','wǒ qù Běijīng','I’m going to Beijing.','北京へ行きます。','Subject + 去 + destination.','我 I|去 go|北京 Beijing'],['下一站是什么？','xià yí zhàn shì shénme','What is the next stop?','次の駅はどこですか。','是什么 asks what something is.','下一站 next stop|是 is|什么 what'],['到了吗？','dào le ma','Are we there yet?','着きましたか。','到 = arrive; 了 marks the changed state; 吗 asks yes/no.','到 arrive|了 new state|吗 question'],['我在这里下车。','wǒ zài zhèlǐ xiàchē','I get off here.','ここで降ります。','在这里 locates where the action 下车 happens.','这里 here|下车 get off']]],['5 · Hotel',[['我有预订。','wǒ yǒu yùdìng','I have a reservation.','予約しています。','有 + noun = have something.','有 have|预订 reservation'],['这是我的护照。','zhè shì wǒ de hùzhào','This is my passport.','これは私のパスポートです。','我的 = my; 的 links possessor and noun.','这 this|是 is|我的 my|护照 passport'],['房间在哪儿？','fángjiān zài nǎr','Where is the room?','部屋はどこですか。','The same 在哪儿 location pattern appears again.','房间 room|在哪儿 where'],['有早餐吗？','yǒu zǎocān ma','Is breakfast available?','朝食はありますか。','有 + noun + 吗 asks availability.','有 have/is there|早餐 breakfast|吗 question']]],['6 · Problems & help',[['请帮我一下。','qǐng bāng wǒ yíxià','Please help me for a moment.','ちょっと手伝ってください。','一下 softens a request by making the action feel small/brief.','请 please|帮 help|我 me|一下 a little'],['我听不懂。','wǒ tīngbudǒng','I don’t understand what I hear.','聞いて理解できません。','听不懂 is a result-complement pattern: hear but fail to understand.','听 hear|不 not|懂 understand'],['请再说一遍。','qǐng zài shuō yí biàn','Please say it again.','もう一度言ってください。','再 = again; 一遍 counts one complete repetition.','再 again|说 say|一遍 once through'],['可以说慢一点儿吗？','kěyǐ shuō màn yìdiǎnr ma','Could you speak a little more slowly?','もう少しゆっくり話してもらえますか。','可以…吗 creates a polite possibility/request frame.','可以 can|说 speak|慢 slow|一点儿 a little|吗 question']]]];function voices(){var v=speechSynthesis.getVoices().filter(function(x){return /^zh(-|_)?CN/i.test(x.lang)||/^zh/i.test(x.lang)});return v.filter(function(x){return x.localService}).concat(v.filter(function(x){return !x.localService}))}function speak(t,r){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r||.88;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button type="button" class="word" onclick="event.stopPropagation();speak(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="speak(\''+x[0].replace(/'/g,'')+'\',.9)">▶ Natural</button><button class="speak ghost" onclick="speak(\''+x[0].replace(/'/g,'')+'\',.68)">Slow</button><details><summary>Open the words</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>Open the structure</summary><div class="note">'+x[4]+'</div></details></div>'}document.getElementById('course').innerHTML=groups.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script></body></html>
