<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Communication & Plans</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 85px}.top{display:flex;justify-content:space-between;gap:8px}.back{color:#666;text-decoration:none}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700}.head{margin:28px 0}.head h1{font-size:30px;margin:5px 0}.head p{color:#666}.chapter{font-size:12px;color:#888;margin:28px 2px 9px;font-weight:700}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#888}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.s{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.word{border:0;background:#f1efe8;border-radius:14px;padding:8px 11px}.senior .head h1{font-size:40px}.senior .head p{font-size:20px}.senior .lesson{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:23px}.senior .s{font-size:19px;padding:14px 18px}.senior summary{font-size:20px}.senior .word{font-size:18px;padding:12px 14px}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1 data-en="Communication & Plans" data-ja="連絡と約束">Communication & Plans</h1><p data-en="Calls, messages, dates, invitations and changing plans." data-ja="電話・メッセージ・曜日・誘い・予定変更まで。">Calls, messages, dates, invitations and changing plans.</p><div>24 lines · 6 scenes</div></div><div id="course"></div></div><script>var G=[['1 · Phone',[['喂，你好。','wèi, nǐ hǎo','Hello?','もしもし、こんにちは。','Phone greeting.','喂 hello(phone)|你好 hello'],['你现在方便吗？','nǐ xiànzài fāngbiàn ma','Is now a good time?','今、大丈夫ですか。','方便 can mean convenient/available.','现在 now|方便 convenient|吗 question'],['我晚点儿给你打电话。','wǒ wǎndiǎnr gěi nǐ dǎ diànhuà','I’ll call you later.','あとで電話します。','给你 + verb = do something for/to you.','晚点儿 later|给你 to you|打电话 call'],['好，等你电话。','hǎo, děng nǐ diànhuà','Okay, I’ll wait for your call.','わかりました、電話待っています。','等 + noun/person = wait for.','等 wait|电话 call']]],['2 · Message',[['我给你发消息。','wǒ gěi nǐ fā xiāoxi','I’ll send you a message.','メッセージを送ります。','发消息 = send a message.','发 send|消息 message'],['你看到了吗？','nǐ kàndào le ma','Did you see it?','見ましたか。','看到 is a result complement: see successfully.','看 look|到 result|了 completed|吗 question'],['我刚看到。','wǒ gāng kàndào','I just saw it.','今見たところです。','刚 = just now.','刚 just now|看到 saw'],['没问题。','méi wèntí','No problem.','問題ありません。','Fixed high-frequency chunk.','没 no|问题 problem']]],['3 · Day & date',[['今天星期几？','jīntiān xīngqī jǐ','What day is it today?','今日は何曜日ですか。','星期几 asks day of week.','今天 today|星期 week/day|几 which'],['今天星期六。','jīntiān xīngqī liù','Today is Saturday.','今日は土曜日です。','No 是 needed here.','星期六 Saturday'],['明天几号？','míngtiān jǐ hào','What date is tomorrow?','明日は何日ですか。','几号 asks calendar date.','明天 tomorrow|几号 what date'],['明天十六号。','míngtiān shíliù hào','Tomorrow is the 16th.','明日は16日です。','Number + 号 for dates.','十六 sixteen|号 date marker']]],['4 · Invite',[['晚上一起吃饭吗？','wǎnshang yìqǐ chīfàn ma','Shall we eat together tonight?','今晩一緒に食べませんか。','一起 before verb.','晚上 evening|一起 together|吃饭 eat'],['好啊。','hǎo a','Sure.','いいですね。','啊 adds warmth.','好 good/okay|啊 tone'],['几点见？','jǐ diǎn jiàn','What time shall we meet?','何時に会いますか。','几点 + 见.','几点 what time|见 meet'],['七点怎么样？','qī diǎn zěnmeyàng','How about seven?','7時はどうですか。','怎么样 proposes/evaluates.','七点 seven|怎么样 how about']]],['5 · Change plans',[['对不起，我今天有事。','duìbuqǐ, wǒ jīntiān yǒu shì','Sorry, something came up today.','すみません、今日は用事があります。','有事 = have something to do.','对不起 sorry|有事 have something'],['我们改天吧。','wǒmen gǎitiān ba','Let’s do another day.','別の日にしましょう。','改天 = another day.','改天 another day|吧 suggestion'],['明天可以吗？','míngtiān kěyǐ ma','Is tomorrow okay?','明日は大丈夫ですか。','可以吗 asks acceptability.','明天 tomorrow|可以 okay|吗 question'],['明天下午可以。','míngtiān xiàwǔ kěyǐ','Tomorrow afternoon works.','明日の午後なら大丈夫です。','Time frame first.','下午 afternoon|可以 works']]],['6 · Confirm',[['我们三点见。','wǒmen sān diǎn jiàn','We’ll meet at three.','3時に会いましょう。','Clock time before verb.','三点 three|见 meet'],['在车站见。','zài chēzhàn jiàn','Meet at the station.','駅で会いましょう。','在 + place + verb.','在 at|车站 station|见 meet'],['别迟到。','bié chídào','Don’t be late.','遅れないでください。','别 + verb = don’t.','别 do not|迟到 be late'],['放心吧。','fàngxīn ba','Don’t worry.','安心してください。','Fixed reassuring chunk.','放心 relax/worry not|吧 softener']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function word(w){var p=w.split(' '),z=p.shift();return '<button class="word" onclick="sp(\''+z+'\',.8)">'+z+' ▶<br><small>'+p.join(' ')+'</small></button>'}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="s" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="s slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'単語を開く':'Open the words')+'</summary><div class="words">'+x[5].split('|').map(word).join('')+'</div></details></div>'}function render(){course.innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}function apply(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});lang.textContent=mode==='ja'?'English':'日本語';size.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script></body></html>
