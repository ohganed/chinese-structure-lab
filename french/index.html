<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>French Structure Lab</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./deep-view.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div>
        <div class="brand">French Structure Lab</div>
        <div class="sub">Sound → Words → Expressions → Meaning → Structure</div>
      </div>
      <div class="top-actions"><button class="quiet-button text-button" id="openMyText" type="button">My Text</button><button class="quiet-button" id="themeButton" type="button" aria-label="表示テーマを切り替える">◐</button></div>
    </header>

    <section class="lesson-nav" aria-label="教材ナビゲーション">
      <button type="button" id="prevLesson" class="nav-button" aria-label="前の教材">‹</button>
      <label class="lesson-picker-wrap"><span>LESSON</span><select id="lessonPicker" aria-label="教材を選ぶ"></select></label>
      <button type="button" id="nextLesson" class="nav-button" aria-label="次の教材">›</button>
    </section>

    <section class="sentence-card" aria-labelledby="sentenceLabel">
      <div class="eyebrow" id="sentenceLabel">CURRENT SENTENCE</div>
      <p class="sentence" id="sentence">Chargement…</p>
      <p class="translation" id="translation" hidden></p>
      <div class="audio-row" aria-label="音声速度">
        <button type="button" data-speech-rate="1">▶ Natural</button>
        <button type="button" data-speech-rate="0.82">Clear</button>
        <button type="button" data-speech-rate="0.68">Slow</button>
      </div>
    </section>

    <section class="flow-guide" aria-label="観察の流れ">
      <div class="flow-guide-head"><span>観察の流れ</span><small>順番は自由です</small></div>
      <div class="flow-guide-track">
        <button type="button" data-flow-mode="listen" aria-current="step"><span>1</span>音から見る</button>
        <button type="button" data-flow-mode="words"><span>2</span>単語を開く</button>
        <button type="button" data-flow-mode="chunks"><span>3</span>意味のまとまり</button>
        <button type="button" data-flow-mode="structure"><span>4</span>構造を見る</button>
        <button type="button" data-flow-mode="sound"><span>5</span>音を深掘り</button>
      </div>
    </section>

    <nav class="mode-tabs" aria-label="観察モード">
      <button type="button" class="active" data-mode="listen">Listen</button>
      <button type="button" data-mode="words">Open the Words</button>
      <button type="button" data-mode="expressions">Expressions</button>
      <button type="button" data-mode="chunks">Meaning Chunks</button>
      <button type="button" data-mode="structure">Structure</button>
      <button type="button" data-mode="sound">Sound Lab</button>
      <button type="button" data-mode="transform">Transform</button>
      <button type="button" data-mode="map">Learning Map</button>
    </nav>

    <section class="workspace" id="workspace" aria-live="polite"></section>
  </main>

  <aside class="drawer" id="wordDrawer" aria-hidden="true" aria-label="詳細">
    <div class="drawer-head"><div><div class="eyebrow" id="detailKind">DETAIL</div><h2 id="detailSurface"></h2></div><button type="button" class="close-button" id="closeDrawer" aria-label="詳細を閉じる">×</button></div>
    <div class="drawer-body" id="detailBody" tabindex="0"></div>
  </aside>

  <section class="mytext-panel" id="myTextPanel" hidden aria-labelledby="myTextTitle">
    <div class="mytext-head"><div><div class="eyebrow">MY TEXT · LOCAL ONLY</div><h2 id="myTextTitle">自分のフランス語を置く</h2></div><button type="button" class="close-button" id="closeMyText" aria-label="My Textを閉じる">×</button></div>
    <p class="hint">内蔵教材とは別領域に保存します。自動解析結果を「検証済み教材」とは扱いません。</p>
    <textarea id="myTextInput" lang="fr" rows="5" placeholder="例: Je voudrais prendre un café en terrasse."></textarea>
    <div class="mytext-toolbar"><button type="button" id="speakMyText">▶ 読む</button><button type="button" id="saveMyText">端末に保存</button></div>
    <div class="mytext-transfer"><button type="button" id="exportMyText">JSON書き出し</button><label class="import-label">JSON読み込み<input type="file" id="importMyText" accept="application/json,.json"></label></div>
    <p class="mytext-status" id="myTextStatus" aria-live="polite"></p>
    <div id="myTextObserve" class="mytext-observe" hidden></div>
    <div id="myTextList" class="mytext-list"></div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./deep-view.js"></script>
  <script type="module" src="./my-text.js"></script>
  <script type="module" src="./learning-flow.js"></script>
</body>
</html>
