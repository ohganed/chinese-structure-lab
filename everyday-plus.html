<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Everyday Plus</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 90px}.back{color:#666;text-decoration:none}.top{display:flex;justify-content:space-between;gap:8px}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700}.head{margin:28px 0}.head h1{font-size:32px;margin:6px 0}.head p{color:#666;line-height:1.6}.chapter{font-size:12px;color:#888;margin:30px 2px 9px;font-weight:700;letter-spacing:.08em}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700;line-height:1.45}.py{font-size:16px;color:#555;margin-top:4px}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#888;margin-top:4px}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:11px 15px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#555;line-height:1.65;margin-top:9px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#f1efe8;padding:8px 11px;border-radius:14px;display:flex;align-items:center;gap:7px}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#666}.wordplay{font-size:10px}.senior .head h1{font-size:42px}.senior .head p{font-size:20px}.senior .chapter{font-size:18px}.senior .lesson{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:23px}.senior.jp .en{font-size:17px}.senior.jp .ja{font-size:24px}.senior .speak{font-size:19px;padding:14px 18px}.senior summary{font-size:20px}.senior .note{font-size:19px}.senior .wordzh{font-size:27px}.senior .wordgloss{font-size:17px}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="head"><div style="font-size:11px;color:#888">A1 · BUILT-IN COURSE</div><h1 data-en="Everyday Plus" data-ja="日常生活プラス">Everyday Plus</h1><p data-en="Weather, health, home and city life—four everyday worlds that textbooks often scatter across separate chapters." data-ja="天気・健康・家・街。教科書では別々になりがちな内容を、生活の流れとしてまとめます。">Weather, health, home and city life—four everyday worlds that textbooks often scatter across separate chapters.</p><div style="color:#777" data-en="32 useful lines · 8 scenes" data-ja="32文 · 8場面">32 useful lines · 8 scenes</div></div><div id="course"></div></div><script>var G=[['1 · Weather now',[['今天天气很好。','jīntiān tiānqì hěn hǎo','The weather is nice today.','今日は天気がいいです。','天气 is the topic; 很 links it naturally to 好.','今天 today|天气 weather|很好 very good'],['今天很热。','jīntiān hěn rè','It is hot today.','今日は暑いです。','Time phrase first; adjective predicate after it.','今天 today|热 hot'],['外面很冷。','wàimiàn hěn lěng','It is cold outside.','外は寒いです。','外面 sets the location frame.','外面 outside|冷 cold'],['下雨了。','xiàyǔ le','It has started raining.','雨が降ってきました。','了 marks a change of state: now it is raining.','下雨 rain|了 change']]],['2 · Weather plans',[['明天天气怎么样？','míngtiān tiānqì zěnmeyàng','How will the weather be tomorrow?','明日の天気はどうですか。','怎么样 asks how something is.','明天 tomorrow|天气 weather|怎么样 how is it'],['明天可能下雨。','míngtiān kěnéng xiàyǔ','It may rain tomorrow.','明日は雨が降るかもしれません。','可能 before a verb expresses possibility.','可能 may|下雨 rain'],['带伞吧。','dài sǎn ba','Take an umbrella.','傘を持っていきましょう。','吧 softens advice/suggestion.','带 take|伞 umbrella|吧 suggestion'],['我们下午再去。','wǒmen xiàwǔ zài qù','Let’s go in the afternoon instead.','午後にまた行きましょう。','再 before 去 adds later/again.','我们 we|下午 afternoon|再 again/later|去 go']]],['3 · Feeling unwell',[['我不舒服。','wǒ bù shūfu','I don’t feel well.','具合がよくありません。','不舒服 is a common fixed phrase for feeling unwell.','不 not|舒服 comfortable'],['我头疼。','wǒ tóuténg','I have a headache.','頭が痛いです。','Body part + 疼 expresses pain.','头 head|疼 hurt'],['我有点儿发烧。','wǒ yǒudiǎnr fāshāo','I have a slight fever.','少し熱があります。','有点儿 softens the degree; 发烧 = have a fever.','有点儿 a little|发烧 have fever'],['我要去医院。','wǒ yào qù yīyuàn','I need to go to the hospital.','病院に行きたい／行く必要があります。','要 can express intention or necessity depending on context.','要 need/want|去 go|医院 hospital']]],['4 · At the pharmacy',[['附近有药店吗？','fùjìn yǒu yàodiàn ma','Is there a pharmacy nearby?','近くに薬局はありますか。','Location + 有 + noun + 吗 asks whether something exists there.','附近 nearby|有 there is|药店 pharmacy|吗 question'],['我想买感冒药。','wǒ xiǎng mǎi gǎnmàoyào','I’d like to buy cold medicine.','風邪薬を買いたいです。','想 + verb = would like to.','想 would like|买 buy|感冒药 cold medicine'],['一天吃几次？','yì tiān chī jǐ cì','How many times a day should I take it?','1日に何回飲みますか。','几次 asks frequency count.','一天 one day|吃 take/eat|几次 how many times'],['饭后吃。','fànhòu chī','Take it after meals.','食後に飲みます。','饭后 is a compact time expression: after meals.','饭后 after meals|吃 take']]],['5 · At home',[['我回家了。','wǒ huí jiā le','I’m home.','家に帰りました。','A familiar phrase returns in a home context.','回 return|家 home|了 change'],['请进。','qǐng jìn','Come in, please.','どうぞ入ってください。','请 + verb makes a polite invitation.','请 please|进 enter'],['厨房在那边。','chúfáng zài nàbiān','The kitchen is over there.','台所はあちらです。','A + 在 + place locates something.','厨房 kitchen|在 at|那边 over there'],['我的房间很小。','wǒ de fángjiān hěn xiǎo','My room is small.','私の部屋は小さいです。','的 links possessor and noun.','我的 my|房间 room|小 small']]],['6 · Things at home',[['桌子上有一本书。','zhuōzi shàng yǒu yì běn shū','There is a book on the table.','机の上に本が一冊あります。','Place + 有 introduces what exists there.','桌子 table|上 on|有 there is|一本书 one book'],['手机在哪儿？','shǒujī zài nǎr','Where is the phone?','携帯はどこですか。','Reuse 在哪儿 with an everyday object.','手机 phone|在哪儿 where'],['在沙发旁边。','zài shāfā pángbiān','It’s beside the sofa.','ソファのそばです。','旁边 means beside/next to.','沙发 sofa|旁边 beside'],['我找到了。','wǒ zhǎodào le','I found it.','見つけました。','找到 is a result complement: search → successfully find.','找 look for|到 result|了 completed']]],['7 · Around town',[['附近有超市吗？','fùjìn yǒu chāoshì ma','Is there a supermarket nearby?','近くにスーパーはありますか。','The same 有…吗 frame works across city life.','附近 nearby|超市 supermarket|吗 question'],['银行在对面。','yínháng zài duìmiàn','The bank is across the street.','銀行は向かい側です。','对面 = opposite/across from.','银行 bank|在 at|对面 opposite'],['走路要十分钟。','zǒulù yào shí fēnzhōng','It takes ten minutes on foot.','歩いて10分かかります。','要 can mean require/take (time).','走路 walk|要 take|十分钟 ten minutes'],['坐公交车更快。','zuò gōngjiāochē gèng kuài','Taking the bus is faster.','バスの方が速いです。','更 + adjective = even/more adjective.','坐 take/ride|公交车 bus|更 more|快 fast']]],['8 · Make a small plan',[['我们去哪儿？','wǒmen qù nǎr','Where shall we go?','どこへ行きますか。','哪儿 sits in the destination slot after 去.','我们 we|去 go|哪儿 where'],['先去超市。','xiān qù chāoshì','Let’s go to the supermarket first.','まずスーパーへ行きましょう。','先 before a verb = first.','先 first|去 go|超市 supermarket'],['然后去公园。','ránhòu qù gōngyuán','Then we’ll go to the park.','それから公園へ行きます。','然后 connects the next step.','然后 then|公园 park'],['晚上一起吃饭吧。','wǎnshang yìqǐ chīfàn ba','Let’s have dinner together tonight.','夜は一緒に食事しましょう。','Time + 一起 + verb + 吧 gives a natural invitation.','晚上 evening|一起 together|吃饭 eat|吧 suggestion']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button class="word" onclick="event.stopPropagation();sp(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function c(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'単語を開く':'Open the words')+'</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>'+(mode==='ja'?'文の構造を開く':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){course.innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(c).join('')}).join('')}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});lang.textContent=mode==='ja'?'English':'日本語';size.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script></body></html>
