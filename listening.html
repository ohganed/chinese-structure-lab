<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Listening Path</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:680px;margin:auto;padding:20px 16px 90px}.back{color:#777;text-decoration:none}.head{margin:30px 0}.head h1{font-size:31px;margin:7px 0}.head p{color:#777;line-height:1.55}.card{background:#fff;border-radius:28px;padding:24px 20px;margin:18px 0;text-align:center}.scene{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.09em}.listen{border:0;background:#171717;color:white;border-radius:999px;padding:15px 22px;font-size:16px;font-weight:750;margin:24px 0 10px}.door{display:block;width:100%;border:0;background:#efede7;border-radius:16px;padding:13px;margin-top:9px;font-weight:700}.reveal{display:none;margin-top:18px}.zh{font-size:34px;font-weight:750;line-height:1.35}.py{font-size:17px;color:#666;margin-top:5px}.en{font-size:19px;margin-top:14px}.ja{font-size:11px;color:#aaa}.hint{font-size:12px;color:#999;margin-top:10px}.wordStudy{text-align:left;margin-top:20px;padding-top:18px;border-top:1px solid #eee}.wordStudyLabel{font-size:11px;color:#888;letter-spacing:.08em;text-transform:uppercase;font-weight:750}.wordStudyHint{font-size:12px;color:#999;line-height:1.55;margin-top:5px}.wordStudyGrid{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}.wordStudyGrid .csl-word-touch{flex:0 1 auto}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div class="scene">A1 · SOUND FIRST</div><h1>Listen before you read.</h1><p>The written language waits. Hear a whole Chinese shape first; open the next door only when you want it.</p></div><div id="cards"></div><div class="version">prototype 0.8 · listening path</div></div><script>

 {scene:'Café',zh:'我要一杯茶。',py:'wǒ yào yì bēi chá',en:'I’d like a cup of tea.',ja:'お茶を一杯ください。',words:[{id:'listen-wǒ',zh:'我',py:'wǒ',ja:'私／私は'},{id:'listen-yào',zh:'要',py:'yào',ja:'ほしい／〜をください'},{id:'listen-yìbēi',zh:'一杯',py:'yì bēi',ja:'一杯'},{id:'listen-chá',zh:'茶',py:'chá',ja:'お茶'}]},
 {scene:'Station',zh:'地铁站在哪儿？',py:'dìtiě zhàn zài nǎr',en:'Where is the subway station?',ja:'地下鉄駅はどこですか。',words:[{id:'listen-dìtiězhàn',zh:'地铁站',py:'dìtiě zhàn',ja:'地下鉄駅'},{id:'listen-zài',zh:'在',py:'zài',ja:'〜にある／いる'},{id:'listen-nǎr',zh:'哪儿',py:'nǎr',ja:'どこ'}]},

 {scene:'People',zh:'我们一起学习中文。',py:'wǒmen yìqǐ xuéxí Zhōngwén',en:'We study Chinese together.',ja:'一緒に中国語を勉強します。',words:[{id:'listen-wǒmen',zh:'我们',py:'wǒmen',ja:'私たち'},{id:'listen-yìqǐ',zh:'一起',py:'yìqǐ',ja:'一緒に'},{id:'listen-xuéxí',zh:'学习',py:'xuéxí',ja:'勉強する／学ぶ'},{id:'listen-zhōngwén',zh:'中文',py:'Zhōngwén',ja:'中国語'}]},
 {scene:'Study',zh:'请再说一遍。',py:'qǐng zài shuō yí biàn',en:'Please say it again.',ja:'もう一度言ってください。',words:[{id:'listen-qǐng',zh:'请',py:'qǐng',ja:'どうぞ／〜してください'},{id:'listen-zài',zh:'再',py:'zài',ja:'もう一度／再び'},{id:'listen-shuō',zh:'说',py:'shuō',ja:'言う／話す'},{id:'listen-yíbiàn',zh:'一遍',py:'yí biàn',ja:'一回（初めから終わりまで）'}]},

function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}
function sp(t){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.86;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}
function show(id,part){document.getElementById(id+part).style.display='block';if(part==='text')setTimeout(function(){mountListeningWords(Number(id.slice(1)))},0)}
function mountListeningWords(i){var host=document.getElementById('c'+i+'words');if(!host||host.dataset.mounted==='1'||!window.CSLWordTouch)return;host.dataset.mounted='1';CSLWordTouch.mount(host,D[i].words,{course:'listening',sentenceId:'listening-'+i})}
document.getElementById('cards').innerHTML=D.map(function(x,i){return '<div class="card"><div class="scene">'+x.scene+'</div><button class="listen" onclick="sp(D['+i+'].zh)">▶ Listen</button><div class="hint">No need to answer anything.</div><button class="door" onclick="show(\'c'+i+'\',\'text\')">I want to see it</button><div class="reveal" id="c'+i+'text"><div class="zh">'+x.zh+'</div><div class="wordStudy"><div class="wordStudyLabel">WORDS IN THIS SENTENCE</div><div class="wordStudyHint">Touch a word: sound → meaning → pinyin & details → Chinese only.</div><div class="wordStudyGrid" id="c'+i+'words"></div></div><button class="door" onclick="show(\'c'+i+'\',\'py\')">Open sentence Pinyin</button><div class="reveal py" id="c'+i+'py">'+x.py+'<button class="door" onclick="show(\'c'+i+'\',\'meaning\')">Open sentence meaning</button><div class="reveal" id="c'+i+'meaning"><div class="en">'+x.en+'</div><div class="ja">'+x.ja+'</div></div></div></div></div>'}).join('');
speechSynthesis.getVoices();
window.addEventListener('load',function(){document.querySelectorAll('.wordStudyGrid').forEach(function(host){var n=Number((host.id.match(/c(\d+)words/)||[])[1]);if(!isNaN(n)&&host.closest('.reveal')&&getComputedStyle(host.closest('.reveal')).display!=='none')mountListeningWords(n)})});
