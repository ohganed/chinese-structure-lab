<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Listening Path</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:680px;margin:auto;padding:20px 16px 90px}.back{color:#777;text-decoration:none}.head{margin:30px 0}.head h1{font-size:31px;margin:7px 0}.head p{color:#777;line-height:1.55}.card{background:#fff;border-radius:28px;padding:24px 20px;margin:18px 0;text-align:center}.scene{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.09em}.listen{border:0;background:#171717;color:white;border-radius:999px;padding:15px 22px;font-size:16px;font-weight:750;margin:24px 0 10px}.door{display:block;width:100%;border:0;background:#efede7;border-radius:16px;padding:13px;margin-top:9px;font-weight:700}.reveal{display:none;margin-top:18px}.zh{font-size:34px;font-weight:750;line-height:1.35}.py{font-size:17px;color:#666;margin-top:5px}.en{font-size:19px;margin-top:14px}.ja{font-size:11px;color:#aaa}.hint{font-size:12px;color:#999;margin-top:10px}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div class="scene">A1 · SOUND FIRST</div><h1>Listen before you read.</h1><p>The written language waits. Hear a whole Chinese shape first; open the next door only when you want it.</p></div><div id="cards"></div><div class="version">prototype 0.7 · listening path</div></div><script>var D=[['Morning','我六点半起床。','wǒ liù diǎn bàn qǐchuáng','I get up at 6:30.','6時半に起きます。'],['Café','我要一杯茶。','wǒ yào yì bēi chá','I’d like a cup of tea.','お茶を一杯ください。'],['Station','地铁站在哪儿？','dìtiě zhàn zài nǎr','Where is the subway station?','地下鉄駅はどこですか。'],['Shopping','这个多少钱？','zhège duōshao qián','How much is this?','これはいくらですか。'],['People','我们一起学习中文。','wǒmen yìqǐ xuéxí Zhōngwén','We study Chinese together.','一緒に中国語を勉強します。'],['Study','请再说一遍。','qǐng zài shuō yí biàn','Please say it again.','もう一度言ってください。'],['Food','我不吃辣。','wǒ bù chī là','I don’t eat spicy food.','辛いものは食べません。'],['Travel','可以说慢一点儿吗？','kěyǐ shuō màn yìdiǎnr ma','Could you speak a little more slowly?','もう少しゆっくり話してもらえますか。']];function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.86;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function show(id,part){document.getElementById(id+part).style.display='block'}document.getElementById('cards').innerHTML=D.map(function(x,i){return '<div class="card"><div class="scene">'+x[0]+'</div><button class="listen" onclick="sp(D['+i+'][1])">▶ Listen</button><div class="hint">No need to answer anything.</div><button class="door" onclick="show(\'c'+i+'\',\'text\')">I want to see it</button><div class="reveal" id="c'+i+'text"><div class="zh">'+x[1]+'</div><button class="door" onclick="show(\'c'+i+'\',\'py\')">Open Pinyin</button><div class="reveal py" id="c'+i+'py">'+x[2]+'<button class="door" onclick="show(\'c'+i+'\',\'meaning\')">Open meaning</button><div class="reveal" id="c'+i+'meaning"><div class="en">'+x[3]+'</div><div class="ja">'+x[4]+'</div></div></div></div></div>'}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script></body></html>
