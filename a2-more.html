<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2 More · Chinese Structure Lab</title><style>body{margin:0;background:#f5f4ef;font-family:-apple-system,sans-serif;color:#171717}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.h{margin:28px 0}.h1{font-size:31px;font-weight:800}.sub{color:#666;line-height:1.5}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:28px;font-weight:750}.en{font-size:17px;margin-top:8px}.ja{font-size:12px;color:#888}.note{font-size:13px;color:#555;line-height:1.6;margin-top:10px}.b{border:0;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.nat{background:#171717;color:#fff}.slow{margin-left:6px;background:transparent;border:1px solid #bbb}.senior .zh{font-size:42px}.senior .en,.senior .note{font-size:21px}.senior .ja{font-size:19px}.senior .b{font-size:19px;padding:14px 18px}.jp .en{font-size:12px;color:#999}.jp .ja{font-size:18px;color:#222}.senior.jp .en{font-size:17px}.senior.jp .ja{font-size:22px}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="h"><div>A2 · CONTINUATION</div><div class="h1">Everyday Chinese grows</div><div class="sub">24 more lines: experience, plans, comparison, reasons and connected events.</div></div><div id="list"></div></div><script>var D=[['我以前来过这里。','I have been here before.','以前ここに来たことがあります。','过 marks experience.'],['这是我第二次来北京。','This is my second time in Beijing.','北京に来るのは2回目です。','第 + number forms ordinals.'],['我还没吃早饭。','I haven’t eaten breakfast yet.','まだ朝ご飯を食べていません。','还没 + verb = not yet.'],['吃完饭以后，我们去散步。','After eating, we’ll go for a walk.','食事が終わったら散歩に行きます。','完 marks completion; 以后 sets the next event.'],['如果明天下雨，我们就在家休息。','If it rains tomorrow, we’ll rest at home.','明日雨なら家で休みます。','如果…就… links condition and result.'],['这家店比那家便宜一点儿。','This shop is a little cheaper than that one.','この店はあの店より少し安いです。','比 introduces comparison.'],['今天没有昨天那么冷。','Today isn’t as cold as yesterday.','今日は昨日ほど寒くありません。','没有…那么… compares degree.'],['我越来越喜欢这个城市了。','I like this city more and more.','この街がだんだん好きになってきました。','越来越 = increasingly.'],['因为路上很堵，所以我迟到了。','Because traffic was heavy, I was late.','道が混んでいたので遅れました。','因为…所以… gives reason and result.'],['虽然很累，但是我还是去了。','Although I was tired, I still went.','疲れていましたが、それでも行きました。','虽然…但是… marks contrast.'],['你先坐，我去买票。','Sit first; I’ll go buy the tickets.','先に座っていて、切符を買ってきます。','先 organizes sequence.'],['等我一下，我马上回来。','Wait for me; I’ll be right back.','少し待って、すぐ戻ります。','马上 = very soon.'],['我已经给他发消息了。','I’ve already sent him a message.','もう彼にメッセージを送りました。','已经…了 signals completed change.'],['他还没有回复。','He still hasn’t replied.','彼はまだ返事をしていません。','还没有 = still not yet.'],['我打算周末去看朋友。','I plan to visit a friend this weekend.','週末に友達に会いに行く予定です。','打算 expresses a plan.'],['我们决定坐高铁去。','We decided to go by high-speed rail.','高速鉄道で行くことにしました。','决定 + verb = decide to.'],['你觉得哪一个更方便？','Which do you think is more convenient?','どちらの方が便利だと思いますか。','觉得 introduces an opinion.'],['我觉得坐地铁比较快。','I think the subway is relatively fast.','地下鉄の方が比較的速いと思います。','比较 softens comparison.'],['除了咖啡，我也喜欢喝茶。','Besides coffee, I also like tea.','コーヒー以外にお茶も好きです。','除了…也… adds another item.'],['我一边听音乐，一边做饭。','I cook while listening to music.','音楽を聴きながら料理します。','一边…一边… = simultaneous actions.'],['我刚到家，他就给我打电话了。','As soon as I got home, he called me.','家に着いた途端、彼から電話が来ました。','刚…就… links near-immediate events.'],['这件事让我很开心。','This made me very happy.','このことは私をとても嬉しくさせました。','让 + person + state = cause someone to feel/be.'],['我把票放在包里了。','I put the ticket in my bag.','切符をバッグに入れました。','把 foregrounds what is affected.'],['我的手机被我忘在酒店了。','I left my phone at the hotel.','携帯をホテルに置き忘れました。','被 introduces a passive-like affected event.']];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);list.innerHTML=D.map(function(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="en">'+x[1]+'</div><div class="ja">'+x[2]+'</div><button class="b nat" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="b slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><div class="note">'+x[3]+'</div></div>'}).join('')}render();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./interaction-ledger.js"></script><script src="./session-end-analyzer.js"></script></body></html>
