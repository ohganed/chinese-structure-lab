<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · B1 Expansion</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.head{margin:28px 0}.head h1{font-size:32px}.head p{color:#666;line-height:1.6}.scene{font-size:12px;color:#888;font-weight:700;letter-spacing:.06em;margin:28px 2px 8px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:10px}.ja{font-size:12px;color:#888}.jp .en{font-size:12px;color:#888}.jp .ja{font-size:18px;color:#222}.btn{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:6px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#555;line-height:1.65}.senior .head h1{font-size:42px}.senior .head p{font-size:20px}.senior .scene{font-size:18px}.senior .card{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:22px}.senior.jp .en{font-size:17px}.senior.jp .ja{font-size:23px}.senior .btn{font-size:19px;padding:14px 18px}.senior summary,.senior .note{font-size:19px}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div>B1 · BUILT-IN EXPANSION · 36 LINES</div><h1>B1 Tell Your World</h1><p data-en="Move from daily exchanges to connected stories, opinions, explanations and problem solving." data-ja="日常会話から一歩進み、まとまった物語・意見・説明・問題解決を中国語で行います。">Move from daily exchanges to connected stories, opinions, explanations and problem solving.</p></div><div id="course"></div></div><script>var D=[['1 · Personal stories',[['我第一次来中国的时候，几乎一句中文都不会说。','wǒ dì yī cì lái Zhōngguó de shíhou, jīhū yí jù Zhōngwén dōu bú huì shuō','When I first came to China, I could hardly speak a sentence of Chinese.','初めて中国に来た時、中国語はほとんど一文も話せませんでした。','第一次…的时候 frames a past story; 几乎…都不 strengthens near-zero ability.'],['后来我每天都跟同事练习，所以进步得很快。','hòulái wǒ měitiān dōu gēn tóngshì liànxí, suǒyǐ jìnbù de hěn kuài','Later I practiced with colleagues every day, so I improved quickly.','その後、毎日同僚と練習したので、上達が速かったです。','得 marks degree/manner after the verb.'],['有一次我一个人去买火车票，结果买错了日期。','yǒu yí cì wǒ yí ge rén qù mǎi huǒchēpiào, jiéguǒ mǎicuò le rìqī','Once I went to buy a train ticket alone and ended up choosing the wrong date.','ある時一人で切符を買いに行き、日付を間違えました。','结果 introduces the outcome; 错 is a result complement.'],['虽然很麻烦，但是那次经历让我记住了很多表达。','suīrán hěn máfan, dànshì nà cì jīnglì ràng wǒ jìzhù le hěn duō biǎodá','Although it was troublesome, that experience helped me remember many expressions.','大変でしたが、その経験で多くの表現を覚えました。','让 + person + verb = cause/let someone do.'],['从那以后，我遇到问题时不再那么紧张了。','cóng nà yǐhòu, wǒ yùdào wèntí shí bú zài nàme jǐnzhāng le','After that, I stopped getting so nervous when problems came up.','それ以来、問題が起きてもそれほど緊張しなくなりました。','不再 = no longer; 了 marks a changed state.'],['现在我反而觉得出错也是学习的一部分。','xiànzài wǒ fǎn’ér juéde chūcuò yě shì xuéxí de yí bùfen','Now I actually think making mistakes is part of learning.','今ではむしろ、間違えることも学習の一部だと思います。','反而 marks a result contrary to expectation.']]],['2 · Opinions',[['我觉得学语言最重要的不是记住多少单词。','wǒ juéde xué yǔyán zuì zhòngyào de bú shì jìzhù duōshao dāncí','I think the most important thing in language learning is not how many words you memorize.','語学で一番大切なのは、単語をいくつ覚えたかではないと思います。','最重要的 can nominalize “the most important thing”.'],['更重要的是，你能不能在需要的时候把话说出来。','gèng zhòngyào de shì, nǐ néng bu néng zài xūyào de shíhou bǎ huà shuō chūlái','More important is whether you can actually say what you need when the moment comes.','もっと大切なのは、必要な時に実際に言葉を出せるかどうかです。','把 + object + result/direction emphasizes handling the object.'],['有些人喜欢先学语法，有些人喜欢先听很多。','yǒuxiē rén xǐhuan xiān xué yǔfǎ, yǒuxiē rén xǐhuan xiān tīng hěn duō','Some people prefer grammar first; others prefer lots of listening first.','先に文法を学ぶ人もいれば、たくさん聞く人もいます。','有些…有些… contrasts groups.'],['我认为这两种方法都可以，只是顺序不同。','wǒ rènwéi zhè liǎng zhǒng fāngfǎ dōu kěyǐ, zhǐshì shùnxù bùtóng','I think both methods can work; the order is simply different.','どちらの方法もよく、順序が違うだけだと思います。','只是 = it is just that / only.'],['关键是要一直跟真实的语言保持接触。','guānjiàn shì yào yìzhí gēn zhēnshí de yǔyán bǎochí jiēchù','The key is to stay in contact with real language.','大切なのは、本物の言語に触れ続けることです。','关键是… introduces the core point.'],['如果学了却从来不用，很快就会忘记。','rúguǒ xué le què cónglái bú yòng, hěn kuài jiù huì wàngjì','If you study but never use it, you’ll forget quickly.','学んでも全く使わなければ、すぐ忘れてしまいます。','却 marks an unexpected contrast.']]],['3 · Work & education',[['我们最近在讨论怎么提高会议效率。','wǒmen zuìjìn zài tǎolùn zěnme tígāo huìyì xiàolǜ','We’ve recently been discussing how to improve meeting efficiency.','最近、会議の効率をどう上げるか話し合っています。','怎么 + verb can introduce an embedded “how” question.'],['以前很多事情都要开会决定，现在有些可以直接在线处理。','yǐqián hěn duō shìqing dōu yào kāihuì juédìng, xiànzài yǒuxiē kěyǐ zhíjiē zàixiàn chǔlǐ','Many things used to require meetings, but now some can be handled online.','以前は多くのことを会議で決めていましたが、今はオンラインで処理できます。','被动 meaning can be expressed without 被 when context is clear.'],['这样做不但省时间，而且让大家更容易准备。','zhèyàng zuò búdàn shěng shíjiān, érqiě ràng dàjiā gèng róngyì zhǔnbèi','This not only saves time, it also makes preparation easier for everyone.','こうすると時間を節約できるだけでなく、準備もしやすくなります。','不但…而且… adds a second stronger point.'],['不过，有些复杂的问题还是面对面谈比较好。','búguò, yǒuxiē fùzá de wèntí háishi miànduìmiàn tán bǐjiào hǎo','However, complicated issues are still better discussed face to face.','ただし、複雑な問題は対面で話す方がよいです。','还是…比较好 gives a considered recommendation.'],['因为文字有时候不能完全表达语气和态度。','yīnwèi wénzì yǒushíhou bù néng wánquán biǎodá yǔqì hé tàidu','Because text sometimes cannot fully convey tone and attitude.','文字だけでは口調や態度を完全に伝えられないことがあるからです。','完全 modifies the ability/result.'],['所以我们现在会根据问题的类型选择沟通方式。','suǒyǐ wǒmen xiànzài huì gēnjù wèntí de lèixíng xuǎnzé gōutōng fāngshì','So now we choose how to communicate depending on the type of issue.','今は問題の種類に応じて連絡方法を選びます。','根据 = according to / based on.']]],['4 · Problems & solutions',[['我的电脑昨天突然坏了，文件也打不开。','wǒ de diànnǎo zuótiān tūrán huài le, wénjiàn yě dǎbukāi','My computer suddenly broke yesterday, and the files wouldn’t open either.','昨日パソコンが突然壊れ、ファイルも開けなくなりました。','打不开 is a potential complement: unable to open.'],['我先重新启动了几次，但是一点儿用也没有。','wǒ xiān chóngxīn qǐdòng le jǐ cì, dànshì yìdiǎnr yòng yě méiyǒu','I restarted it several times, but it didn’t help at all.','何度か再起動しましたが、全く役に立ちませんでした。','一点儿…也没有 = not at all.'],['后来我把电脑拿到维修店去检查。','hòulái wǒ bǎ diànnǎo ná dào wéixiūdiàn qù jiǎnchá','Later I took the computer to a repair shop to have it checked.','その後、パソコンを修理店に持って行きました。','把 highlights disposal/movement of the object.'],['店员说问题不严重，当天就能修好。','diànyuán shuō wèntí bù yánzhòng, dāngtiān jiù néng xiūhǎo','The clerk said it wasn’t serious and could be fixed that day.','店員は問題は深刻ではなく、その日のうちに直せると言いました。','修好 = repair successfully; 好 is result.'],['幸好我重要的资料都有备份。','xìnghǎo wǒ zhòngyào de zīliào dōu yǒu bèifèn','Fortunately, all my important data had backups.','幸い重要なデータは全部バックアップしてありました。','幸好 introduces a fortunate circumstance.'],['这件事让我以后更注意保存文件。','zhè jiàn shì ràng wǒ yǐhòu gèng zhùyì bǎocún wénjiàn','This made me more careful about saving files afterward.','この出来事で、その後は保存にもっと気をつけるようになりました。','让 expresses caused change in behavior.']]],['5 · Culture & society',[['在日本，很多人坐电车的时候会尽量保持安静。','zài Rìběn, hěn duō rén zuò diànchē de shíhou huì jǐnliàng bǎochí ānjìng','In Japan, many people try to stay quiet on trains.','日本では電車の中で静かにしようとする人が多いです。','尽量 = as much as possible.'],['这种习惯对外国游客来说可能有点儿特别。','zhè zhǒng xíguàn duì wàiguó yóukè láishuō kěnéng yǒudiǎnr tèbié','This custom may feel unusual to foreign visitors.','この習慣は外国人旅行者には少し独特に感じられるかもしれません。','对…来说 marks perspective.'],['但是习惯没有绝对的好坏，往往跟社会环境有关。','dànshì xíguàn méiyǒu juéduì de hǎohuài, wǎngwǎng gēn shèhuì huánjìng yǒuguān','Customs are not absolutely good or bad; they are often related to social context.','習慣には絶対的な良し悪しはなく、社会環境と関係することが多いです。','跟…有关 = be related to.'],['了解这些差异以后，旅行时就更容易理解别人。','liǎojiě zhèxiē chāyì yǐhòu, lǚxíng shí jiù gèng róngyì lǐjiě biérén','Once you understand these differences, it becomes easier to understand others while traveling.','こうした違いを知ると、旅行中に相手を理解しやすくなります。','以后 + 就 marks resulting change.'],['同时也会发现，自己的习惯并不是唯一的标准。','tóngshí yě huì fāxiàn, zìjǐ de xíguàn bìng bú shì wéiyī de biāozhǔn','You also realize your own habits are not the only standard.','同時に、自分の習慣だけが唯一の基準ではないと気づきます。','并不 strengthens negation in a corrective statement.'],['我觉得这就是旅行最有意思的地方之一。','wǒ juéde zhè jiù shì lǚxíng zuì yǒuyìsi de dìfang zhī yī','I think that is one of the most interesting parts of travel.','それが旅行の最も面白い点の一つだと思います。','之一 = one of.']]],['6 · News & explanation',[['最近我们城市开始增加自行车专用道路。','zuìjìn wǒmen chéngshì kāishǐ zēngjiā zìxíngchē zhuānyòng dàolù','Recently our city started adding dedicated bike lanes.','最近、私たちの街では自転車専用道路を増やし始めました。','专用 = for dedicated/special use.'],['政府希望这样可以减少短距离开车的人。','zhèngfǔ xīwàng zhèyàng kěyǐ jiǎnshǎo duǎn jùlí kāichē de rén','The government hopes this will reduce short-distance car use.','政府は短距離で車を使う人を減らしたいと考えています。','希望 + clause expresses desired outcome.'],['支持的人认为这对环境和健康都有好处。','zhīchí de rén rènwéi zhè duì huánjìng hé jiànkāng dōu yǒu hǎochu','Supporters think this benefits both the environment and health.','支持する人は環境にも健康にもよいと考えています。','对…有好处 = be beneficial for.'],['反对的人则担心道路会变得更拥挤。','fǎnduì de rén zé dānxīn dàolù huì biàn de gèng yōngjǐ','Opponents, by contrast, worry roads will become more congested.','反対する人は道路がより混雑すると心配しています。','则 marks contrast in written/expository style.'],['目前这个计划还在试行，所以结果还不清楚。','mùqián zhège jìhuà hái zài shìxíng, suǒyǐ jiéguǒ hái bù qīngchu','The plan is still in a trial phase, so the results are not clear yet.','現在は試行段階なので、結果はまだ分かりません。','还在 + verb = still in progress.'],['我想真正的效果要过一段时间才能看出来。','wǒ xiǎng zhēnzhèng de xiàoguǒ yào guò yí duàn shíjiān cái néng kàn chūlái','I think we’ll need some time before the real effects become visible.','本当の効果が見えるまでには少し時間が必要だと思います。','才 marks a delayed/required condition before the result becomes possible.']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function voices(){var v=speechSynthesis.getVoices().filter(function(x){return /^zh/i.test(x.lang)});return v.filter(function(x){return x.localService}).concat(v.filter(function(x){return !x.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function card(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="btn" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="btn slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'文のポイント':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){course.innerHTML=D.map(function(g){return '<div class="scene">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});render();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script></body></html>
