<div class="app"><a class="back" href="./doorways.html">‹ Doorways</a><div class="hero"><div class="tiny">LIGHT DAY</div><h1>今日は、軽く触れるだけ。</h1><p>新しいことを増やさず、知っている中国語に静かに再会します。全部やらなくて大丈夫です。</p></div><div class="softnote">ここでは正解もノルマもありません。聞くだけでも、眺めるだけでも、そのまま次へ進めます。</div><main class="card" id="card"><div class="top"><div class="tiny">ONE QUIET ENCOUNTER</div><div class="progress" id="progress"></div></div><div class="emoji" id="emoji"></div><div class="sceneTitle" id="sceneTitle"></div><div class="sceneText" id="sceneText"></div><div class="zh" id="zh"></div><div class="py" id="py"></div><div class="meaning" id="meaning"></div><div class="actions"><button class="listen" onclick="speak(.9)">▶ 聞く</button><button class="slow" onclick="speak(.4)">ゆっくり</button><button class="more" onclick="toggleExtra()">少しだけ見る</button></div><div class="extra" id="extra"><div class="chips" id="chips"></div></div><button class="next" id="next" onclick="advance()">次の静かな場面 ›</button></main><div class="done" id="done"><b>今日はここまででも十分です。</b><p>少しだけ中国語に触れました。次に開いたときも、学習履歴はそのまま続きます。</p><a href="./doorways.html">入口へ戻る</a></div></div><div class="bottom"><div class="tabs"><a href="./index.html">Continue</a><a class="active" href="./doorways.html">Doorways</a><a href="./explore.html">Explore</a></div></div>
<script>
var ITEMS=[
{e:'👋 🙂',t:'顔を合わせる',d:'知っている人に会いました。短いあいさつだけ。',z:'你好。',p:'nǐ hǎo',m:'こんにちは。',c:['你 nǐ · あなた','好 hǎo · よい']},
{e:'☕ 🍵',t:'飲み物を頼む',d:'いつもの店で、ひとことだけ伝えます。',z:'我要一杯茶。',p:'wǒ yào yì bēi chá',m:'お茶を一杯ください。',c:['要 yào · ほしい','一杯 yì bēi · 一杯','茶 chá · お茶']},
{e:'🚇 ❓',t:'駅を探す',d:'道を急がず、場所だけ聞きます。',z:'地铁站在哪儿？',p:'dìtiě zhàn zài nǎr',m:'地下鉄の駅はどこですか。',c:['地铁站 dìtiě zhàn · 地下鉄駅','在哪儿 zài nǎr · どこに']},
{e:'👀 🏷️',t:'値段を見る',d:'買うかどうかは決めず、値段だけ聞きます。',z:'这个多少钱？',p:'zhège duōshao qián',m:'これはいくらですか。',c:['这个 zhège · これ','多少钱 duōshao qián · いくら']},
{e:'👕 👀',t:'まだ見ているだけ',d:'決めなくても大丈夫。ひとことだけ。',z:'我随便看看。',p:'wǒ suíbiàn kànkan',m:'ちょっと見ているだけです。',c:['随便 suíbiàn · 気ままに','看看 kànkan · ちょっと見る']},
{e:'😣 🏥',t:'少し具合が悪い',d:'説明を増やさず、状態だけ伝えます。',z:'我有点儿不舒服。',p:'wǒ yǒudiǎnr bù shūfu',m:'少し具合が悪いです。',c:['有点儿 yǒudiǎnr · 少し','不舒服 bù shūfu · 具合が悪い']},
{e:'📱 🙂',t:'あとで連絡する',d:'今すぐ話さなくても大丈夫。',z:'我晚点儿联系你。',p:'wǒ wǎndiǎnr liánxì nǐ',m:'あとで連絡します。',c:['晚点儿 wǎndiǎnr · あとで','联系 liánxì · 連絡する']},
{e:'🏠 🌙',t:'今日は家にいる',d:'予定を説明しすぎず、今のことだけ。',z:'我今天在家。',p:'wǒ jīntiān zài jiā',m:'今日は家にいます。',c:['今天 jīntiān · 今日','在家 zài jiā · 家にいる']},
{e:'🚌 ⏳',t:'少し待つ',d:'急がず、相手に少し待ってもらいます。',z:'请等一下。',p:'qǐng děng yíxià',m:'少し待ってください。',c:['请 qǐng · どうぞ／〜してください','等一下 děng yíxià · 少し待つ']},
{e:'🙂 🙏',t:'最後にお礼だけ',d:'今日はこれだけでも十分です。',z:'谢谢。',p:'xièxie',m:'ありがとうございます。',c:['谢谢 xièxie · ありがとう']},
{e:'🌧️ 🏠',t:'今日は出かけない',d:'予定を一つだけ言います。',z:'我今天不出去。',p:'wǒ jīntiān bù chūqù',m:'今日は出かけません。',c:['不 bù · 〜ない','出去 chūqù · 出かける']},
{e:'😴 🌙',t:'もう休みたい',d:'疲れている日は、この一文で終わってもいい。',z:'我想早点儿休息。',p:'wǒ xiǎng zǎodiǎnr xiūxi',m:'少し早めに休みたいです。',c:['想 xiǎng · 〜したい','早点儿 zǎodiǎnr · 少し早めに','休息 xiūxi · 休む']}
];
var KEY='csl_tired_course_v1',state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}var seen=Array.isArray(state.seen)?state.seen:[];var pool=ITEMS.map(function(_,i){return i}).filter(function(i){return seen.indexOf(i)<0});if(pool.length<4){seen=[];pool=ITEMS.map(function(_,i){return i})}for(var k=pool.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),tmp=pool[k];pool[k]=pool[j];pool[j]=tmp}var route=pool.slice(0,4),pos=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({seen:seen.slice(-24),lastAt:new Date().toISOString()}))}catch(e){}}
function render(){var x=ITEMS[route[pos]];document.getElementById('progress').textContent=(pos+1)+' / '+route.length;document.getElementById('emoji').textContent=x.e;document.getElementById('sceneTitle').textContent=x.t;document.getElementById('sceneText').textContent=x.d;document.getElementById('zh').textContent=x.z;document.getElementById('py').textContent=x.p;document.getElementById('meaning').textContent=x.m;document.getElementById('chips').innerHTML=x.c.map(function(v){return '<span class="chip">'+v+'</span>'}).join('');document.getElementById('extra').classList.remove('on');document.getElementById('next').textContent=pos===route.length-1?'今日はここまで':'次の静かな場面 ›';if(seen.indexOf(route[pos])<0)seen.push(route[pos]);save();try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('tired_course_view',{item:route[pos],sentence:x.z,position:pos})}catch(e){}}
function speak(rate){var x=ITEMS[route[pos]],u=new SpeechSynthesisUtterance(x.z);u.lang='zh-CN';u.rate=rate;var vs=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});u.voice=vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}
function toggleExtra(){document.getElementById('extra').classList.toggle('on')}
function advance(){if(pos<route.length-1){pos++;render();return}document.getElementById('card').style.display='none';document.getElementById('done').classList.add('on');try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('tired_course_complete',{items:route.length})}catch(e){}}
render();speechSynthesis.getVoices();
</script>
