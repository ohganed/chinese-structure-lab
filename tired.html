*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 96px}.back{color:#777;text-decoration:none}.hero{margin:30px 0 18px}.tiny{font-size:11px;color:#999;letter-spacing:.09em}.hero h1{font-size:30px;margin:7px 0}.hero p{color:#707070;line-height:1.65;margin:0}.softnote{margin:18px 0;background:#ebe8e2;border-radius:20px;padding:14px 16px;color:#68645f;font-size:13px;line-height:1.55}.card{background:#fff;border-radius:28px;padding:22px 18px;box-shadow:0 10px 32px #00000008}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{font-size:12px;color:#999}.emoji{font-size:42px;margin:20px 0 12px}.sceneTitle{font-size:20px;font-weight:780}.sceneText{font-size:14px;color:#6f6f6f;line-height:1.65;margin-top:8px}.zh{font-size:42px;line-height:1.3;font-weight:790;margin-top:22px}.py{font-size:18px;color:#777;margin-top:8px}.meaning{font-size:19px;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{border:0;border-radius:999px;padding:12px 15px;font-weight:760}.listen{background:#171717;color:white}.slow{background:#ebe8e2;color:#444}.more{background:transparent;border:1px solid #d8d4cd!important;color:#666}.extra{display:none;margin-top:16px;padding-top:15px;border-top:1px solid #eee}.extra.on{display:block}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#f1efe9;border-radius:999px;padding:9px 12px;font-size:14px}.next{width:100%;border:0;border-radius:18px;background:#dedbd2;padding:15px;font-weight:760;margin-top:18px}.done{display:none;background:#e9eee8;border-radius:24px;padding:20px;margin-top:16px}.done.on{display:block}.done b{font-size:20px}.done p{color:#687067;line-height:1.6}.done a{display:inline-block;margin-top:8px;text-decoration:none;background:#171717;color:#fff;border-radius:999px;padding:12px 1 <div class="app"><a class="back" href="./doorways.html">‹ Doorways</a><div class="hero"><div class="tiny">LIGHT DAY</div><h1>今日は、軽く触れるだけ。</h1><p>新しいことを増やさず、知っている中国語に静かに再会します。全部やらなくて大丈夫です。</p></div><div class="softnote">たくさんの場面を用意していますが、今日はその中から4つだけ。聞くだけでも、眺めるだけでも、そのまま次へ進めます。</div><main class="card" id="card"><div class="top"><div class="tiny">ONE QUIET ENCOUNTER</div><div class="progress" id="progress"></div></div><div class="emoji" id="emoji"></div><div class="sceneTitle" id="sceneTitle"></div><div class="sceneText" id="sceneText"></div><div class="zh" id="zh"></div><div class="py" id="py"></div><div class="meaning" id="meaning"></div><div class="actions"><button class="listen" onclick="speak(.9)">▶ 聞く</button><button class="slow" onclick="speak(.4)">ゆっくり</button><button class="more" onclick="toggleExtra()">少しだけ見る</button></div><div class="extra" id="extra"><div class="chips" id="chips"></div></div><button class="next" id="next" onclick="advance()">次の静かな場面 ›</button></main><div class="done" id="done"><b>今日はここまででも十分です。</b><p>少しだけ中国語に触れました。この文は別のコースでも、別の場面としてまた戻ってきます。</p><a href="./doorways.html">入口へ戻る</a></div></div><div class="bottom"><div class="tabs"><a href="./index.html">Continue</a><a class="active" href="./doorways.html">Doorways</a><a href="./explore.html">Explore</a></div></div>
<script src="./sentence-bank.js"></script>
<script>
var BANK=window.CSLSentenceBank;
var ITEMS=BANK?BANK.forCourse('tired'):[];
var KEY='csl_tired_course_v1',state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
var rawSeen=Array.isArray(state.seen)?state.seen:[],seen=[];
rawSeen.forEach(function(v){var id=(typeof v==='number'||/^\d+$/.test(String(v)))&&BANK?BANK.legacyTiredId(v):String(v);if(id&&seen.indexOf(id)<0)seen.push(id)});
var pool=ITEMS.filter(function(x){return seen.indexOf(x.id)<0});
if(pool.length<4){seen=[];pool=ITEMS.slice()}
for(var k=pool.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),tmp=pool[k];pool[k]=pool[j];pool[j]=tmp}
var route=pool.slice(0,Math.min(4,pool.length)),pos=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({schemaVersion:2,seen:seen.slice(-48),lastAt:new Date().toISOString()}))}catch(e){}}
function render(){if(!route.length)return;var x=route[pos];document.getElementById('progress').textContent=(pos+1)+' / '+route.length;document.getElementById('emoji').textContent=x.emoji;document.getElementById('sceneTitle').textContent=x.title;document.getElementById('sceneText').textContent=x.context;document.getElementById('zh').textContent=x.zh;document.getElementById('py').textContent=x.py;document.getElementById('meaning').textContent=x.ja;document.getElementById('chips').innerHTML=(x.words||[]).map(function(v){return '<span class="chip">'+v+'</span>'}).join('');document.getElementById('extra').classList.remove('on');document.getElementById('next').textContent=pos===route.length-1?'今日はここまで':'次の静かな場面 ›';if(seen.indexOf(x.id)<0)seen.push(x.id);save();try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('tired_course_view',{sentenceId:x.id,sentence:x.zh,position:pos,source:'shared-sentence-bank'})}catch(e){}}
function speak(rate){var x=route[pos],u=new SpeechSynthesisUtterance(x.zh);u.lang='zh-CN';u.rate=rate;var vs=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});u.voice=vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u);try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('audio_played',{sentenceId:x.id,sentence:x.zh,course:'tired',rate:rate})}catch(e){}}
function toggleExtra(){document.getElementById('extra').classList.toggle('on')}
function advance(){if(pos<route.length-1){pos++;render();return}document.getElementById('card').style.display='none';document.getElementById('done').classList.add('on');try{if(window.CSLStorage&&CSLStorage.addEvent)CSLStorage.addEvent('tired_course_complete',{items:route.length,sentenceIds:route.map(function(x){return x.id})})}catch(e){}}
render();speechSynthesis.getVoices();
</script>
