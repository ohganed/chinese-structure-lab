<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Work & Study</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 80px}.back{color:#777;text-decoration:none}.head{margin:28px 0}.head h1{font-size:30px;margin:6px 0}.head p{color:#777}.chapter{font-size:12px;color:#888;margin:27px 2px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#aaa}.speak{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #ddd;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#666;line-height:1.65;margin-top:9px}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#f1efe8;padding:8px 11px;border-radius:14px;display:flex;align-items:center;gap:7px;text-align:left}.wordzh{font-size:18px;font-weight:700}.wordgloss{font-size:11px;color:#777}.wordplay{font-size:10px;color:#777}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1>Work & Study</h1><p>Learn Chinese through things people actually do: start, ask, understand, plan, finish.</p><div style="color:#777">20 useful lines · 5 scenes</div></div><div id="course"></div><div class="version">prototype 0.9 · word audio</div></div><script>var G=[['1 · Start',[['我们开始吧。','wǒmen kāishǐ ba','Let’s start.','始めましょう。','吧 softens a suggestion.','我们 we|开始 start|吧 suggestion'],['今天学什么？','jīntiān xué shénme','What are we studying today?','今日は何を勉強しますか。','什么 occupies the object slot after 学.','今天 today|学 study|什么 what'],['我准备好了。','wǒ zhǔnbèi hǎo le','I’m ready.','準備できました。','好 after a verb can mark successful completion/result.','准备 prepare|好 ready/result|了 new state'],['请等一下。','qǐng děng yíxià','Please wait a moment.','ちょっと待ってください。','一下 makes the request lighter.','请 please|等 wait|一下 a moment']]],['2 · Understand',[['我明白了。','wǒ míngbai le','I understand now.','わかりました。','了 marks the change from not-understanding to understanding.','明白 understand|了 new state'],['我不明白。','wǒ bù míngbai','I don’t understand.','わかりません。','不 negates the state/action.','不 not|明白 understand'],['这是什么意思？','zhè shì shénme yìsi','What does this mean?','これはどういう意味ですか。','什么意思 is a highly reusable meaning question.','这 this|什么 what|意思 meaning'],['请再说一遍。','qǐng zài shuō yí biàn','Please say it again.','もう一度言ってください。','再 + action = do it again; 遍 counts a complete repetition.','再 again|说 say|一遍 once']]],['3 · Ask & answer',[['我有一个问题。','wǒ yǒu yí ge wèntí','I have a question.','質問があります。','有 + noun expresses possession.','有 have|一个 one|问题 question'],['怎么说？','zěnme shuō','How do you say it?','どう言いますか。','怎么 + verb asks how an action is done.','怎么 how|说 say'],['可以写一下吗？','kěyǐ xiě yíxià ma','Could you write it down?','ちょっと書いてもらえますか。','可以…吗 makes a polite request.','可以 can|写 write|一下 briefly|吗 question'],['对，我知道。','duì, wǒ zhīdào','Right, I know.','はい、わかります。','知道 means know a fact/information.','对 right|知道 know']]],['4 · Plan',[['下午我有课。','xiàwǔ wǒ yǒu kè','I have class this afternoon.','午後は授業があります。','Time phrase first frames the sentence.','下午 afternoon|有 have|课 class'],['明天我工作。','míngtiān wǒ gōngzuò','I work tomorrow.','明日は仕事です。','Chinese often needs no tense ending; time words establish time.','明天 tomorrow|工作 work'],['我们三点见。','wǒmen sān diǎn jiàn','Let’s meet at three.','3時に会いましょう。','Clock time appears before the verb.','我们 we|三点 3 o’clock|见 meet'],['你有时间吗？','nǐ yǒu shíjiān ma','Do you have time?','時間ありますか。','Reuse 有…吗 with 时间.','有 have|时间 time|吗 question']]],['5 · Finish',[['今天学了很多。','jīntiān xué le hěn duō','We learned a lot today.','今日はたくさん学びました。','了 after the verb marks the completed learning event.','今天 today|学 learn|了 completed|很多 a lot'],['我有点儿累。','wǒ yǒudiǎnr lèi','I’m a little tired.','少し疲れました。','A familiar phrase returns from Daily Life.','有点儿 a little|累 tired'],['明天继续。','míngtiān jìxù','We’ll continue tomorrow.','明日続けます。','A time word plus verb can form a complete contextual utterance.','明天 tomorrow|继续 continue'],['辛苦了。','xīnkǔ le','Thanks for your hard work.','お疲れさまでした。','A culturally useful end-of-work/study expression, best learned as a chunk.','辛苦 hard work|了 state']]]];function vs(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vs()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function wb(w){var p=w.split(' '),z=p.shift(),g=p.join(' ');return '<button type="button" class="word" onclick="event.stopPropagation();sp(\''+z+'\',.8)"><span class="wordzh">'+z+'</span><span class="wordgloss">'+g+'</span><span class="wordplay">▶</span></button>'}function c(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0]+'\',.68)">Slow</button><details><summary>Open the words</summary><div class="words">'+x[5].split('|').map(wb).join('')+'</div></details><details><summary>Open the structure</summary><div class="note">'+x[4]+'</div></details></div>'}document.getElementById('course').innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(c).join('')}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script></body></html>
