<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · A2 Expansion</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.head{margin:28px 0}.head h1{font-size:32px;margin:6px 0}.head p{color:#666;line-height:1.6}.scene{font-size:12px;color:#888;font-weight:700;letter-spacing:.06em;margin:28px 2px 8px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555;margin-top:4px}.en{font-size:18px;margin-top:10px}.ja{font-size:12px;color:#888}.jp .en{font-size:12px;color:#888}.jp .ja{font-size:18px;color:#222}.btn{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:6px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#555;line-height:1.65;margin-top:9px}.senior .head h1{font-size:42px}.senior .head p{font-size:20px}.senior .scene{font-size:18px}.senior .card{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:22px}.senior.jp .en{font-size:17px}.senior.jp .ja{font-size:23px}.senior .btn{font-size:19px;padding:14px 18px}.senior summary,.senior .note{font-size:19px}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div>A2 · BUILT-IN EXPANSION · 36 LINES</div><h1>A2 Everyday Expansion</h1><p data-en="The A1 world continues: past experiences, plans, comparisons, reasons, changes and longer everyday exchanges." data-ja="A1の世界をそのまま続けながら、経験・予定・比較・理由・変化・少し長い会話へ進みます。">The A1 world continues: past experiences, plans, comparisons, reasons, changes and longer everyday exchanges.</p></div><div id="course"></div></div><script>var D=[['1 · Past experience',[['我去过北京两次。','wǒ qùguo Běijīng liǎng cì','I have been to Beijing twice.','北京に2回行ったことがあります。','过 marks experience; 两次 counts occurrences.'],['你吃过北京烤鸭吗？','nǐ chīguo Běijīng kǎoyā ma','Have you ever eaten Peking duck?','北京ダックを食べたことがありますか。','过 + 吗 asks about past experience.'],['我以前没坐过高铁。','wǒ yǐqián méi zuòguo gāotiě','I had never taken a high-speed train before.','以前は高速鉄道に乗ったことがありませんでした。','没…过 negates experience.'],['上个月我去了上海。','shàng ge yuè wǒ qùle Shànghǎi','I went to Shanghai last month.','先月、上海へ行きました。','了 presents a completed event.'],['那次旅行很有意思。','nà cì lǚxíng hěn yǒuyìsi','That trip was very interesting.','その旅行はとても面白かったです。','次 can classify an event: 那次旅行.'],['我拍了很多照片。','wǒ pāile hěn duō zhàopiàn','I took a lot of photos.','写真をたくさん撮りました。','了 follows the verb for a completed action.']]],['2 · Plans & arrangements',[['我打算周末去看朋友。','wǒ dǎsuàn zhōumò qù kàn péngyou','I plan to visit a friend this weekend.','週末に友達に会いに行くつもりです。','打算 + verb phrase expresses a plan.'],['如果天气好，我们就去公园。','rúguǒ tiānqì hǎo, wǒmen jiù qù gōngyuán','If the weather is good, we’ll go to the park.','天気がよければ、公園へ行きます。','如果…就… links condition and result.'],['你什么时候方便？','nǐ shénme shíhou fāngbiàn','When is convenient for you?','いつ都合がいいですか。','方便 can describe a convenient time.'],['下午三点对我来说最好。','xiàwǔ sān diǎn duì wǒ láishuō zuì hǎo','Three in the afternoon is best for me.','私には午後3時が一番いいです。','对…来说 = for/from the perspective of.'],['那我们三点在车站见。','nà wǒmen sān diǎn zài chēzhàn jiàn','Then let’s meet at the station at three.','では3時に駅で会いましょう。','Time and place both precede the verb.'],['到时候给我发消息。','dào shíhou gěi wǒ fā xiāoxi','Message me then.','その時になったらメッセージしてください。','到时候 = when the time comes.']]],['3 · Compare & choose',[['这个比那个便宜一点儿。','zhège bǐ nàge piányi yìdiǎnr','This one is a little cheaper than that one.','これはあれより少し安いです。','A 比 B + adjective.'],['今天比昨天冷多了。','jīntiān bǐ zuótiān lěng duō le','Today is much colder than yesterday.','今日は昨日よりずっと寒いです。','多了 strengthens a comparison.'],['我觉得蓝色的更好看。','wǒ juéde lánsè de gèng hǎokàn','I think the blue one looks better.','青い方がもっときれいだと思います。','的 can replace the repeated noun; 更 = even/more.'],['这家店没有那家贵。','zhè jiā diàn méiyǒu nà jiā guì','This shop isn’t as expensive as that one.','この店はあの店ほど高くありません。','A 没有 B + adjective expresses “not as…as”.'],['两个都可以。','liǎng ge dōu kěyǐ','Either one is fine.','どちらでも大丈夫です。','都 distributes over the plural subject.'],['我还是选这个吧。','wǒ háishi xuǎn zhège ba','I think I’ll choose this one after all.','やはりこれにします。','还是 can mean “still/after all” in a decision.']]],['4 · Reasons & changes',[['因为今天很忙，所以我没去。','yīnwèi jīntiān hěn máng, suǒyǐ wǒ méi qù','Because I was busy today, I didn’t go.','今日は忙しかったので、行きませんでした。','因为…所以… makes the reason-result link explicit.'],['我最近开始学做中国菜。','wǒ zuìjìn kāishǐ xué zuò Zhōngguó cài','I recently started learning to cook Chinese food.','最近、中国料理を作る練習を始めました。','开始 + verb marks the beginning of an activity.'],['现在我会做两个菜了。','xiànzài wǒ huì zuò liǎng ge cài le','Now I can make two dishes.','今では料理を2品作れるようになりました。','Sentence-final 了 marks a new state.'],['以前我不太喜欢喝茶。','yǐqián wǒ bú tài xǐhuan hē chá','I didn’t really like tea before.','以前はあまりお茶が好きではありませんでした。','不太 = not very.'],['可是现在我每天都喝。','kěshì xiànzài wǒ měitiān dōu hē','But now I drink it every day.','でも今は毎日飲みます。','每天都 expresses regularity.'],['我的习惯慢慢变了。','wǒ de xíguàn mànmàn biàn le','My habits gradually changed.','習慣が少しずつ変わりました。','慢慢 = gradually; 变了 = has changed.']]],['5 · Longer exchanges',[['你能帮我看一下这个吗？','nǐ néng bāng wǒ kàn yíxià zhège ma','Could you help me take a look at this?','これをちょっと見てもらえますか。','帮 + person + verb; 一下 softens the request.'],['没问题，你先给我看看。','méi wèntí, nǐ xiān gěi wǒ kànkan','No problem. Show me first.','大丈夫です。まず見せてください。','先 marks the first step.'],['我不知道应该怎么填。','wǒ bù zhīdào yīnggāi zěnme tián','I don’t know how I should fill this in.','どう記入すればいいかわかりません。','应该 + 怎么 frames “how should…”.'],['这里写你的名字就可以了。','zhèlǐ xiě nǐ de míngzi jiù kěyǐ le','Just write your name here and that’s enough.','ここに名前を書けば大丈夫です。','就可以了 = that will do / that is sufficient.'],['原来这么简单。','yuánlái zhème jiǎndān','Oh, so it’s this simple.','なるほど、こんなに簡単なんですね。','原来 marks a new realization.'],['谢谢，我明白了。','xièxie, wǒ míngbai le','Thanks, I understand now.','ありがとう、わかりました。','了 marks the new state of understanding.']]],['6 · Everyday storytelling',[['昨天我本来想早点儿回家。','zuótiān wǒ běnlái xiǎng zǎodiǎnr huí jiā','Yesterday I originally planned to go home earlier.','昨日はもともと早く帰るつもりでした。','本来 = originally / as originally intended.'],['但是下班以后，同事请我吃饭。','dànshì xiàbān yǐhòu, tóngshì qǐng wǒ chīfàn','But after work, a colleague invited me to dinner.','でも仕事のあと、同僚が食事に誘ってくれました。','以后 marks “after”; 请 + person + verb can mean invite/treat.'],['我们去了一家新开的饭店。','wǒmen qùle yì jiā xīn kāi de fàndiàn','We went to a newly opened restaurant.','新しく開店したレストランへ行きました。','新开的 modifies 饭店.'],['虽然人很多，但是菜上得很快。','suīrán rén hěn duō, dànshì cài shàng de hěn kuài','Although it was crowded, the food came quickly.','人は多かったですが、料理はすぐ出てきました。','虽然…但是… expresses concession; 得 introduces manner.'],['吃完以后，我们又去喝了咖啡。','chīwán yǐhòu, wǒmen yòu qù hēle kāfēi','After eating, we went for coffee too.','食べ終わったあと、またコーヒーを飲みに行きました。','完 is a result complement; 又 = again in a completed sequence.'],['所以我回家的时候已经很晚了。','suǒyǐ wǒ huí jiā de shíhou yǐjīng hěn wǎn le','So it was already very late when I got home.','だから家に帰った時には、もうかなり遅くなっていました。','…的时候 marks the time frame; 已经…了 = already.']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function voices(){var v=speechSynthesis.getVoices().filter(function(x){return /^zh/i.test(x.lang)});return v.filter(function(x){return x.localService}).concat(v.filter(function(x){return !x.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function card(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="btn" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="btn slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'文のポイント':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){course.innerHTML=D.map(function(g){return '<div class="scene">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});render();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script><script src="./evidence-confidence-engine.js"></script><script src="./intervention-budget-engine.js"></script></body></html>
