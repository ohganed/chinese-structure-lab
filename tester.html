<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Chinese Structure Lab · Tester Mode</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:680px;margin:auto;padding:20px 16px 90px;min-height:100vh}.tiny{font-size:11px;color:#888;letter-spacing:.08em}.hero{margin:28px 0}.hero h1{font-size:32px;line-height:1.2;margin:8px 0}.hero p{color:#666;line-height:1.65}.card{background:#fff;border-radius:26px;padding:20px;margin:14px 0}.notice{background:#ecefea;color:#566057;border-radius:18px;padding:13px 15px;font-size:13px;line-height:1.55}.emoji{font-size:36px;display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0 14px}.arr{font-size:15px;color:#aaa}.scene{font-size:13px;color:#777;text-align:center}.zh{font-size:40px;font-weight:800;line-height:1.3;text-align:center;margin:18px 0 8px}.py{font-size:18px;color:#666;text-align:center}.meaning{font-size:19px;text-align:center;margin-top:10px}.btns{display:grid;gap:9px;margin-top:16px}.btn{border:0;border-radius:18px;padding:15px 16px;font-size:16px;font-weight:760;background:#171717;color:white}.btn.secondary{background:#ece9e1;color:#222}.btn.ghost{background:transparent;border:1px solid #d6d1c8;color:#555}.hidden{display:none}.feedback h2{font-size:22px;margin:5px 0 14px}.q{margin:18px 0}.q b{display:block;margin-bottom:9px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;background:#efede7;border-radius:999px;padding:10px 13px;font-weight:700;color:#444}.chip.on{background:#171717;color:#fff}textarea{width:100%;min-height:110px;border:1px solid #ddd8ce;border-radius:16px;padding:13px;font:inherit;background:#faf9f6}.status{display:none;margin-top:12px;padding:12px;border-radius:15px;background:#edf0e8;color:#566057;font-size:13px}.footer{text-align:center;color:#aaa;font-size:10px;margin-top:24px}</style></head><body><div class="app"><div class="hero"><div class="tiny">3-MINUTE USABILITY TEST</div><h1>説明を読まずに、触ってみてください。</h1><p>正解を当てるテストではありません。どこで迷うか、何が自然に分かるかを知るための試用ページです。</p><div class="notice">🧪 Tester Mode の記録は通常の学習履歴とは別に保存されます。あなたの本来の学習履歴には混ざりません。</div></div><div id="testCard" class="card"><div class="scene" id="sceneLabel"></div><div class="emoji" id="flow"></div><div class="zh hidden" id="zh"></div><div class="py hidden" id="py"></div><div class="meaning hidden" id="meaning"></div><div class="btns"><button class="btn" id="mainBtn" onclick="advance()">見てみる</button><button class="btn secondary" onclick="hear()">▶ 聞く</button><button class="btn ghost" id="stuckBtn" onclick="markStuck()">ここで少し迷った</button></div></div><div id="feedback" class="card feedback hidden"><div class="tiny">AFTER 3 MOMENTS</div><h2>30秒だけ教えてください</h2><div class="q"><b>最初の操作は分かりましたか？</b><div class="chips" data-k="start"><button class="chip" onclick="pick(this,'start','yes')">すぐ分かった</button><button class="chip" onclick="pick(this,'start','somewhat')">少し迷った</button><button class="chip" onclick="pick(this,'start','no')">分からなかった</button></div></div><div class="q"><b>絵文字から状況を想像できましたか？</b><div class="chips" data-k="emoji"><button class="chip" onclick="pick(this,'emoji','yes')">できた</button><button class="chip" onclick="pick(this,'emoji','somewhat')">だいたい</button><button class="chip" onclick="pick(this,'emoji','no')">難しかった</button></div></div><div class="q"><b>中国語をもう少し見てみたいと思いましたか？</b><div class="chips" data-k="want"><button class="chip" onclick="pick(this,'want','yes')">思った</button><button class="chip" onclick="pick(this,'want','neutral')">どちらでもない</button><button class="chip" onclick="pick(this,'want','no')">思わなかった</button></div></div><div class="q"><b>迷ったところ・気になったところ</b><textarea id="note" placeholder="例：次に何を押すのか少し迷った、絵文字だけで意味が分かった、文字が大きくて見やすかった…"></textarea></div><div class="btns"><button class="btn" onclick="copyReport()">📋 感想をコピー</button><button class="btn secondary" onclick="restart()">もう一度試す</button><a class="btn ghost" style="text-decoration:none;text-align:center" href="./index.html">通常版を開く</a></div><div id="status" class="status"></div></div><div class="footer">tester 1.0 · isolated usability session</div></div><script>var scenes=[{label:'1 / 3 · 人に会う',flow:['🚪','👀','🙂','👋'],z:'你好。',p:'nǐ hǎo',m:'こんにちは。'},{label:'2 / 3 · 飲み物を注文する',flow:['🪑','📋','🍵','🙋'],z:'我要一杯茶。',p:'wǒ yào yì bēi chá',m:'お茶を一杯ください。'},{label:'3 / 3 · 地下鉄を探す',flow:['🏙️','😕','🚇','❓'],z:'地铁站在哪儿？',p:'dìtiě zhàn zài nǎr',m:'地下鉄駅はどこですか。'}];var idx=0,stage=0,started=Date.now(),answers={},stuck=[];function testerKey(){return'csl_tester_sessions_v1'}function log(type,data){var a=JSON.parse(localStorage.getItem(testerKey())||'[]');a.push({id:'test:'+Date.now()+':'+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),type:type,scene:idx,stage:stage,data:data||{}});localStorage.setItem(testerKey(),JSON.stringify(a.slice(-500)))}function render(){var s=scenes[idx];sceneLabel.textContent=s.label;flow.innerHTML=s.flow.map(function(e,i){return(i?'<span class="arr">→</span>':'')+'<span>'+e+'</span>'}).join('');zh.textContent=s.z;py.textContent=s.p;meaning.textContent=s.m;zh.classList.add('hidden');py.classList.add('hidden');meaning.classList.add('hidden');stage=0;mainBtn.textContent='この場面から言葉を見る';stuckBtn.classList.remove('on');log('scene_open',{})}function advance(){var s=scenes[idx];if(stage===0){zh.classList.remove('hidden');stage=1;mainBtn.textContent='意味を見る';log('sentence_reveal',{})}else if(stage===1){py.classList.remove('hidden');meaning.classList.remove('hidden');stage=2;mainBtn.textContent=idx<scenes.length-1?'次の場面へ':'感想へ';log('meaning_reveal',{})}else{if(idx<scenes.length-1){idx++;render()}else finish()}}function hear(){var s=scenes[idx],u=new SpeechSynthesisUtterance(s.z);u.lang='zh-CN';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);log('listen',{})}function markStuck(){stuck.push({scene:idx,stage:stage});stuckBtn.textContent='✓ 記録しました';log('stuck',{})}function finish(){testCard.classList.add('hidden');feedback.classList.remove('hidden');log('finish',{seconds:Math.round((Date.now()-started)/1000)})}function pick(el,k,v){answers[k]=v;el.parentNode.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});el.classList.add('on')}function report(){return['Chinese Structure Lab · Tester Feedback','日時: '+new Date().toLocaleString(),'所要時間: '+Math.round((Date.now()-started)/1000)+'秒','最初の操作: '+(answers.start||'未回答'),'絵文字の理解: '+(answers.emoji||'未回答'),'もっと見たい: '+(answers.want||'未回答'),'迷った場面: '+(stuck.length?stuck.map(function(x){return (x.scene+1)+'-'+x.stage}).join(', '):'なし'),'自由記述: '+(note.value||'なし')].join('\n')}async function copyReport(){var text=report();try{await navigator.clipboard.writeText(text);status.textContent='感想をコピーしました。このままメッセージやChatGPTへ貼り付けられます。';status.style.display='block';log('feedback',{answers:answers,note:note.value,stuck:stuck})}catch(e){window.prompt('この内容をコピーしてください',text)}}function restart(){idx=0;stage=0;started=Date.now();answers={};stuck=[];feedback.classList.add('hidden');testCard.classList.remove('hidden');note.value='';document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});render()}render();</script><script src="./storage-core.js"></script><script src="./situation-layer.js"></script><script src="./feedback-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script></body></html>
