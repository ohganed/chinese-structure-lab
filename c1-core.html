<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C1 Core · Chinese Structure Lab</title><style>body{margin:0;background:#f5f4ef;font-family:-apple-system,sans-serif;color:#171717}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.h{margin:28px 0}.h1{font-size:31px;font-weight:800}.sub{color:#666;line-height:1.5}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:27px;font-weight:750;line-height:1.45}.en{font-size:17px;margin-top:8px}.ja{font-size:12px;color:#888}.note{font-size:13px;color:#555;line-height:1.6;margin-top:10px}.b{border:0;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.nat{background:#171717;color:#fff}.slow{margin-left:6px;background:transparent;border:1px solid #bbb}.senior .zh{font-size:40px}.senior .en,.senior .note{font-size:21px}.senior .ja{font-size:19px}.jp .en{font-size:12px;color:#999}.jp .ja{font-size:18px;color:#222}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="h"><div>C1 · BUILT-IN CORE</div><div class="h1">Think through Chinese</div><div class="sub">20 opening lessons for current affairs, abstraction, stance and formal explanation.</div></div><div id="list"></div></div><script>var D=[['一个社会如何定义“公平”，往往反映了它最重视什么。','How a society defines “fairness” often reflects what it values most.','社会が「公平」をどう定義するかは、その社会が何を最も重視しているかを映します。','如何…往往… is common in analytical prose.'],['技术进步并不会自动带来更好的社会结果。','Technological progress does not automatically produce better social outcomes.','技術進歩が自動的により良い社会的結果を生むわけではありません。','并不会 strengthens negation.'],['真正值得讨论的，不是工具本身，而是它改变了谁的选择。','What deserves discussion is not the tool itself, but whose choices it changes.','本当に議論すべきなのは道具そのものではなく、それが誰の選択を変えるかです。','真正值得…的 is evaluative framing.'],['从这个角度看，效率和公平并不总是一致。','From this perspective, efficiency and fairness do not always align.','この観点から見ると、効率と公平は常に一致するわけではありません。','并不总是 = not always.'],['表面上看，这是一个经济问题，实际上也涉及价值判断。','On the surface this is economic, but it also involves value judgments.','表面的には経済問題ですが、実際には価値判断にも関わります。','表面上…实际上… contrasts appearance and deeper layer.'],['如果只讨论平均数字，就可能看不到群体之间的差异。','If we discuss only averages, we may miss differences between groups.','平均値だけを論じると集団間の差が見えなくなる可能性があります。','群体之间的差异 is formal analytical vocabulary.'],['一个政策是否有效，不能只看它原来的目标。','Whether a policy is effective cannot be judged only by its original goal.','政策が有効かどうかは、当初の目的だけでは判断できません。','是否 embeds a yes/no proposition.'],['还要看它实际产生了哪些意料之外的后果。','We must also examine what unintended consequences it actually produced.','実際にどんな予期せぬ結果を生んだかも見る必要があります。','意料之外 = unexpected.'],['公众对风险的感受，未必和统计概率完全一致。','Public perception of risk does not necessarily match statistical probability.','人々のリスク感覚は統計的確率と完全に一致するとは限りません。','未必 adds calibrated uncertainty.'],['因此，沟通不能只提供数字，还要解释数字意味着什么。','Therefore communication must not only provide numbers, but explain what they mean.','したがって、数字を示すだけでなく、その意味も説明する必要があります。','不能只…还要… expands obligation.'],['有时候，最难解决的问题恰恰是大家都以为已经理解的问题。','Sometimes the hardest problems are precisely those everyone thinks they understand.','最も解決が難しいのは、皆が理解したと思っている問題だったりします。','恰恰 = precisely / ironically exactly.'],['语言会影响我们看待问题的方式，但不会完全决定我们的思想。','Language influences how we view problems, but does not completely determine thought.','言語は問題の見方に影響しますが、思考を完全に決定するわけではありません。','看待…的方式 = way of viewing.'],['与其追求一个看似完美的答案，不如先弄清楚问题本身。','Rather than seek a seemingly perfect answer, first clarify the problem itself.','完璧に見える答えを求めるより、まず問題そのものを明確にする方がよいです。','看似 = seemingly.'],['专家意见很重要，但专家之间也可能存在合理分歧。','Expert opinion matters, but reasonable disagreement can exist among experts.','専門家の意見は重要ですが、専門家同士でも合理的な意見の相違はありえます。','合理分歧 is useful in balanced argument.'],['承认不确定性并不等于放弃判断。','Acknowledging uncertainty is not the same as abandoning judgment.','不確実性を認めることは判断を放棄することではありません。','并不等于 = does not amount to.'],['相反，它往往是更负责任判断的起点。','On the contrary, it is often the starting point for more responsible judgment.','むしろ、それはより責任ある判断の出発点です。','相反 strongly reverses the prior expectation.'],['一个成熟的讨论，需要区分事实判断和价值判断。','A mature discussion needs to distinguish factual from value judgments.','成熟した議論には、事実判断と価値判断を区別する必要があります。','需要区分 = needs to distinguish.'],['即使事实相同，人们也可能因为价值排序不同而得出不同结论。','Even with the same facts, different value priorities may lead to different conclusions.','事実が同じでも、価値の優先順位が違えば結論は異なりえます。','因为…而… marks causal linkage in formal prose.'],['所谓“中立”，有时并不是没有立场，而是没有说明自己的立场。','So-called “neutrality” sometimes means not absence of a stance, but failure to state it.','いわゆる「中立」は、立場がないのではなく、自分の立場を示していないだけの場合があります。','所谓… introduces a term critically.'],['因此，清楚说明前提，往往比假装没有前提更重要。','Therefore stating assumptions clearly is often more important than pretending there are none.','だから前提を明示することは、前提がないふりをするより重要です。','往往比…更… makes a comparative generalization.']];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);list.innerHTML=D.map(function(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="en">'+x[1]+'</div><div class="ja">'+x[2]+'</div><button class="b nat" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="b slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><div class="note">'+x[3]+'</div></div>'}).join('')}render();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./interaction-ledger.js"></script><script src="./session-end-analyzer.js"></script><script src="./word-touch-engine.js"></script><script src="./legacy-word-touch-upgrader.js"></script></body></html>
