<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · A2 World</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 90px}.back{color:#777;text-decoration:none}.hero{margin:30px 0}.eyebrow{font-size:11px;color:#999;letter-spacing:.09em}.hero h1{font-size:32px;margin:7px 0}.hero p{color:#777;line-height:1.6}.world{background:#171717;color:white;border-radius:27px;padding:21px;margin:18px 0}.world small{color:#aaa}.world h2{margin:7px 0 12px}.cast{display:flex;gap:7px;flex-wrap:wrap}.cast span{background:#ffffff18;border-radius:999px;padding:7px 10px;font-size:12px}.scene{background:white;border-radius:24px;padding:19px;margin:14px 0}.zh{font-size:27px;font-weight:700;line-height:1.45}.py,.meaning{display:none}.py{color:#666;margin-top:6px}.en{font-size:17px;margin-top:10px}.ja{font-size:10px;color:#aaa}.btn{border:0;border-radius:999px;padding:10px 13px;margin:11px 5px 0 0;font-weight:700;background:#171717;color:white}.ghost{background:#efede7;color:#333}.return{font-size:11px;color:#8a8479;margin-top:12px}.version{text-align:center;color:#aaa;font-size:10px;margin-top:25px}</style></head><body><div class="app"><a class="back" href="./explore.html">‹ Explore</a><div class="hero"><div class="eyebrow">A2 · THE WORLD CONTINUES</div><h1>Nothing resets.</h1><p>The café, station and people from A1 are still here. You simply have more to say now.</p></div><div class="world"><small>YOUR FIRST CONTINUING WORLD</small><h2>Saturday with Wang Ming</h2><div class="cast"><span>你 · You</span><span>王明 · Wang Ming</span><span>老地方 · the familiar café</span></div></div><div id="scenes"></div><div class="version">prototype 0.8 · persistent world</div></div><script>var S=[['王明给我发消息，说他今天下午有时间。','Wáng Míng gěi wǒ fā xiāoxi, shuō tā jīntiān xiàwǔ yǒu shíjiān.','Wang Ming sends me a message saying he has time this afternoon.','王明から、今日の午後は時間があるとメッセージが来ます。','RETURNING: 今天 · 下午 · 有时间'],['我们决定去上次去过的那家咖啡店。','wǒmen juédìng qù shàng cì qùguo de nà jiā kāfēidiàn.','We decide to go to the café we went to last time.','前回行ったあのカフェに行くことにします。','NEW LAYER: 决定 decide · 上次 last time · 过 experience'],['服务员问我们想喝什么。','fúwùyuán wèn wǒmen xiǎng hē shénme.','The server asks what we would like to drink.','店員が何を飲みたいか尋ねます。','RETURNING: 想喝 · 什么'],['我还是要咖啡，不过王明今天想喝茶。','wǒ háishi yào kāfēi, búguò Wáng Míng jīntiān xiǎng hē chá.','I still choose coffee, but Wang Ming wants tea today.','私はやはりコーヒーですが、王明は今日はお茶が飲みたいそうです。','NEW LAYER: 还是 still/as before · 不过 but'],['喝咖啡的时候，我们聊了最近的工作。','hē kāfēi de shíhou, wǒmen liáo le zuìjìn de gōngzuò.','While drinking coffee, we talk about our recent work.','コーヒーを飲みながら最近の仕事について話します。','NEW LAYER: …的时候 while/when · 最近 recently'],['王明说他最近很忙，所以周末想休息一下。','Wáng Míng shuō tā zuìjìn hěn máng, suǒyǐ zhōumò xiǎng xiūxi yíxià.','Wang Ming says he has been busy lately, so he wants to rest this weekend.','王明は最近忙しいので週末は少し休みたいと言います。','GROWTH: 所以 connects reason → result'],['我问他：“下个周末一起去北京怎么样？”','wǒ wèn tā: “xià ge zhōumò yìqǐ qù Běijīng zěnmeyàng?”','I ask him, “How about going to Beijing together next weekend?”','「来週末、一緒に北京へ行くのはどう？」と尋ねます。','RETURNING: 一起 · 去北京; NEW: 怎么样? how about…'],['他笑着说：“好啊，但是这次你买票。”','tā xiàozhe shuō: “hǎo a, dànshì zhè cì nǐ mǎi piào.”','He smiles and says, “Sure—but this time you buy the tickets.”','彼は笑って「いいよ。でも今回は君が切符を買ってね」と言います。','A1 RETURNS: 买票 · 这次 this time']];function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.86;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function tog(id,c){var e=document.getElementById(id+c);e.style.display=e.style.display==='block'?'none':'block'}document.getElementById('scenes').innerHTML=S.map(function(x,i){return '<div class="scene"><div class="zh">'+x[0]+'</div><button class="btn" onclick="sp(S['+i+'][0])">▶ Listen</button><button class="btn ghost" onclick="tog(\'s'+i+'\',\'p\')">Pinyin</button><button class="btn ghost" onclick="tog(\'s'+i+'\',\'m\')">Meaning</button><div class="py" id="s'+i+'p">'+x[1]+'</div><div class="meaning" id="s'+i+'m"><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div></div><div class="return">'+x[4]+'</div></div>'}).join('');speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script></body></html>
