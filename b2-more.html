<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2 More · Chinese Structure Lab</title><style>body{margin:0;background:#f5f4ef;font-family:-apple-system,sans-serif;color:#171717}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.h{margin:28px 0}.h1{font-size:31px;font-weight:800}.sub{color:#666;line-height:1.5}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:28px;font-weight:750}.en{font-size:17px;margin-top:8px}.ja{font-size:12px;color:#888}.note{font-size:13px;color:#555;line-height:1.6;margin-top:10px}.b{border:0;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.nat{background:#171717;color:#fff}.slow{margin-left:6px;background:transparent;border:1px solid #bbb}.senior .zh{font-size:42px}.senior .en,.senior .note{font-size:21px}.senior .ja{font-size:19px}.jp .en{font-size:12px;color:#999}.jp .ja{font-size:18px;color:#222}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="h"><div>B2 · CONTINUATION</div><div class="h1">Explain, compare, negotiate</div><div class="sub">24 more lines for structured argument, policy, technology and workplace decisions.</div></div><div id="list"></div></div><script>var D=[['这个方案的优点很明显，但它的风险也不能忽视。','The advantages are clear, but its risks cannot be ignored.','この案の利点は明らかですが、リスクも無視できません。','不能忽视 adds formal caution.'],['与其马上做决定，不如先收集更多数据。','Rather than decide immediately, we should gather more data first.','すぐ決めるより、まずデータを集めた方がよいです。','与其…不如… compares alternatives.'],['问题的关键不在技术，而在怎么使用技术。','The key issue is not the technology, but how it is used.','問題の核心は技術ではなく、その使い方です。','不在…而在… focuses the real issue.'],['从长期来看，这种做法未必能降低成本。','In the long run, this approach may not necessarily reduce costs.','長期的には、この方法でコストが下がるとは限りません。','未必 = not necessarily.'],['即使效率提高了，也不代表质量一定会提高。','Even if efficiency rises, that does not mean quality necessarily will.','効率が上がっても品質も必ず上がるとは限りません。','不代表…一定… rejects an inference.'],['我们需要区分短期效果和长期影响。','We need to distinguish short-term effects from long-term impacts.','短期的効果と長期的影響を区別する必要があります。','区分 is useful in analytical explanation.'],['只要目标明确，方法可以根据情况调整。','As long as the goal is clear, the method can be adjusted.','目標が明確なら方法は状況に応じて調整できます。','只要…就/可以… sets a sufficient condition.'],['除非有新的证据，否则我不会改变判断。','Unless there is new evidence, I won’t change my judgment.','新しい証拠がない限り判断は変えません。','除非…否则… = unless…otherwise.'],['这个政策看起来公平，实际执行起来却很复杂。','The policy looks fair, but implementation is complicated.','この政策は公平に見えますが、実施は複雑です。','却 marks an unexpected contrast.'],['一方面要保护隐私，另一方面也要考虑便利性。','We must protect privacy while also considering convenience.','一方でプライバシーを守り、他方で利便性も考える必要があります。','一方面…另一方面… balances two sides.'],['无论支持还是反对，都应该先说明理由。','Whether supporting or opposing, one should first explain the reasons.','賛成でも反対でも、まず理由を示すべきです。','无论…都… covers alternatives.'],['这项改革能不能成功，很大程度上取决于执行。','Whether the reform succeeds depends largely on implementation.','この改革の成功は実行に大きく左右されます。','取决于 = depend on.'],['我理解你的担心，不过我们也要考虑另一种可能。','I understand your concern, but we should consider another possibility.','心配は理解しますが、別の可能性も考えるべきです。','不过 softens disagreement.'],['如果把所有问题都归因于个人，就会忽略制度因素。','If every problem is attributed to individuals, systemic factors get overlooked.','全てを個人のせいにすると制度的要因を見落とします。','归因于 = attribute to.'],['这不是简单的成本问题，而是优先顺序的问题。','This is not simply about cost, but about priorities.','単なる費用の問題ではなく、優先順位の問題です。','而是 reframes the issue.'],['数据本身不会说话，关键是我们怎么解释它。','Data does not speak for itself; interpretation is key.','データ自体が語るのではなく、どう解釈するかが重要です。','本身 emphasizes the thing itself.'],['AI可以提高效率，但最终责任不能交给机器。','AI can improve efficiency, but final responsibility cannot be handed to machines.','AIは効率を上げられますが、最終責任を機械に渡すことはできません。','最终责任 is useful formal vocabulary.'],['如果系统只追求准确率，可能会牺牲其他价值。','If a system pursues only accuracy, it may sacrifice other values.','正確性だけを追うと他の価値を犠牲にする可能性があります。','牺牲 = sacrifice.'],['这个结论建立在几个重要假设之上。','This conclusion rests on several important assumptions.','この結論はいくつかの重要な仮定に基づいています。','建立在…之上 = be based on.'],['一旦条件发生变化，原来的结论就可能不成立。','Once conditions change, the original conclusion may no longer hold.','条件が変われば元の結論が成り立たなくなる可能性があります。','一旦…就… marks a triggered consequence.'],['我们不能因为意见不同，就否定对方的动机。','We shouldn’t deny the other side’s motives just because we disagree.','意見が違うからといって相手の動機まで否定すべきではありません。','不能因为…就… rejects overreach.'],['更合理的做法是先确认双方同意的部分。','A more reasonable approach is to confirm areas of agreement first.','より合理的なのは、まず双方の一致点を確認することです。','更合理的做法是… frames a recommendation.'],['谈判的目的不是赢，而是找到双方都能接受的方案。','The aim of negotiation is not to win, but to find an acceptable solution.','交渉の目的は勝つことではなく、双方が受け入れられる案を探すことです。','不是…而是… is powerful for reframing.'],['在没有更多信息的情况下，最好暂时保留判断。','Without more information, it is best to suspend judgment for now.','情報が足りない段階では判断を保留するのがよいです。','在…情况下 = under circumstances of…']];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);list.innerHTML=D.map(function(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="en">'+x[1]+'</div><div class="ja">'+x[2]+'</div><button class="b nat" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="b slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><div class="note">'+x[3]+'</div></div>'}).join('')}render();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./interaction-ledger.js"></script><script src="./session-end-analyzer.js"></script><script src="./word-touch-engine.js"></script><script src="./legacy-word-touch-upgrader.js"></script><script src="./light-event-buffer.js"></script><script src="./stale-session-recovery.js"></script></body></html>
