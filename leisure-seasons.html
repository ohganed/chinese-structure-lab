<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · Leisure & Seasons</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:20px 16px 85px}.top{display:flex;justify-content:space-between;gap:8px}.back{color:#666;text-decoration:none}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700}.head{margin:28px 0}.head h1{font-size:30px;margin:5px 0}.head p{color:#666}.chapter{font-size:12px;color:#888;margin:28px 2px 9px;font-weight:700}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#888}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.s{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.word{border:0;background:#f1efe8;border-radius:14px;padding:8px 11px}.senior .head h1{font-size:40px}.senior .head p{font-size:20px}.senior .lesson{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:23px}.senior .s{font-size:19px;padding:14px 18px}.senior summary{font-size:20px}.senior .word{font-size:18px;padding:12px 14px}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="head"><div style="font-size:11px;color:#999">A1 · BUILT-IN COURSE</div><h1 data-en="Leisure & Seasons" data-ja="趣味と季節">Leisure & Seasons</h1><p data-en="Weekends, seasons, outings, hobbies and simple feelings." data-ja="週末・季節・外出・趣味・簡単な感想まで。">Weekends, seasons, outings, hobbies and simple feelings.</p><div>24 lines · 6 scenes</div></div><div id="course"></div></div><script>var G=[['1 · Weekend',[['周末你做什么？','zhōumò nǐ zuò shénme','What do you do on weekends?','週末は何をしますか。','Time first.','周末 weekend|做 do|什么 what'],['我喜欢散步。','wǒ xǐhuan sànbù','I like taking walks.','散歩が好きです。','喜欢 + action/noun.','喜欢 like|散步 walk'],['有时候我看电影。','yǒushíhou wǒ kàn diànyǐng','Sometimes I watch movies.','時々映画を見ます。','有时候 = sometimes.','有时候 sometimes|看 watch|电影 movie'],['我也喜欢听音乐。','wǒ yě xǐhuan tīng yīnyuè','I also like listening to music.','音楽を聴くのも好きです。','也 before verb phrase = also.','也 also|喜欢 like|听 listen|音乐 music']]],['2 · Seasons',[['你喜欢哪个季节？','nǐ xǐhuan nǎge jìjié','Which season do you like?','どの季節が好きですか。','哪个 = which.','哪个 which|季节 season'],['我喜欢春天。','wǒ xǐhuan chūntiān','I like spring.','春が好きです。','Season noun as object.','春天 spring'],['夏天太热了。','xiàtiān tài rè le','Summer is too hot.','夏は暑すぎます。','太…了.','夏天 summer|太 too|热 hot|了 state'],['秋天很舒服。','qiūtiān hěn shūfu','Autumn is comfortable.','秋は気持ちいいです。','很 + adjective.','秋天 autumn|舒服 comfortable']]],['3 · Outdoors',[['今天天气很好。','jīntiān tiānqì hěn hǎo','The weather is nice today.','今日は天気がいいです。','Time + topic + adjective.','今天 today|天气 weather|很好 very good'],['我们去公园吧。','wǒmen qù gōngyuán ba','Let’s go to the park.','公園に行きましょう。','吧 suggestion.','我们 we|去 go|公园 park|吧 suggestion'],['走路去吗？','zǒulù qù ma','Shall we walk there?','歩いて行きますか。','走路 = walk/on foot.','走路 walk|去 go|吗 question'],['不远，走十分钟。','bù yuǎn, zǒu shí fēnzhōng','It’s not far, about a ten-minute walk.','遠くありません。歩いて10分です。','Duration after verb.','不远 not far|走 walk|十分钟 10 minutes']]],['4 · Photo',[['这里很漂亮。','zhèlǐ hěn piàoliang','It’s beautiful here.','ここはきれいです。','Location as topic.','这里 here|漂亮 beautiful'],['我想拍照。','wǒ xiǎng pāizhào','I want to take a photo.','写真を撮りたいです。','想 + verb.','想 want|拍照 take photo'],['可以帮我拍一张吗？','kěyǐ bāng wǒ pāi yì zhāng ma','Could you take a photo for me?','写真を一枚撮ってもらえますか。','帮我 + verb.','可以 can|帮我 help me|拍 take|一张 one photo'],['拍得很好。','pāi de hěn hǎo','It came out very well.','とても上手に撮れています。','得 links verb with degree/result description.','拍 take|得 complement|很好 very well']]],['5 · Simple feelings',[['今天很开心。','jīntiān hěn kāixīn','I’m very happy today.','今日はとても楽しいです。','Adjective predicate.','今天 today|开心 happy'],['我有点儿累。','wǒ yǒudiǎnr lèi','I’m a little tired.','少し疲れました。','有点儿 often with unwanted state.','有点儿 a little|累 tired'],['但是很值得。','dànshì hěn zhíde','But it was worth it.','でも、その価値がありました。','但是 = but.','但是 but|值得 worthwhile'],['下次还来。','xià cì hái lái','I’ll come again next time.','次もまた来ます。','还 can mean again/still.','下次 next time|还 again|来 come']]],['6 · Evening',[['天快黑了。','tiān kuài hēi le','It’s getting dark soon.','もうすぐ暗くなります。','快…了 = about to.','天 sky/day|快 soon|黑 dark|了 change'],['我们回家吧。','wǒmen huí jiā ba','Let’s go home.','家に帰りましょう。','回家 + 吧.','我们 we|回家 go home|吧 suggestion'],['今天玩得很开心。','jīntiān wán de hěn kāixīn','We had a great time today.','今日はとても楽しかったです。','得 complement after 玩.','玩 play|得 complement|开心 happy'],['明天再聊。','míngtiān zài liáo','Let’s talk again tomorrow.','また明日話しましょう。','再 before verb = again later.','明天 tomorrow|再 again|聊 chat']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function vv(){var a=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)});return a.filter(function(v){return v.localService}).concat(a.filter(function(v){return !v.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vv()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function word(w){var p=w.split(' '),z=p.shift();return '<button class="word" onclick="sp(\''+z+'\',.8)">'+z+' ▶<br><small>'+p.join(' ')+'</small></button>'}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="s" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="s slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'単語を開く':'Open the words')+'</summary><div class="words">'+x[5].split('|').map(word).join('')+'</div></details></div>'}function render(){course.innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}function apply(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});lang.textContent=mode==='ja'?'English':'日本語';size.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./interaction-ledger.js"></script><script src="./session-end-analyzer.js"></script></body></html>
