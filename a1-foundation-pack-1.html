<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · A1 Foundation Pack 1</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;gap:8px}.back{color:#666;text-decoration:none}.tools{display:flex;gap:7px}.tool{border:0;background:#fff;border-radius:999px;padding:9px 11px;font-weight:700}.hero{margin:28px 0}.hero h1{font-size:31px;margin:6px 0}.hero p{color:#666;line-height:1.6}.chapter{font-size:12px;color:#888;margin:30px 2px 9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.lesson{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555;margin-top:4px}.en{font-size:18px;margin-top:9px}.ja{font-size:11px;color:#888;margin-top:3px}.jp .en{font-size:11px;color:#999}.jp .ja{font-size:18px;color:#222}.speak{border:0;background:#171717;color:white;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:5px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#555;line-height:1.65;margin-top:9px}.senior .back,.senior .tool{font-size:18px;padding:12px 15px}.senior .hero h1{font-size:42px}.senior .hero p{font-size:20px}.senior .chapter{font-size:18px}.senior .lesson{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:23px}.senior.jp .en{font-size:17px}.senior .speak{font-size:19px;min-height:56px}.senior summary{font-size:20px}.senior .note{font-size:19px}</style></head><body><div class="app" id="app"><div class="top"><a class="back" href="./explore.html">‹ Explore</a><div class="tools"><button class="tool" id="lang" onclick="flipLang()">日本語</button><button class="tool" id="size" onclick="flipSize()">A＋</button></div></div><div class="hero"><div style="font-size:11px;color:#888">A1 · FOUNDATION PACK 1 · 50 LINES</div><h1 data-en="Build the Mandarin Core" data-ja="中国語の骨格を作る">Build the Mandarin Core</h1><p data-en="The smallest high-frequency structures return again and again: identity, existence, location, everyday actions, questions, negation, time, counting and communication repair." data-ja="是・有・在・基本動詞・疑問・否定・時間・数え方・聞き返しなど、最頻出の小さな構造を何度も再会しながら身につけます。">The smallest high-frequency structures return again and again: identity, existence, location, everyday actions, questions, negation, time, counting and communication repair.</p></div><div id="course"></div></div><script>var G=[['1 · People & identity',[['我是日本人。','wǒ shì Rìběn rén','I am Japanese.','私は日本人です。','是 links identity or classification: A 是 B.'],['我叫小林。','wǒ jiào Xiǎolín','My name is Kobayashi.','私は小林といいます。','叫 + name is a very common way to introduce your name.'],['她是我朋友。','tā shì wǒ péngyou','She is my friend.','彼女は私の友達です。','Possessor + noun can omit 的 with close relationships: 我朋友.'],['他不是老师。','tā bú shì lǎoshī','He is not a teacher.','彼は先生ではありません。','不 negates 是; before a fourth tone, 不 is pronounced bú.'],['你也是学生吗？','nǐ yě shì xuésheng ma','Are you also a student?','あなたも学生ですか。','也 means also; 吗 turns a statement into a yes/no question.']]],['2 · Having & there is',[['我有一个哥哥。','wǒ yǒu yí ge gēge','I have an older brother.','私には兄が一人います。','有 expresses possession; 个 is a common measure word.'],['我没有车。','wǒ méiyǒu chē','I do not have a car.','私は車を持っていません。','没有 is the normal negative form of 有.'],['这里有洗手间吗？','zhèlǐ yǒu xǐshǒujiān ma','Is there a restroom here?','ここにトイレはありますか。','Place + 有 + thing means “there is/are … at this place.”'],['桌子上有一本书。','zhuōzi shàng yǒu yì běn shū','There is a book on the table.','机の上に本が一冊あります。','Location comes first; 本 is the measure word for books.'],['我家有三个人。','wǒ jiā yǒu sān ge rén','There are three people in my family.','私の家族は3人です。','我家 means my home/family; 有 introduces what exists there.']]],['3 · Location with 在',[['我在家。','wǒ zài jiā','I am at home.','私は家にいます。','在 + place locates a person or thing.'],['他在学校。','tā zài xuéxiào','He is at school.','彼は学校にいます。','Subject + 在 + place is a basic location frame.'],['妈妈在厨房。','māma zài chúfáng','Mom is in the kitchen.','母は台所にいます。','The same 在 frame works naturally with rooms and places.'],['书在桌子上。','shū zài zhuōzi shàng','The book is on the table.','本は机の上にあります。','Thing + 在 + location tells where the thing is.'],['你在哪儿？','nǐ zài nǎr','Where are you?','どこにいますか。','哪儿 replaces the unknown location after 在.']]],['4 · Everyday actions',[['我每天喝咖啡。','wǒ měitiān hē kāfēi','I drink coffee every day.','私は毎日コーヒーを飲みます。','Time words such as 每天 usually come before the verb.'],['她学中文。','tā xué Zhōngwén','She studies Chinese.','彼女は中国語を勉強しています。','Chinese often uses a simple subject + verb + object frame.'],['我晚上看电视。','wǒ wǎnshang kàn diànshì','I watch TV in the evening.','私は夜テレビを見ます。','晚上 frames when the action happens.'],['我们坐地铁去公司。','wǒmen zuò dìtiě qù gōngsī','We take the subway to the office.','私たちは地下鉄で会社へ行きます。','Transport verb phrase can come before 去 + destination.'],['他回家吃饭。','tā huí jiā chīfàn','He goes home to eat.','彼は家に帰って食事をします。','Two verbs can appear in sequence when one action leads naturally to the next.']]],['5 · Negation & not yet',[['我不喝酒。','wǒ bù hē jiǔ','I do not drink alcohol.','私はお酒を飲みません。','不 commonly negates habits, preferences and general actions.'],['她不吃肉。','tā bù chī ròu','She does not eat meat.','彼女は肉を食べません。','不 + verb is the basic present/general negative frame.'],['我今天没上班。','wǒ jīntiān méi shàngbān','I did not work today.','私は今日は仕事に行きませんでした。','没 commonly negates a completed or past event.'],['他还没来。','tā hái méi lái','He has not come yet.','彼はまだ来ていません。','还没 + verb means “not yet.”'],['我不要这个。','wǒ bú yào zhège','I do not want this one.','これはいりません。','不要 is a useful everyday rejection/refusal chunk.']]],['6 · Essential questions',[['你叫什么名字？','nǐ jiào shénme míngzi','What is your name?','お名前は何ですか。','什么 replaces the unknown noun/content.'],['这是什么？','zhè shì shénme','What is this?','これは何ですか。','这 + 是 + 什么 is a core identification question.'],['那个人是谁？','nà ge rén shì shéi','Who is that person?','あの人は誰ですか。','谁 replaces the unknown person.'],['你去哪儿？','nǐ qù nǎr','Where are you going?','どこへ行きますか。','哪儿 can fill the destination slot after 去.'],['你怎么去学校？','nǐ zěnme qù xuéxiào','How do you go to school?','どうやって学校へ行きますか。','怎么 asks about method or manner.']]],['7 · Time & routine',[['现在几点？','xiànzài jǐ diǎn','What time is it now?','今何時ですか。','几点 asks clock time.'],['今天星期几？','jīntiān xīngqī jǐ','What day of the week is it today?','今日は何曜日ですか。','星期几 asks the day of the week.'],['我七点起床。','wǒ qī diǎn qǐchuáng','I get up at seven.','私は7時に起きます。','Clock time normally appears before the verb.'],['我们中午十二点吃饭。','wǒmen zhōngwǔ shí’èr diǎn chīfàn','We eat at noon at twelve.','私たちは昼12時に食事をします。','Larger time frame usually comes before the exact clock time.'],['明天我不上班。','míngtiān wǒ bù shàngbān','I am not working tomorrow.','明日は仕事がありません。','A future time word can make the time clear without changing the verb form.']]],['8 · Numbers & measure words',[['我要两个苹果。','wǒ yào liǎng ge píngguǒ','I want two apples.','りんごを2個ください。','两 is normally used before measure words when counting two items.'],['请给我一杯水。','qǐng gěi wǒ yì bēi shuǐ','Please give me a glass of water.','水を一杯ください。','杯 is a measure word for cups/glasses of drinks.'],['这本书十块钱。','zhè běn shū shí kuài qián','This book is ten yuan.','この本は10元です。','本 counts books; 块 is common spoken Mandarin for yuan.'],['这个多少钱？','zhège duōshao qián','How much is this?','これはいくらですか。','多少钱 is the basic price question.'],['你家有几口人？','nǐ jiā yǒu jǐ kǒu rén','How many people are in your family?','ご家族は何人ですか。','几 asks a small expected number; 口 can count family members.']]],['9 · Food & buying',[['我想喝茶。','wǒ xiǎng hē chá','I would like to drink tea.','お茶を飲みたいです。','想 + verb expresses a wish or intention.'],['你想吃什么？','nǐ xiǎng chī shénme','What would you like to eat?','何を食べたいですか。','什么 fills the object position after 吃.'],['我要一碗面。','wǒ yào yì wǎn miàn','I would like a bowl of noodles.','麺を一杯ください。','碗 is a measure word for bowlfuls; 我要… is useful when ordering.'],['这个很好吃。','zhège hěn hǎochī','This is delicious.','これはとてもおいしいです。','好吃 is a high-frequency adjective for tasty food.'],['可以用手机支付吗？','kěyǐ yòng shǒujī zhīfù ma','Can I pay by phone?','スマホで支払えますか。','可以…吗 asks whether something is possible/allowed.']]],['10 · Communication repair',[['对不起。','duìbuqǐ','Sorry.','すみません。','A core apology and attention-getting expression.'],['没关系。','méi guānxi','It is okay.','大丈夫です。','A common response to an apology.'],['我不明白。','wǒ bù míngbai','I do not understand.','わかりません。','不明白 is a direct, useful learner survival phrase.'],['请再说一遍。','qǐng zài shuō yí biàn','Please say it again.','もう一度言ってください。','再 + verb means do it again; 遍 counts a complete repetition.'],['请说慢一点。','qǐng shuō màn yìdiǎn','Please speak a little more slowly.','もう少しゆっくり話してください。','Adjective + 一点 softens a request for “a little more/less.”']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function voices(){var v=speechSynthesis.getVoices().filter(function(x){return /^zh/i.test(x.lang)});return v.filter(function(x){return x.localService}).concat(v.filter(function(x){return !x.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function card(x){return '<div class="lesson"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="speak" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="speak slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'文のポイント':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){course.innerHTML=G.map(function(g){return '<div class="chapter">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});lang.textContent=mode==='ja'?'English':'日本語';size.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./interaction-ledger.js"></script><script src="./session-end-analyzer.js"></script><script src="./word-touch-engine.js"></script><script src="./legacy-word-touch-upgrader.js"></script><script src="./light-event-buffer.js"></script><script src="./stale-session-recovery.js"></script></body></html>
