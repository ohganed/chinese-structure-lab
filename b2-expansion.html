<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Structure Lab · B2 Expansion</title><style>body{margin:0;background:#f5f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.head{margin:28px 0}.head h1{font-size:32px}.head p{color:#666;line-height:1.6}.scene{font-size:12px;color:#888;font-weight:700;letter-spacing:.06em;margin:28px 2px 8px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:29px;font-weight:700}.py{font-size:16px;color:#555}.en{font-size:18px;margin-top:10px}.ja{font-size:12px;color:#888}.jp .en{font-size:12px;color:#888}.jp .ja{font-size:18px;color:#222}.btn{border:0;background:#171717;color:#fff;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.slow{background:transparent;color:#333;border:1px solid #bbb;margin-left:6px}details{border-top:1px solid #eee;margin-top:13px;padding-top:11px}summary{font-weight:700}.note{font-size:13px;color:#555;line-height:1.65}.senior .head h1{font-size:42px}.senior .head p{font-size:20px}.senior .scene{font-size:18px}.senior .card{padding:24px}.senior .zh{font-size:43px}.senior .py{font-size:24px}.senior .en,.senior .ja{font-size:22px}.senior.jp .en{font-size:17px}.senior.jp .ja{font-size:23px}.senior .btn{font-size:19px;padding:14px 18px}.senior summary,.senior .note{font-size:19px}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="head"><div>B2 · BUILT-IN EXPANSION · 36 LINES</div><h1>B2 Explain & Negotiate</h1><p data-en="Handle arguments, negotiation, public issues, technology, work decisions and longer structured explanations." data-ja="議論・交渉・社会問題・技術・仕事上の判断・長い説明を、中国語で組み立てます。">Handle arguments, negotiation, public issues, technology, work decisions and longer structured explanations.</p></div><div id="course"></div></div><script>var D=[['1 · Debate',[['我理解你的观点，不过我不完全同意这个结论。','wǒ lǐjiě nǐ de guāndiǎn, búguò wǒ bù wánquán tóngyì zhège jiélùn','I understand your point, but I don’t fully agree with the conclusion.','あなたの考えは理解できますが、その結論には完全には賛成できません。','不完全同意 softens disagreement while keeping the position clear.'],['问题不在于要不要改变，而在于怎么改变。','wèntí bú zài yú yào bú yào gǎibiàn, ér zài yú zěnme gǎibiàn','The issue is not whether to change, but how to change.','問題は変えるかどうかではなく、どう変えるかです。','不在于…而在于… reframes the central issue.'],['如果只看短期成本，确实很难支持这个方案。','rúguǒ zhǐ kàn duǎnqī chéngběn, quèshí hěn nán zhīchí zhège fāng’àn','If we only consider short-term costs, it is indeed hard to support this plan.','短期的なコストだけ見れば、この案を支持しにくいのは確かです。','确实 acknowledges a valid point before qualification.'],['但是从长期来看，收益可能会更大。','dànshì cóng chángqī láikàn, shōuyì kěnéng huì gèng dà','But in the long term, the benefits may be greater.','しかし長期的に見れば、利益はより大きいかもしれません。','从…来看 marks analytical perspective.'],['因此我们不能只比较眼前的数字。','yīncǐ wǒmen bù néng zhǐ bǐjiào yǎnqián de shùzì','Therefore we cannot compare only the immediate figures.','したがって、目先の数字だけを比較することはできません。','因此 is a more formal causal connector.'],['还应该考虑它对未来选择的影响。','hái yīnggāi kǎolǜ tā duì wèilái xuǎnzé de yǐngxiǎng','We should also consider its effect on future choices.','将来の選択肢への影響も考えるべきです。','对…的影响 forms a dense noun phrase common in expository Chinese.']]],['2 · Negotiation',[['我们希望价格可以再调整一点儿。','wǒmen xīwàng jiàgé kěyǐ zài tiáozhěng yìdiǎnr','We hope the price can be adjusted a little further.','価格をもう少し調整していただければと思います。','希望…可以 is polite but direct business negotiation language.'],['如果数量增加，你们能不能给更好的条件？','rúguǒ shùliàng zēngjiā, nǐmen néng bu néng gěi gèng hǎo de tiáojiàn','If the quantity increases, can you offer better terms?','数量を増やした場合、よりよい条件にできますか。','能不能 gives a negotiable yes/no frame.'],['价格方面我们可以谈，但是交货时间不能再推迟。','jiàgé fāngmiàn wǒmen kěyǐ tán, dànshì jiāohuò shíjiān bù néng zài tuīchí','We can discuss the price, but delivery cannot be delayed further.','価格は相談できますが、納期はこれ以上遅らせられません。','方面 marks the dimension under discussion.'],['这一点对我们来说是最重要的条件。','zhè yìdiǎn duì wǒmen láishuō shì zuì zhòngyào de tiáojiàn','This is the most important condition for us.','この点が私たちにとって最も重要な条件です。','对…来说 explicitly marks stakeholder perspective.'],['如果双方都能接受，我觉得今天就可以确定下来。','rúguǒ shuāngfāng dōu néng jiēshòu, wǒ juéde jīntiān jiù kěyǐ quèdìng xiàlái','If both sides can accept it, I think we can finalize it today.','双方が受け入れられれば、今日決定できると思います。','确定下来 emphasizes settling/finalizing a matter.'],['那我们按照这个方向准备新的方案。','nà wǒmen ànzhào zhège fāngxiàng zhǔnbèi xīn de fāng’àn','Then we’ll prepare a new proposal along these lines.','ではこの方向で新しい案を準備します。','按照 = according to / following.']]],['3 · Technology',[['人工智能正在改变人们获取信息的方式。','réngōng zhìnéng zhèngzài gǎibiàn rénmen huòqǔ xìnxī de fāngshì','AI is changing how people obtain information.','AIは人々の情報取得方法を変えつつあります。','正在 marks an ongoing process; 的方式 nominalizes “the way of…”.'],['它的优势是速度快，而且可以处理大量资料。','tā de yōushì shì sùdù kuài, érqiě kěyǐ chǔlǐ dàliàng zīliào','Its advantage is speed and the ability to process large amounts of material.','利点は速さと、大量の資料を処理できることです。','优势是… introduces an evaluative claim.'],['但问题是，速度快并不等于判断一定正确。','dàn wèntí shì, sùdù kuài bìng bù děngyú pànduàn yídìng zhèngquè','But speed does not mean the judgment is necessarily correct.','しかし、速いからといって判断が必ず正しいとは限りません。','并不等于 = does not amount to / does not mean.'],['因此使用者需要知道信息是怎么产生的。','yīncǐ shǐyòngzhě xūyào zhīdào xìnxī shì zěnme chǎnshēng de','Therefore users need to know how information is produced.','そのため利用者は情報がどう作られたか知る必要があります。','是怎么…的 focuses on process/manner.'],['真正重要的也许不是会不会用工具。','zhēnzhèng zhòngyào de yěxǔ bú shì huì bú huì yòng gōngjù','What really matters may not be whether one can use the tool.','本当に重要なのは、道具を使えるかどうかではないかもしれません。','会不会 forms an embedded ability question.'],['而是能不能判断什么时候应该相信它。','ér shì néng bu néng pànduàn shénme shíhou yīnggāi xiāngxìn tā','Rather, it is whether one can judge when to trust it.','むしろ、いつそれを信頼すべきか判断できるかです。','而是 completes the 不是…而是… contrast.']]],['4 · Society & policy',[['城市交通政策往往会影响不同群体的生活方式。','chéngshì jiāotōng zhèngcè wǎngwǎng huì yǐngxiǎng bùtóng qúntǐ de shēnghuó fāngshì','Urban transport policy often affects different groups’ ways of life.','都市交通政策は、異なる集団の生活様式に影響することが多いです。','往往 marks a frequent tendency, useful in analysis.'],['对上班族方便的政策，不一定对老年人也方便。','duì shàngbānzú fāngbiàn de zhèngcè, bù yídìng duì lǎoniánrén yě fāngbiàn','A policy convenient for commuters is not necessarily convenient for older people.','通勤者に便利な政策が、高齢者にも便利とは限りません。','不一定 = not necessarily.'],['所以制定政策时，需要考虑谁会得到好处，谁会承担成本。','suǒyǐ zhìdìng zhèngcè shí, xūyào kǎolǜ shéi huì dédào hǎochu, shéi huì chéngdān chéngběn','So policy design must consider who benefits and who bears the cost.','政策を作る時、誰が利益を得て誰が負担するか考える必要があります。','承担成本 = bear the cost; parallel 谁…谁… structures contrast stakeholders.'],['公平并不意味着每个人都得到完全一样的东西。','gōngpíng bìng bù yìwèizhe měi ge rén dōu dédào wánquán yíyàng de dōngxi','Fairness does not mean everyone gets exactly the same thing.','公平とは、全員が全く同じものを得ることではありません。','并不意味着 is a formal corrective frame.'],['有时候反而需要根据不同需要提供不同支持。','yǒushíhou fǎn’ér xūyào gēnjù bùtóng xūyào tígōng bùtóng zhīchí','Sometimes fairness instead requires different support for different needs.','時には、異なる必要に応じて異なる支援をする必要があります。','反而 marks a counterintuitive conclusion.'],['这也是为什么公共讨论很难简单化。','zhè yě shì wèishénme gōnggòng tǎolùn hěn nán jiǎndānhuà','That is also why public debate is hard to simplify.','これが公共的議論を単純化しにくい理由でもあります。','这也是为什么… explains a higher-level reason.']]],['5 · Workplace decisions',[['目前我们有三个方案，但每个方案都有明显的取舍。','mùqián wǒmen yǒu sān ge fāng’àn, dàn měi ge fāng’àn dōu yǒu míngxiǎn de qǔshě','We currently have three options, but each involves clear trade-offs.','現在3案ありますが、それぞれ明確なトレードオフがあります。','取舍 = trade-off / choices involving gains and losses.'],['第一个成本最低，可是实施时间最长。','dì yī ge chéngběn zuì dī, kěshì shíshī shíjiān zuì cháng','The first costs least, but takes longest to implement.','1案目は最も安いですが、実施に最も時間がかかります。','Parallel superlatives make comparison concise.'],['第二个速度快，不过风险也相对高。','dì èr ge sùdù kuài, búguò fēngxiǎn yě xiāngduì gāo','The second is fast, but the risk is relatively high.','2案目は速いですが、リスクも比較的高いです。','相对 = relatively.'],['第三个比较平衡，只是需要更多人参与。','dì sān ge bǐjiào pínghéng, zhǐshì xūyào gèng duō rén cānyù','The third is more balanced, but requires more people to participate.','3案目はバランスがよいですが、より多くの人手が必要です。','只是 introduces a limiting drawback.'],['如果把长期维护也算进去，我更倾向于第三个。','rúguǒ bǎ chángqī wéihù yě suàn jìnqù, wǒ gèng qīngxiàng yú dì sān ge','If long-term maintenance is included, I lean toward the third.','長期保守も計算に入れるなら、私は3案目に傾きます。','把…算进去 = include something in the calculation.'],['不过在决定之前，我们最好再确认一次数据。','búguò zài juédìng zhīqián, wǒmen zuìhǎo zài quèrèn yí cì shùjù','Before deciding, however, we’d better verify the data once more.','ただ決定前に、データをもう一度確認した方がよいです。','最好 + verb gives a strong recommendation.']]],['6 · Structured explanation',[['这个现象看起来很简单，其实背后有几个不同的原因。','zhège xiànxiàng kànqǐlái hěn jiǎndān, qíshí bèihòu yǒu jǐ ge bùtóng de yuányīn','This phenomenon looks simple, but several different causes lie behind it.','この現象は単純に見えますが、背景には複数の原因があります。','看起来…其实… contrasts appearance and underlying reality.'],['首先，人口结构正在发生变化。','shǒuxiān, rénkǒu jiégòu zhèngzài fāshēng biànhuà','First, the population structure is changing.','まず、人口構造が変化しています。','首先 organizes exposition.'],['其次，人们的消费习惯也跟十年前不一样了。','qícì, rénmen de xiāofèi xíguàn yě gēn shí nián qián bù yíyàng le','Second, consumption habits are also different from ten years ago.','次に、消費習慣も10年前とは異なっています。','其次 marks the second analytical point.'],['另外，技术发展降低了进入市场的成本。','lìngwài, jìshù fāzhǎn jiàngdī le jìnrù shìchǎng de chéngběn','In addition, technological development lowered the cost of entering the market.','さらに、技術発展により市場参入コストが下がりました。','另外 adds an independent factor.'],['这些因素互相影响，所以很难只用一个原因解释。','zhèxiē yīnsù hùxiāng yǐngxiǎng, suǒyǐ hěn nán zhǐ yòng yí ge yuányīn jiěshì','These factors affect one another, so a single-cause explanation is difficult.','これらの要因は相互作用するため、一つの原因だけでは説明しにくいです。','互相 = mutually / one another.'],['如果忽略这种复杂性，结论就可能过于简单。','rúguǒ hūlüè zhè zhǒng fùzáxìng, jiélùn jiù kěnéng guòyú jiǎndān','If we ignore this complexity, the conclusion may become overly simplistic.','この複雑さを無視すると、結論が単純すぎる可能性があります。','过于 is a formal “excessively/too”.']]]];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function voices(){var v=speechSynthesis.getVoices().filter(function(x){return /^zh/i.test(x.lang)});return v.filter(function(x){return x.localService}).concat(v.filter(function(x){return !x.localService}))}function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=voices()[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}function card(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="en">'+x[2]+'</div><div class="ja">'+x[3]+'</div><button class="btn" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="btn slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><details><summary>'+(mode==='ja'?'文のポイント':'Open the structure')+'</summary><div class="note">'+x[4]+'</div></details></div>'}function render(){course.innerHTML=D.map(function(g){return '<div class="scene">'+g[0]+'</div>'+g[1].map(card).join('')}).join('')}app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});render();speechSynthesis.getVoices();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script></body></html>
