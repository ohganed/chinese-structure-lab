<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B1 More · Chinese Structure Lab</title><style>body{margin:0;background:#f5f4ef;font-family:-apple-system,sans-serif;color:#171717}.app{max-width:720px;margin:auto;padding:20px 16px 80px}.back{color:#666;text-decoration:none}.h{margin:28px 0}.h1{font-size:31px;font-weight:800}.sub{color:#666;line-height:1.5}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0}.zh{font-size:28px;font-weight:750}.en{font-size:17px;margin-top:8px}.ja{font-size:12px;color:#888}.note{font-size:13px;color:#555;line-height:1.6;margin-top:10px}.b{border:0;border-radius:999px;padding:10px 14px;margin-top:12px;font-weight:700}.nat{background:#171717;color:#fff}.slow{margin-left:6px;background:transparent;border:1px solid #bbb}.senior .zh{font-size:42px}.senior .en,.senior .note{font-size:21px}.senior .ja{font-size:19px}.jp .en{font-size:12px;color:#999}.jp .ja{font-size:18px;color:#222}</style></head><body><div class="app" id="app"><a class="back" href="./explore.html">‹ Explore</a><div class="h"><div>B1 · CONTINUATION</div><div class="h1">Tell your world</div><div class="sub">24 more lines for stories, opinions, work, culture and explaining problems.</div></div><div id="list"></div></div><script>var D=[['刚开始学中文的时候，我最怕的是声调。','When I first started Chinese, tones scared me most.','中国語を始めた頃、一番怖かったのは声調でした。','的时候 frames a past stage.'],['后来我发现，听得多比背规则更重要。','Later I found that listening a lot matters more than memorizing rules.','その後、規則を覚えるよりたくさん聞く方が大切だと気づきました。','发现 introduces a realization.'],['这次旅行让我对北京有了新的印象。','This trip gave me a new impression of Beijing.','今回の旅行で北京への印象が変わりました。','让 + person + 有了 marks a changed state.'],['我本来想早点儿回家，结果又加班了。','I originally planned to go home early, but ended up working overtime.','早く帰るつもりでしたが、結局また残業しました。','本来…结果… contrasts intention and outcome.'],['对我来说，最难的不是语法，而是自然地开口。','For me, the hardest part is not grammar but speaking naturally.','私にとって一番難しいのは文法ではなく自然に話し始めることです。','不是…而是… sharpens contrast.'],['我同意他的看法，不过理由不完全一样。','I agree with his view, though my reasons are not exactly the same.','彼の意見には賛成ですが、理由は完全には同じではありません。','不过 introduces a softer contrast.'],['我觉得这个办法短期有效，长期不一定合适。','I think this works short-term, but may not suit the long term.','この方法は短期には有効でも長期には適切とは限らないと思います。','不一定 = not necessarily.'],['如果只看价格，很容易忽略质量。','If you only look at price, it’s easy to overlook quality.','価格だけを見ると品質を見落としやすいです。','很容易 + verb = easily tends to.'],['我们先把问题分成三个部分，再一个一个处理。','Let’s divide the problem into three parts and handle them one by one.','問題を3つに分けて一つずつ処理しましょう。','把 structures an affected object.'],['这件事不是谁对谁错的问题。','This isn’t simply a matter of who is right or wrong.','これは誰が正しいか間違いかだけの問題ではありません。','谁对谁错 is a compact contrastive phrase.'],['我已经跟负责人谈过了，他说明天会回复。','I’ve spoken with the person in charge; he said he’ll reply tomorrow.','担当者とは話してあり、明日返事すると言っていました。','谈过 marks prior experience/action.'],['因为资料不完整，我们暂时不能做决定。','Because the information is incomplete, we can’t decide yet.','資料が不完全なので、今は決定できません。','暂时 = for the time being.'],['他把复杂的问题解释得很清楚。','He explained the complicated problem very clearly.','彼は複雑な問題をとても分かりやすく説明しました。','得 complement evaluates manner/result.'],['虽然结果不理想，但我们至少知道问题在哪儿。','Although the result wasn’t ideal, at least we know where the problem is.','結果は理想的ではありませんでしたが、少なくとも問題点は分かりました。','至少 = at least.'],['这家公司这几年变化很大。','This company has changed a lot in recent years.','この会社はここ数年で大きく変わりました。','这几年 = these past few years.'],['越来越多的人选择在家工作。','More and more people are choosing to work from home.','在宅勤務を選ぶ人がますます増えています。','越来越多 = an increasing number.'],['我不反对这个想法，只是担心成本太高。','I don’t oppose the idea; I’m just worried about the cost.','この考えには反対ではなく、ただ費用が高すぎるのが心配です。','只是 narrows the objection.'],['从文化角度来看，这个习惯很有意思。','From a cultural perspective, this custom is interesting.','文化的な観点から見ると、この習慣は興味深いです。','从…角度来看 = from the perspective of.'],['有些话翻译成日语以后，感觉会变。','Some expressions feel different once translated into Japanese.','日本語に訳すと感じが変わる表現があります。','以后 marks the resulting stage.'],['新闻里说，明年可能会有新的规定。','The news says there may be new rules next year.','ニュースでは来年新しい規則ができる可能性があると言っています。','可能会 = may possibly.'],['这个变化对普通人的生活有什么影响？','How does this change affect ordinary people’s lives?','この変化は一般の人の生活にどんな影響がありますか。','对…有什么影响 asks impact.'],['如果情况继续这样发展，问题会越来越明显。','If things keep developing this way, the problem will become more obvious.','このまま進めば問題はますます明確になります。','继续 + verb = continue doing.'],['我想先听听你的意见，再说我的看法。','I want to hear your opinion first, then give mine.','まずあなたの意見を聞いてから自分の考えを話したいです。','再 marks the next step.'],['即使我们意见不同，也可以继续讨论。','Even if we disagree, we can keep discussing.','意見が違っても議論は続けられます。','即使…也… = even if…still…']];var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';function sp(t,r){var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);list.innerHTML=D.map(function(x){return '<div class="card"><div class="zh">'+x[0]+'</div><div class="en">'+x[1]+'</div><div class="ja">'+x[2]+'</div><button class="b nat" onclick="sp(\''+x[0]+'\',.9)">▶ Natural</button><button class="b slow" onclick="sp(\''+x[0]+'\',.4)">Slow · 0.4×</button><div class="note">'+x[3]+'</div></div>'}).join('')}render();</script><script src="./situation-layer.js"></script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script><script src="./evidence-confidence-engine.js"></script><script src="./intervention-budget-engine.js"></script><script src="./learner-agency-engine.js"></script><script src="./learning-rhythm-engine.js"></script><script src="./cognitive-load-guard.js"></script><script src="./underground-governor.js"></script><script src="./decision-trace-ledger.js"></script><script src="./underground-integration-bus.js"></script><script src="./underground-runtime-self-test.js"></script></body></html>
