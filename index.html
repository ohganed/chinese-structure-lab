g:15px;font-weight:760;background:#dedbd2}.nav .primary{background:#111;color:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;background:#f5f4eff2;border-top:1px solid #0000000d;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}.tabs{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tabs a{text-align:center;padding:13px;color:#777;text-decoration:none}.tabs .active{color:#111;font-weight:760}.senior .brand{font-size:20px}.senior .tool,.senior .level{font-size:17px;padding:12px 15px}.senior .hero h1{font-size:42px}.senior .hero p{font-size:20px}.senior .world{padding:22px}.senior .avatar{font-size:52px}.senior .who b{font-size:25px}.senior .who span,.senior .worldline small{font-size:17px}.senior .scene{padding:27px 22px}.senior .sceneTitle{font-size:26px}.senior .flow{font-size:44px}.senior .flowText,.senior .dialogue{font-size:20px}.senior .word{font-size:24px}.senior .word small{font-size:16px}.senior .reveal,.senior .actions button,.senior .nav button{font-size:19px;min-height:56px}.senior .zh{font-size:56px}.senior .py{font-size:28px}.senior .meaning,.senior .ja{font-size:27px}.senior.jp .meaning{font-size:18px}.senior.jp .ja{font-size:27px}.senior .branch b{font-size:25px}.senior .branch span,.senior .memory,.senior .bridge{font-size:18px}@media(max-width:430px){.top{display:block}.tools{margin-top:12px}.flow{font-size:27px}.zh{font-size:38px}.branches{grid-template-columns:1fr}.senior .zh{font-size:50px}}</style></head><body><div class="app" id="app"><div class="top"><div class="brand">Chinese Structure Lab</div><div class="tools"><div class="level">A1 · Connected World</div><button class="tool" id="langBtn" onclick="flipLang()">日本語</button><button class="tool" id="sizeBtn" onclick="flipSize()">A＋</button></div></div><section class="hero"><div class="eyebrow" data-en="ONE WORLD · MANY ENCOUNTERS" data-ja="ひとつの世界で、何度も出会う">ONE WORLD · MANY ENCOUNTERS</div><h1 data-en="People and places come back." data-ja="人も場所も、また戻ってくる。">People and places come back.</h1><p data-en="The situation creates words. Words create sentences. The same language returns later in a new moment." data-ja="状況が言葉を生み、言葉が文になり、その言葉が別の場面でまた戻ってきます。">The situation creates words. Words create sentences.</p></section><section class="world"><div class="worldTop"><div class="avatar" id="avatar"></div><div class="who"><b id="whoName"></b><span id="whoRole"></span></div></div><div class="worldline" id="worldline"></div></section><main class="scene"><div class="sceneTop"><div><div class="eyebrow" id="sceneCategory"></div><div class="sceneTitle" id="sceneTitle"></div></div><div class="progress" id="progress"></div></div><section class="situation"><div class="flow" id="flow"></div><div class="flowText" id="flowText"></div><div class="dialogue" id="dialogue"></div></section><section class="stage"><div class="stageLabel" data-en="WORDS BORN IN THIS MOMENT" data-ja="この場面から生まれる言葉">WORDS BORN IN THIS MOMENT</div><div class="words" id="words"></div><button class="reveal" id="revealBtn" onclick="revealSentence()" data-en="Let the sentence appear ›" data-ja="文を生み出す ›">Let the sentence appear ›</button></section><section class="sentenceBlock" id="sentenceBlock"><div class="stageLabel" data-en="NOW THE WORDS BECOME A SENTENCE" data-ja="言葉が文になる">NOW THE WORDS BECOME A SENTENCE</div><div class="zh" id="zh"></div><div class="pyrow"><div class="py" id="py"></div><button class="pybtn" id="pyBtn" onclick="togglePinyin()"></button></div><div class="meaning" id="en"></div><div class="ja" id="ja"></div><div class="actions"><button class="natural" onclick="speakCurrent(.9)">▶ Natural</button><button class="slow" onclick="speakCurrent(.4)">Slow · 0.4×</button><button class="fuzzy" id="fuzzyBtn" onclick="toggleFuzzy()"></button></div><div class="memory" id="memory"></div><details class="network"><summary data-en="Where can this language go next? ›" data-ja="この言葉は次にどこへ広がる？ ›">Where can this language go next? ›</summary><div class="branches" id="branches"></div><div class="bridge" id="bridge"></div></details></section><div class="nav"><button onclick="prevScene()" data-en="‹ Previous moment" data-ja="‹ 前の場面">‹ Previous moment</button><button class="primary" onclick="nextScene()" data-en="Next moment ›" data-ja="次の場面 ›">Next moment ›</button></div></main></div><div class="bottom"><div class="tabs"><a class="active" href="./index.html" data-en="Continue" data-ja="続き">Continue</a><a href="./explore.html" data-en="Explore" data-ja="探す">Explore</a><a href="./garden.html">Garden</a></div></div><script>var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';var encounters=JSON.parse(localStorage.getItem('csl_encounters')||'{}'),unclear=JSON.parse(localStorage.getItem('csl_unclear')||'{}');var people={me:{emoji:'🧑',en:'You',ja:'あなた',roleEn:'New to the city · learning Chinese',roleJa:'街に来たばかり · 中国語を学んでいる'},wang:{emoji:'🙂',en:'Wang Ming',ja:'王明',roleEn:'A person you met on your first day',roleJa:'最初の日に出会った人'},clerk:{emoji:'🧑‍🍳',en:'Cafe server',ja:'カフェの店員',roleEn:'Works at the cafe Wang Ming likes',roleJa:'王明がよく行くカフェの店員'},pharm:{emoji:'🧑‍⚕️',en:'Pharmacist',ja:'薬剤師',roleEn:'Helps you later when you feel unwell',roleJa:'後で体調を崩したときに助けてくれる'}};var scenes=[{person:'wang',cat:'👋 First meeting',catJa:'👋 最初の出会い',title:'You meet Wang Ming',titleJa:'王明と出会う',flow:['🚪','👀','🙂','👋'],flowEn:'You enter a small cafe. You notice Wang Ming. Your eyes meet. You greet each other.',flowJa:'小さなカフェに入る → 王明に気づく → 目が合う → あいさつする。',dialogueEn:'This is the beginning of a relationship, not an isolated phrase.',dialogueJa:'これは単独の例文ではなく、これから続く人間関係の最初の場面です。',words:[['你','nǐ','you','あなた'],['好','hǎo','good','よい'],['你好','nǐ hǎo','hello','こんにちは']],z:'你好。',p:'nǐ hǎo',e:'Hello.',j:'こんにちは。',branches:[['你呢？','nǐ ne · and you?','あなたは？'],['我叫…','wǒ jiào · my name is…','私は〜といいます'],['很高兴认识你','nice to meet you','お会いできてうれしいです'],['明天见','see you tomorrow','また明日']],bridgeEn:'Later, 王明 will appear again at the cafe, on the subway, and in your weekend plans.',bridgeJa:'この王明は、このあとカフェ・地下鉄・週末の予定でも再登場します。'},{person:'wang',cat:'🍜 Cafe',catJa:'🍜 カフェ',title:'Wang Ming recommends tea',titleJa:'王明がお茶をすすめる',flow:['🙂','📖','🍵','🙋'],flowEn:'Wang Ming shows you the menu. He points to tea. You decide to order one cup.',flowJa:'王明がメニューを見せる → お茶を指す → 飲んでみることにする → 店員を呼ぶ。',dialogueEn:'Because you already know 王明, the new words attach to a familiar person.',dialogueJa:'すでに知っている王明がいるので、新しい言葉が既知の人物に結びつきます。',words:[['我','wǒ','I','私'],['要','yào','would like','ほしい'],['一杯','yì bēi','one cup','一杯'],['茶','chá','tea','お茶']],z:'我要一杯茶。',p:'wǒ yào yì bēi chá',e:'I would like a cup of tea.',j:'お茶を一杯ください。',branches:[['咖啡','coffee','コーヒー'],['水','water','水'],['不要糖','no sugar','砂糖はいりません'],['再来一杯','another cup','もう一杯']],bridgeEn:'The word 要 returns later when you want a ticket and when you want to change a hotel room.',bridgeJa:'要 は、あとで切符が欲しいときや、ホテルで部屋を替えたいときにも戻ってきます。'},{person:'wang',cat:'🚇 City',catJa:'🚇 街',title:'You get separated near the subway',titleJa:'地下鉄の近くで王明とはぐれる',flow:['🏙️','😕','📱','🚇'],flowEn:'You leave the cafe together. In the crowd you lose sight of Wang Ming. You need to find the subway station.',flowJa:'一緒にカフェを出る → 人混みではぐれる → 周囲を確認する → 地下鉄駅を探す。',dialogueEn:'A place from the story now creates a practical question.',dialogueJa:'物語の中の場所が、そのまま実用的な質問を生みます。',words:[['地铁站','dìtiě zhàn','subway station','地下鉄駅'],['在','zài','be at','〜にある'],['哪儿','nǎr','where','どこ']],z:'地铁站在哪儿？',p:'dìtiě zhàn zài nǎr',e:'Where is the subway station?',j:'地下鉄の駅はどこですか。',branches:[['车站','station','駅'],['洗手间','restroom','トイレ'],['一直走','go straight','まっすぐ行く'],['左转','turn left','左に曲がる']],bridgeEn:'在哪儿 will return for hotels, shops and people: 房间在哪儿？王明在哪儿？',bridgeJa:'在哪儿 はホテル・店・人にも広がります：房间在哪儿？ 王明在哪儿？'},{person:'wang',cat:'🛍️ Weekend',catJa:'🛍️ 週末',title:'You shop with Wang Ming',titleJa:'王明と買い物をする',flow:['🙂','👕','🏷️','💴'],flowEn:'On the weekend you meet again. Wang Ming shows you a shirt. You like it and check the price.',flowJa:'週末にまた会う → 王明が服を見せる → 気に入る → 値段を尋ねる。',dialogueEn:'The same person returns, but the language network expands into shopping.',dialogueJa:'同じ人物が戻ってきますが、言葉のネットワークは買い物へ広がります。',words:[['这个','zhège','this','これ'],['多少','duōshao','how much','どれくらい'],['钱','qián','money','お金']],z:'这个多少钱？',p:'zhège duōshao qián',e:'How much is this?',j:'これはいくらですか。',branches:[['那个','that','あれ'],['太贵了','too expensive','高すぎます'],['便宜一点','a little cheaper','少し安く'],['我要这个','I want this','これをください']],bridgeEn:'Notice 要 returning from the cafe: 我要一杯茶 → 我要这个.',bridgeJa:'カフェで出会った 要 が戻ります：我要一杯茶 → 我要这个。'},{person:'pharm',cat:'💊 Health',catJa:'💊 健康',title:'The next morning you feel unwell',titleJa:'翌朝、体調を崩す',flow:['🤒','📱','🙂','💊'],flowEn:'You feel sick. You message Wang Ming. He tells you where the pharmacy is. The pharmacist gives you medicine.',flowJa:'具合が悪い → 王明に連絡する → 薬局を教えてもらう → 薬剤師から薬を受け取る。',dialogueEn:'Now people, places and earlier question patterns all reconnect.',dialogueJa:'ここで人物・場所・以前の質問表現がもう一度つながります。',words:[['一天','yì tiān','per day','一日'],['吃','chī','take / eat','飲む・食べる'],['几次','jǐ cì','how many times','何回']],z:'一天吃几次？',p:'yì tiān chī jǐ cì',e:'How many times a day should I take it?',j:'一日に何回飲みますか。',branches:[['药','medicine','薬'],['头疼','headache','頭痛'],['发烧','fever','発熱'],['不舒服','feel unwell','具合が悪い']],bridgeEn:'Next, this can grow into a short conversation with Wang Ming about how you feel and what happened yesterday.',bridgeJa:'次は、昨日何があったか・今どう感じるかを王明に話す短い会話へ育てられます。'}];var idx=parseInt(localStorage.getItem('csl_scene_index')||'0',10);if(idx<0||idx>=scenes.length)idx=0;var pyShown=false;function speak(t,r){try{var vs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vs.filter(v=>v.localService)[0]||vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}function renderWorld(){var s=scenes[idx],p=people[s.person];avatar.textContent=p.emoji;whoName.textContent=mode==='ja'?p.ja:p.en;whoRole.textContent=mode==='ja'?p.roleJa:p.roleEn;worldline.innerHTML=scenes.map((x,n)=>'<span class="step" style="opacity:'+(n===idx?'1':'.45')+'"><span>'+x.flow[x.flow.length-1]+'</span><small>'+(mode==='ja'?x.titleJa:x.title)+'</small></span>'+(n<scenes.length-1?'<span class="arr">→</span>':'')).join('')}function render(){var s=scenes[idx];sceneCategory.textContent=mode==='ja'?s.catJa:s.cat;sceneTitle.textContent=mode==='ja'?s.titleJa:s.title;progress.textContent=(idx+1)+' / '+scenes.length;flow.innerHTML=s.flow.map((x,n)=>'<span>'+x+'</span>'+(n<s.flow.length-1?'<span class="arrow">→</span>':'')).join('');flowText.textContent=mode==='ja'?s.flowJa:s.flowEn;dialogue.textContent=mode==='ja'?s.dialogueJa:s.dialogueEn;words.innerHTML=s.words.map(w=>'<button class="word" onclick="speak(\''+w[0]+'\',.8)">'+w[0]+'<small>'+w[1]+' · '+(mode==='ja'?w[3]:w[2])+'</small></button>').join('');zh.textContent=s.z;en.textContent=s.e;ja.textContent=s.j;py.textContent=pyShown?s.p:'';pyBtn.textContent=pyShown?(mode==='ja'?'拼音を隠す':'Hide Pinyin'):(mode==='ja'?'拼音を見る':'Show Pinyin');fuzzyBtn.textContent=unclear[s.z]?(mode==='ja'?'曖昧として記録済み':'Marked fuzzy'):(mode==='ja'?'まだ曖昧':'Still fuzzy');fuzzyBtn.classList.toggle('on',!!unclear[s.z]);var n=encounters[s.z]||0;memory.textContent=n?(mode==='ja'?'この文との再会：'+n+'回':'You have met this sentence '+n+' time'+(n>1?'s':'')):(mode==='ja'?'この文はまだ新しい表現です。':'This sentence is still new.');branches.innerHTML=s.branches.map(b=>'<div class="branch"><b>'+b[0]+'</b><span>'+b[1]+(mode==='ja'?' · '+b[2]:'')+'</span></div>').join('');bridge.textContent=mode==='ja'?s.bridgeJa:s.bridgeEn;sentenceBlock.style.display='none';revealBtn.style.display='inline-block';pyShown=false;localStorage.setItem('csl_scene_index',String(idx));renderWorld()}function revealSentence(){var s=scenes[idx];sentenceBlock.style.display='block';revealBtn.style.display='none';encounters[s.z]=(encounters[s.z]||0)+1;localStorage.setItem('csl_encounters',JSON.stringify(encounters));speak(s.z,.9);refreshSentence()}function refreshSentence(){var s=scenes[idx];sentenceBlock.style.display='block';revealBtn.style.display='none';py.textContent=pyShown?s.p:'';var n=encounters[s.z]||0;memory.textContent=n?(mode==='ja'?'この文との再会：'+n+'回':'You have met this sentence '+n+' time'+(n>1?'s':'')):''}function togglePinyin(){pyShown=!pyShown;refreshSentence();pyBtn.textContent=pyShown?(mode==='ja'?'拼音を隠す':'Hide Pinyin'):(mode==='ja'?'拼音を見る':'Show Pinyin')}function speakCurrent(r){speak(scenes[idx].z,r)}function toggleFuzzy(){var z=scenes[idx].z;unclear[z]=!unclear[z];localStorage.setItem('csl_unclear',JSON.stringify(unclear));refreshSentence();fuzzyBtn.textContent=unclear[z]?(mode==='ja'?'曖昧として記録済み':'Marked fuzzy'):(mode==='ja'?'まだ曖昧':'Still fuzzy');fuzzyBtn.classList.toggle('on',!!unclear[z])}function nextScene(){idx=(idx+1)%scenes.length;render()}function prevScene(){idx=(idx-1+scenes.length)%scenes.length;render()}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en'));langBtn.textContent=mode==='ja'?'English':'日本語';sizeBtn.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script><script src="./storage-core.js"></script><script src="./feedback-layer.js"></script><script src="./session-guide.js"></script><script src="./reencounter-layer.js"></script><script src="./platform-bridge.js"></script><script src="./audio-haptics-layer.js"></script><script src="./learning-memory-engine.js"></script><script src="./learner-model-engine.js"></script><script src="./reencounter-planner.js"></script><script src="./learning-os-core.js"></script><script src="./interactive-cues.js"></script><script src="./senior-accessibility.js"></script><script src="./situation-graph-engine.js"></script><script src="./a1-pedagogy-layer.js"></script><script src="./curriculum-pedagogy-layer.js"></script><script src="./persistent-world-engine.js"></script><script src="./language-graph-engine.js"></script><script src="./meaning-sense-graph-engine.js"></script><script src="./encounter-quality-engine.js"></script><script src="./retrieval-need-engine.js"></script><script src="./opportunity-matching-engine.js"></script><script src="./adaptive-presentation-engine.js"></script><script src="./presentation-policy-layer.js"></script><script src="./contradiction-quality-auditor.js"></script><script src="./evidence-confidence-engine.js"></script><script src="./intervention-budget-engine.js"></script><script src="./learner-agency-engine.js"></script><script src="./learning-rhythm-engine.js"></script></body></html>
