onclick="toggleUnclear()" data-en="Still fuzzy" data-ja="まだ曖昧">Still fuzzy</button></div><div class="memory" id="memory"></div><div class="doors"><details><summary data-en="Open only if needed · Sound" data-ja="必要なら開く · 音">Open only if needed · Sound</summary><div class="detail" id="soundNote"></div></details><details><summary data-en="Open only if needed · Structure" data-ja="必要なら開く · 文の構造">Open only if needed · Structure</summary><div class="detail" id="structure"></div></details></div></article><div class="nav"><button onclick="prev()" data-en="‹ Previous" data-ja="‹ 前へ">‹ Previous</button><button class="primary" onclick="next()" data-en="Next ›" data-ja="次へ ›">Next ›</button></div></main><section class="finish" id="finish"><h2 data-en="Enough for today." data-ja="今日はここまでで十分。">Enough for today.</h2><p id="finishText"></p><a href="./explore.html" data-en="Explore if you want" data-ja="まだやりたければ探す">Explore if you want</a><div class="quiet" data-en="No score. No streak pressure. The language will return when it is useful." data-ja="点数も連続記録の圧力もありません。必要な頃に、また言葉が戻ってきます。">No score. No streak pressure.</div></section></div><div class="bottom"><div class="tabs"><a class="active" href="./index.html" data-en="Continue" data-ja="続き">Continue</a><a href="./explore.html" data-en="Explore" data-ja="探す">Explore</a><a href="./garden.html">Garden</a></div></div><script>var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';var pool=[

{z:'我住在东京。',p:'wǒ zhù zài Dōngjīng',e:'I live in Tokyo.',j:'東京に住んでいます。',s:'住在 is worth hearing as a chunk.',st:'我 + 住在 + place.'},

];var encounters=JSON.parse(localStorage.getItem('csl_encounters')||'{}'),unclear=JSON.parse(localStorage.getItem('csl_unclear')||'{}'),lastSeen=JSON.parse(localStorage.getItem('csl_last_seen')||'{}');function age(z){return lastSeen[z]?Date.now()-lastSeen[z]:Infinity}function byOld(a,b){return age(b.z)-age(a.z)}function buildMix(){var fuzzy=pool.filter(x=>unclear[x.z]).sort(byOld),seen=pool.filter(x=>encounters[x.z]&&!unclear[x.z]).sort(byOld),fresh=pool.filter(x=>!encounters[x.z]&&!unclear[x.z]);var out=[];function add(arr,n,k){for(var x of arr){if(out.length>=6||n<=0)break;if(!out.some(y=>y.z===x.z)){x.kind=k;out.push(x);n--}}}add(fuzzy,2,'fuzzy');add(seen,2,'revisit');add(fresh,2,'new');add(fresh,6,'new');add(seen,6,'revisit');add(fuzzy,6,'fuzzy');return out.slice(0,6)}var items=buildMix();if(!items.length){items=pool.slice(0,6).map(x=>Object.assign({},x,{kind:'new'}))}var i=0,limit=items.length,sessionStart=Date.now();function label(k){if(k==='fuzzy')return mode==='ja'?'曖昧だった表現':'Fuzzy before';if(k==='revisit')return mode==='ja'?'再会':'Revisit';return mode==='ja'?'新しい表現':'New'}function render(){var x=items[i];zh.textContent=x.z;py.textContent=x.p;en.textContent=x.e;ja.textContent=x.j;soundNote.textContent=x.s;structure.textContent=x.st;progress.textContent=(i+1)+' / '+limit;kind.textContent=label(x.kind);kind.className='kind '+x.kind;unclearBtn.classList.toggle('on',!!unclear[x.z]);unclearBtn.textContent=unclear[x.z]?(mode==='ja'?'曖昧として記録済み':'Marked fuzzy'):(mode==='ja'?'まだ曖昧':'Still fuzzy');var n=encounters[x.z]||0;if(n){var d=Math.max(0,Math.floor(age(x.z)/86400000));memory.textContent=mode==='ja'?('この表現とは '+n+'回目の再会'+(d?' · 前回は'+d+'日前':' · 今日も会いました')):('Encounter '+n+(d?' · last seen '+d+' day'+(d>1?'s':'')+' ago':' · seen today'))}else memory.textContent=mode==='ja'?'今日が最初の出会いです。':'First encounter today.'}function chooseVoice(){var vs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));return vs.filter(v=>v.localService)[0]||vs[0]||null}function speakText(t,r,done){try{var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=chooseVoice();if(done)u.onend=done;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){if(done)done()}}function speakCurrent(r){speakText(items[i].z,r)}function playScene(){var n=0;speechSynthesis.cancel();function go(){if(n>=limit)return;var u=new SpeechSynthesisUtterance(items[n++].z);u.lang='zh-CN';u.rate=.9;u.voice=chooseVoice();u.onend=function(){setTimeout(go,450)};speechSynthesis.speak(u)}go()}function toggleUnclear(){var z=items[i].z;unclear[z]=!unclear[z];localStorage.setItem('csl_unclear',JSON.stringify(unclear));render()}function meet(){var z=items[i].z;encounters[z]=(encounters[z]||0)+1;lastSeen[z]=Date.now();localStorage.setItem('csl_encounters',JSON.stringify(encounters));localStorage.setItem('csl_last_seen',JSON.stringify(lastSeen))}function next(){meet();if(i+1>=limit){finishStudy();return}i++;render()}function prev(){if(i>0){i--;render()}}function oneMinute(){limit=1;i=0;apply();render()}function resumeNormal(){items=buildMix();limit=items.length;i=0;apply();render()}function finishStudy(){meet();study.style.display='none';finish.style.display='block';var mins=Math.max(1,Math.round((Date.now()-sessionStart)/60000));finishText.textContent=mode==='ja'?(mins+'分 · '+limit+'文に触れました。新しい文と再会を混ぜています。'):(mins+' min · '+limit+' lines · new and familiar language mixed quietly.');var s=JSON.parse(localStorage.getItem('csl_sessions')||'[]');s.push({start:sessionStart,end:Date.now(),minutes:mins,course:'Today Mix',lines:limit});localStorage.setItem('csl_sessions',JSON.stringify(s.slice(-200)))}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en')});langBtn.textContent=mode==='ja'?'English':'日本語';sizeBtn.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';todaySub.textContent=limit===1?(mode==='ja'?'1文 · 約1分 · それだけで終了':'1 line · about 1 minute · stop there'):(mode==='ja'?(limit+'文 · 新しい文 + 再会 + 曖昧だった文'): (limit+' lines · new + revisit + fuzzy'));render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script></body></html>
