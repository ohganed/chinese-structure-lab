<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Chinese Structure Lab · Today</title><style>:root{--bg:#f5f4ef;--ink:#171717;--muted:#777;--card:#fff;--soft:#eeece5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:14px;font-weight:750}.tools{display:flex;gap:7px;flex-wrap:wrap}.tool,.level{border:0;background:#ffffffc9;border-radius:999px;padding:9px 11px;font-weight:700;color:#555}.hero{margin:34px 0 18px}.eyebrow{font-size:11px;letter-spacing:.09em;color:#888;text-transform:uppercase}.hero h1{font-size:31px;margin:7px 0}.hero p{color:#777;line-height:1.6;margin:0}.scene{background:var(--card);border-radius:28px;padding:22px 18px;box-shadow:0 12px 34px #00000008}.sceneTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.sceneTitle{font-size:18px;font-weight:750}.progress{font-size:12px;color:#777}.situation{margin-top:18px;background:#f1efe9;border-radius:22px;padding:18px}.flow{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:30px}.arrow{font-size:16px;color:#999}.flowText{margin-top:12px;font-size:15px;color:#555;line-height:1.55}.stage{margin-top:21px}.stageLabel{font-size:11px;letter-spacing:.08em;color:#888;text-transform:uppercase}.words{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.word{border:0;background:#ece9e1;border-radius:999px;padding:11px 14px;font-size:17px;font-weight:700}.word small{display:block;font-size:11px;color:#777;font-weight:500;margin-top:2px}.reveal{border:0;background:#111;color:#fff;border-radius:999px;padding:13px 18px;font-weight:750;margin-top:14px}.sentenceBlock{display:none;margin-top:17px;border-top:1px solid #eee;padding-top:18px}.zh{font-size:42px;font-weight:780;line-height:1.3}.pyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.py{font-size:20px;color:#555}.pybtn{border:0;background:#efede7;border-radius:999px;padding:8px 11px;font-weight:700;color:#555}.meaning{font-size:22px;margin-top:14px}.ja{font-size:12px;color:#888;margin-top:4px}.jp .meaning{font-size:12px;color:#888}.jp .ja{font-size:22px;color:#171717}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{border:0;border-radius:999px;padding:12px 14px;font-weight:750}.natural{background:#111;color:#fff}.slow{background:#efede7}.fuzzy{background:transparent;border:1px solid #d5d1c8!important;color:#666}.fuzzy.on{background:#e9e2d8;color:#111}.network{margin-top:18px;border-top:1px solid #eee;padding-top:15px}.network summary{font-weight:750;cursor:pointer;list-style:none}.network summary::-webkit-details-marker{display:none}.branches{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.branch{background:#f2f0ea;border-radius:16px;padding:12px}.branch b{display:block;font-size:18px}.branch span{font-size:12px;color:#666}.memory{font-size:12px;color:#777;margin-top:13px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.nav button{border:0;border-radius:18px;padding:15px;font-weight:750;background:#dedbd2}.nav .primary{background:#111;color:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;background:#f5f4eff2;border-top:1px solid #0000000d;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}.tabs{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tabs a{text-align:center;padding:13px;color:#777;text-decoration:none}.tabs .active{color:#111;font-weight:750}.senior .brand{font-size:20px}.senior .tool,.senior .level{font-size:17px;padding:12px 15px}.senior .hero h1{font-size:42px}.senior .hero p{font-size:20px}.senior .scene{padding:27px 22px}.senior .sceneTitle{font-size:26px}.senior .flow{font-size:44px}.senior .flowText{font-size:21px}.senior .stageLabel{font-size:16px}.senior .word{font-size:24px;padding:14px 17px}.senior .word small{font-size:16px}.senior .reveal,.senior .actions button,.senior .nav button{font-size:19px;min-height:56px}.senior .zh{font-size:56px}.senior .py{font-size:28px}.senior .meaning,.senior .ja{font-size:27px}.senior.jp .meaning{font-size:18px}.senior.jp .ja{font-size:27px}.senior .network summary{font-size:21px}.senior .branch b{font-size:25px}.senior .branch span,.senior .memory{font-size:18px}.senior .tabs a{font-size:19px}@media(max-width:430px){.top{display:block}.tools{margin-top:12px}.flow{font-size:27px}.zh{font-size:38px}.branches{grid-template-columns:1fr}.senior .zh{font-size:50px}}</style></head><body><div class="app" id="app"><div class="top"><div class="brand">Chinese Structure Lab</div><div class="tools"><div class="level">A1 · Today</div><button class="tool" id="langBtn" onclick="flipLang()">日本語</button><button class="tool" id="sizeBtn" onclick="flipSize()">A＋</button></div></div><section class="hero"><div class="eyebrow" data-en="SITUATION FIRST" data-ja="まず状況から">SITUATION FIRST</div><h1 data-en="See the moment. Then grow the language." data-ja="場面をつかんで、そこから言葉を育てる。">See the moment. Then grow the language.</h1><p data-en="Situation → useful words → one sentence → related language. No isolated sentence memorizing." data-ja="状況 → 使う単語 → ひとつの文 → 関連する言葉へ。短文だけを孤立して覚えません。">Situation → useful words → one sentence → related language.</p></section><main class="scene"><div class="sceneTop"><div><div class="eyebrow" id="sceneCategory"></div><div class="sceneTitle" id="sceneTitle"></div></div><div class="progress" id="progress"></div></div><section class="situation"><div class="flow" id="flow"></div><div class="flowText" id="flowText"></div></section><section class="stage"><div class="stageLabel" data-en="WORDS IN THIS MOMENT" data-ja="この場面で使う言葉">WORDS IN THIS MOMENT</div><div class="words" id="words"></div><button class="reveal" id="revealBtn" onclick="revealSentence()" data-en="Open the sentence ›" data-ja="文を開く ›">Open the sentence ›</button></section><section class="sentenceBlock" id="sentenceBlock"><div class="stageLabel" data-en="THE SENTENCE GROWS FROM THE SCENE" data-ja="場面から文へ">THE SENTENCE GROWS FROM THE SCENE</div><div class="zh" id="zh"></div><div class="pyrow"><div class="py" id="py"></div><button class="pybtn" id="pyBtn" onclick="togglePinyin()"></button></div><div class="meaning" id="en"></div><div class="ja" id="ja"></div><div class="actions"><button class="natural" onclick="speakCurrent(.9)">▶ Natural</button><button class="slow" onclick="speakCurrent(.4)">Slow · 0.4×</button><button class="fuzzy" id="fuzzyBtn" onclick="toggleFuzzy()"></button></div><div class="memory" id="memory"></div><details class="network"><summary data-en="Grow the network ›" data-ja="言葉のネットワークを広げる ›">Grow the network ›</summary><div class="branches" id="branches"></div></details></section><div class="nav"><button onclick="prevScene()" data-en="‹ Previous scene" data-ja="‹ 前の場面">‹ Previous scene</button><button class="primary" onclick="nextScene()" data-en="Next scene ›" data-ja="次の場面 ›">Next scene ›</button></div></main></div><div class="bottom"><div class="tabs"><a class="active" href="./index.html" data-en="Continue" data-ja="続き">Continue</a><a href="./explore.html" data-en="Explore" data-ja="探す">Explore</a><a href="./garden.html">Garden</a></div></div><script>var mode=localStorage.getItem('csl_ui_language')||'en',large=localStorage.getItem('csl_large_text')==='1';var encounters=JSON.parse(localStorage.getItem('csl_encounters')||'{}'),unclear=JSON.parse(localStorage.getItem('csl_unclear')||'{}');var scenes=[{cat:'👋 Greeting',catJa:'👋 あいさつ',title:'Meeting someone',titleJa:'人に会う',flow:['🚪','👀','🙂','👋'],flowEn:'You enter. You notice someone. You make eye contact. You greet them.',flowJa:'入る → 人に気づく → 目が合う → あいさつする。',words:[['你','nǐ','you','あなた'],['好','hǎo','good','よい'],['你好','nǐ hǎo','hello','こんにちは']],z:'你好。',p:'nǐ hǎo',e:'Hello.',j:'こんにちは。',branches:[['你们','nǐmen · you all','あなたたち'],['很好','hěn hǎo · very good','とてもよい'],['你呢？','nǐ ne · and you?','あなたは？'],['明天见','míngtiān jiàn · see you tomorrow','また明日']]},{cat:'🍜 Food',catJa:'🍜 食事',title:'Ordering a drink',titleJa:'飲み物を注文する',flow:['🪑','📖','☕','🙋'],flowEn:'You sit down. You look at the menu. You choose tea. You call the server.',flowJa:'座る → メニューを見る → お茶を選ぶ → 店員に注文する。',words:[['我','wǒ','I','私'],['要','yào','want / would like','ほしい'],['一杯','yì bēi','one cup','一杯'],['茶','chá','tea','お茶']],z:'我要一杯茶。',p:'wǒ yào yì bēi chá',e:'I would like a cup of tea.',j:'お茶を一杯ください。',branches:[['咖啡','kāfēi · coffee','コーヒー'],['水','shuǐ · water','水'],['不要糖','bú yào táng · no sugar','砂糖はいりません'],['再来一杯','zài lái yì bēi · another cup','もう一杯']]},{cat:'🚇 Transport',catJa:'🚇 交通',title:'Looking for the subway',titleJa:'地下鉄を探す',flow:['🏙️','😕','📍','🚇'],flowEn:'You are in the city. You are unsure where to go. You ask for the location. You want the subway station.',flowJa:'街にいる → 場所が分からない → 所在を尋ねる → 地下鉄駅を探す。',words:[['地铁站','dìtiě zhàn','subway station','地下鉄駅'],['在','zài','be at','〜にある'],['哪儿','nǎr','where','どこ']],z:'地铁站在哪儿？',p:'dìtiě zhàn zài nǎr',e:'Where is the subway station?',j:'地下鉄の駅はどこですか。',branches:[['车站','chēzhàn · station','駅'],['洗手间','xǐshǒujiān · restroom','トイレ'],['一直走','yìzhí zǒu · go straight','まっすぐ行く'],['左转','zuǒ zhuǎn · turn left','左に曲がる']]},{cat:'🛍️ Shopping',catJa:'🛍️ 買い物',title:'Checking the price',titleJa:'値段を聞く',flow:['👀','🤔','🏷️','💴'],flowEn:'You see something you like. You consider it. You check the price. You ask how much it is.',flowJa:'商品を見る → 気になる → 値段を確認する → いくらか尋ねる。',words:[['这个','zhège','this','これ'],['多少','duōshao','how much / how many','どれくらい'],['钱','qián','money','お金']],z:'这个多少钱？',p:'zhège duōshao qián',e:'How much is this?',j:'これはいくらですか。',branches:[['那个','nàge · that','あれ'],['太贵了','tài guì le · too expensive','高すぎます'],['便宜一点','piányi yìdiǎn · a little cheaper','少し安く'],['我要这个','wǒ yào zhège · I want this','これをください']]},{cat:'💊 Health',catJa:'💊 健康',title:'At the pharmacy',titleJa:'薬局で',flow:['🤒','🚶','💊','❓'],flowEn:'You feel sick. You go to a pharmacy. You get medicine. You need to know how often to take it.',flowJa:'体調が悪い → 薬局へ行く → 薬を受け取る → 飲む回数を確認する。',words:[['一天','yì tiān','one day / per day','一日'],['吃','chī','take / eat','飲む・食べる'],['几次','jǐ cì','how many times','何回']],z:'一天吃几次？',p:'yì tiān chī jǐ cì',e:'How many times a day should I take it?',j:'一日に何回飲みますか。',branches:[['药','yào · medicine','薬'],['头疼','tóuténg · headache','頭痛'],['发烧','fāshāo · fever','発熱'],['不舒服','bù shūfu · feel unwell','具合が悪い']]}];var idx=parseInt(localStorage.getItem('csl_scene_index')||'0',10);if(idx<0||idx>=scenes.length)idx=0;var pyShown=false;function speak(t,r){try{var vs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=r;u.voice=vs.filter(v=>v.localService)[0]||vs[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}function render(){var s=scenes[idx];sceneCategory.textContent=mode==='ja'?s.catJa:s.cat;sceneTitle.textContent=mode==='ja'?s.titleJa:s.title;progress.textContent=(idx+1)+' / '+scenes.length;flow.innerHTML=s.flow.map((x,n)=>'<span>'+x+'</span>'+(n<s.flow.length-1?'<span class="arrow">→</span>':'')).join('');flowText.textContent=mode==='ja'?s.flowJa:s.flowEn;words.innerHTML=s.words.map(w=>'<button class="word" onclick="speak(\''+w[0]+'\',.8)">'+w[0]+'<small>'+w[1]+' · '+(mode==='ja'?w[3]:w[2])+'</small></button>').join('');zh.textContent=s.z;en.textContent=s.e;ja.textContent=s.j;py.textContent=pyShown?s.p:'';pyBtn.textContent=pyShown?(mode==='ja'?'拼音を隠す':'Hide Pinyin'):(mode==='ja'?'拼音を見る':'Show Pinyin');fuzzyBtn.textContent=unclear[s.z]?(mode==='ja'?'曖昧として記録済み':'Marked fuzzy'):(mode==='ja'?'まだ曖昧':'Still fuzzy');fuzzyBtn.classList.toggle('on',!!unclear[s.z]);var n=encounters[s.z]||0;memory.textContent=n?(mode==='ja'?'この文との再会：'+n+'回':'You have met this sentence '+n+' time'+(n>1?'s':'')):(mode==='ja'?'この文はまだ新しい表現です。':'This sentence is still new.');branches.innerHTML=s.branches.map(b=>'<div class="branch"><b>'+b[0]+'</b><span>'+b[1]+' · '+(mode==='ja'?b[2]:'')+'</span></div>').join('');sentenceBlock.style.display='none';revealBtn.style.display='inline-block';pyShown=false;localStorage.setItem('csl_scene_index',String(idx))}function revealSentence(){var s=scenes[idx];sentenceBlock.style.display='block';revealBtn.style.display='none';encounters[s.z]=(encounters[s.z]||0)+1;localStorage.setItem('csl_encounters',JSON.stringify(encounters));speak(s.z,.9);renderSentenceOnly()}function renderSentenceOnly(){var s=scenes[idx];sentenceBlock.style.display='block';revealBtn.style.display='none';py.textContent=pyShown?s.p:'';var n=encounters[s.z]||0;memory.textContent=n?(mode==='ja'?'この文との再会：'+n+'回':'You have met this sentence '+n+' time'+(n>1?'s':'')):''}function togglePinyin(){pyShown=!pyShown;renderSentenceOnly();pyBtn.textContent=pyShown?(mode==='ja'?'拼音を隠す':'Hide Pinyin'):(mode==='ja'?'拼音を見る':'Show Pinyin')}function speakCurrent(r){speak(scenes[idx].z,r)}function toggleFuzzy(){var z=scenes[idx].z;unclear[z]=!unclear[z];localStorage.setItem('csl_unclear',JSON.stringify(unclear));renderSentenceOnly();fuzzyBtn.textContent=unclear[z]?(mode==='ja'?'曖昧として記録済み':'Marked fuzzy'):(mode==='ja'?'まだ曖昧':'Still fuzzy');fuzzyBtn.classList.toggle('on',!!unclear[z])}function nextScene(){idx=(idx+1)%scenes.length;render()}function prevScene(){idx=(idx-1+scenes.length)%scenes.length;render()}function apply(){document.documentElement.lang=mode==='ja'?'ja':'en';app.classList.toggle('jp',mode==='ja');app.classList.toggle('senior',large);document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.getAttribute(mode==='ja'?'data-ja':'data-en'));langBtn.textContent=mode==='ja'?'English':'日本語';sizeBtn.textContent=large?(mode==='ja'?'標準文字':'Standard text'):'A＋';render()}function flipLang(){mode=mode==='en'?'ja':'en';localStorage.setItem('csl_ui_language',mode);apply()}function flipSize(){large=!large;localStorage.setItem('csl_large_text',large?'1':'0');apply()}apply();speechSynthesis.getVoices();</script></body></html>
